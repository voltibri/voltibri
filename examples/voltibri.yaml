# Example: Fronius GEN24 + BYD HVM, Hoymiles via OpenDTU, two go-e, Shelly.
#
# Normally the configuration lives in the database and is edited in the UI.
# Import this file once:     voltibri config import examples/voltibri.yaml
# or let the file manage it: voltibri serve -config voltibri.yaml   (read-only mode)
#
# Start with dryRun: true and watch the log: voltibri logs every write it
# WOULD do. Only switch to false after checking the decisions for a few days.
site:
  timezone: Europe/Berlin
  listen: 127.0.0.1:7070 # no authentication yet – do not expose
  dryRun: true
  holidays: [] # regional holidays, e.g. "2026-06-04" (Fronleichnam)

battery:
  capacityWh: 13800 # BYD HVM 13.8
  maxChargeW: 5000
  maxDischargeW: 5000
  minSoC: 0.05

planner:
  morningBufferSoC: 0.25    # SoC left when PV takes over in the morning
  safetyMarginSoC: 0.05
  pvPessimism: 0.8          # plan with 80 % of the PV forecast
  robustness: 1.3           # delay only if surplus >= 1.3 x needed energy
  fillOnNegativePrice: false # true = fill battery completely at negative prices

roles:
  grid: fronius
  pv: [fronius, opendtu]
  battery: fronius
  pvForecast: pvforecast
  tariff: spot

devices:
  - id: fronius
    name: Dach
    icon: solar
    type: fronius
    mode: owned # voltibri may limit battery charging
    params:
      host: 192.168.1.50
      capacityWh: 13800
      modbusPort: 502
      unitID: 1
      revert: 5m # inverter falls back to normal operation after 5 min without voltibri

  - id: opendtu
    name: Hoymiles
    icon: balcony
    type: opendtu
    mode: observed
    params:
      host: 192.168.1.60

  - id: wallbox1
    name: Wallbox Carport
    icon: car
    type: go-e
    mode: delegated # e.g. controlled by Ostrom NeoGrid – voltibri only observes
    correction:      # go-e reports ~200 W less than it draws while charging
      offsetW: 200
      activeAboveW: 50
    params:
      host: 192.168.1.70

  - id: wallbox2
    name: Wallbox Garage
    icon: car
    type: go-e
    mode: observed
    correction:
      offsetW: 200
      activeAboveW: 50
    params:
      host: 192.168.1.71

  - id: heatpump-plug
    name: Wärmepumpe
    icon: heatpump
    type: shelly
    mode: observed
    params:
      host: 192.168.1.80

  - id: pvforecast
    type: forecast.solar
    params:
      lat: 51.0
      lon: 10.0
      planes:
        - { dec: 30, az: -90, kwp: 5.0 } # east
        - { dec: 30, az: 90, kwp: 5.0 }  # west

  - id: spot
    type: awattar

  # Fahrzeuge aus der Tibber-App (Tibber Data API). API-Client unter
  # https://data-api.tibber.com/clients/manage anlegen, Redirect-URI:
  # http://<voltibri-adresse>/api/oauth/callback – danach auf der voltibri-
  # Seite unter „Laden“ einmal bei Tibber anmelden.
  # - id: tibber
  #   name: Tibber
  #   type: tibber
  #   params:
  #     clientId: "..."
  #     clientSecret: "..."

# Preise in ct/kWh (wie bei evcc: fest, zeitvariabel mit Zonen oder dynamisch)
tariffs:
  currency: EUR
  grid:
    type: dynamic           # Börsenpreis + Aufschlag, dann Mehrwertsteuer
    source: spot
    charges: 18.5           # Netzentgelt, Umlagen, Stromsteuer, Marge
    tax: 0.19
  feedin:
    type: fixed
    price: 7.9
  # eigener Zähler für die Wallbox (z. B. Messkonzept 40), zeitvariabel:
  # charging:
  #   type: fixed
  #   price: 28
  #   zones:
  #     - { days: Mo-Fr, hours: 22-6, price: 22 }

# Jede Wallbox ist ein Ladepunkt; hier nur Feineinstellungen.
charging:
  batteryPrioritySoC: 0.5   # darunter bekommt die Hausbatterie den PV-Überschuss zuerst
  loadpoints:
    - charger: wallbox2
      phases: 3
      minCurrent: 6
      maxCurrent: 16
      guest: share          # share | batteryFirst | forceBattery
      guestMode: fast       # Lademodus für Gastfahrzeuge

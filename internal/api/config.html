<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>voltibri · Konfiguration</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="voltibri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="common.css">
<style>
  .toc { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .toc a { font-size:12px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--fg); text-decoration:none; }
  .toc a:hover { border-color:var(--home); }
  .toc a .n { color:var(--muted); margin-left:4px; }
  .area { scroll-margin-top:12px; }
  .area .head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .area .head h2 { margin:0; font-size:15px; }
  .area .head .ic { color:var(--muted); display:flex; }
  .area .head .spacer { flex:1; }
  .area > .why { margin:0 0 10px; }
  .devs { display:flex; flex-direction:column; }
  .dev { display:grid; grid-template-columns:28px minmax(0,1fr) auto auto; align-items:center; gap:4px 12px; padding:10px 0; border-top:1px solid var(--line); }
  .dev .ic { color:var(--muted); display:flex; }
  .dev .nm { font-weight:600; font-size:14px; overflow-wrap:anywhere; }
  .dev .meta { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; overflow-wrap:anywhere; }
  .dev .val { font-variant-numeric:tabular-nums; font-size:14px; text-align:right; white-space:nowrap; }
  .dev .extra { grid-column:2 / -1; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; }
  .dev .extra b { color:var(--fg); font-weight:500; }
  .chip { font-size:11px; padding:1px 8px; border-radius:99px; background:var(--track); color:var(--fg); white-space:nowrap; }
  .chip.ctl { background:rgba(61,111,182,.14); color:var(--home); }
  .chip.dry { background:rgba(181,74,42,.12); color:var(--warn); }
  .chip.err { background:rgba(181,74,42,.12); color:var(--warn); }
  .chip.ok { background:rgba(31,157,107,.15); color:var(--battery); }
  .empty { font-size:13px; color:var(--muted); padding:10px 0; border-top:1px solid var(--line); }
  dl.kv { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px 18px; margin:0; padding-top:10px; border-top:1px solid var(--line); }
  dl.kv div { min-width:0; }
  dl.kv dt { font-size:12px; color:var(--muted); }
  dl.kv dd { margin:0; font-size:14px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .sublabel { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 4px; }
  .rgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px 18px; padding-top:10px; border-top:1px solid var(--line); }
  .rgrid label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0; }
  .rgrid select { font-size:14px; }
  .rgrid .why { font-size:11px; line-height:1.35; }
  .sublabel .linkbtn { text-transform:none; letter-spacing:0; margin-left:8px; font-weight:500; }
  .load { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .ubar { width:140px; height:8px; border-radius:4px; background:var(--track); overflow:hidden; }
  .ubar i { display:block; height:100%; background:var(--battery); }
  .ubar.high i { background:var(--solar); }
  .ubar.over i { background:var(--warn); }
  .dev.sub { padding-left:18px; }
  tr.undone td { color:var(--muted); }
  table.cards select { font:inherit; font-size:13px; color:var(--fg); background:var(--card-2); border:1px solid var(--line); border-radius:9px; padding:5px 8px; max-width:100%; }
  .dev.retired .nm, .dev.retired .ic { opacity:.55; }
  .banner { border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; border:1px solid var(--line); background:var(--card); }
  .banner.err { border-color:var(--warn); color:var(--warn); }
  .vers td:first-child { white-space:nowrap; }
  @media (max-width:640px) {
    .dev { grid-template-columns:24px minmax(0,1fr) auto; }
    .dev .val { grid-column:2; text-align:left; }
    .dev .act { grid-column:3; grid-row:1; }
  }
</style>
</head>
<body>
<main>
  <header class="top"></header>
  <div class="banner" id="banner" hidden></div>
  <nav class="toc" id="toc" aria-label="Bereiche"></nav>
  <div id="areas"></div>
</main>
<dialog class="setup" id="sec" aria-labelledby="secTitle">
  <form class="inner" id="secForm" novalidate>
    <h2 id="secTitle"></h2><div id="secBody"></div>
    <div class="err" id="secErr" role="alert"></div><div class="actions" id="secActions"></div>
  </form>
</dialog>
<dialog class="setup" id="lpd" aria-labelledby="lpTitle">
  <form class="inner" id="lpForm" novalidate>
    <h2 id="lpTitle"></h2><div id="lpBody"></div>
    <div class="err" id="lpErr" role="alert"></div><div class="actions" id="lpActions"></div>
  </form>
</dialog>
<dialog class="setup" id="circ" aria-labelledby="circTitle">
  <form class="inner" id="circForm" novalidate>
    <h2 id="circTitle"></h2><div id="circBody"></div>
    <div class="err" id="circErr" role="alert"></div><div class="actions" id="circActions"></div>
  </form>
</dialog>
<dialog class="setup" id="ud" aria-labelledby="udTitle">
  <form class="inner" id="udForm" novalidate>
    <h2 id="udTitle"></h2><div id="udBody"></div>
    <div class="err" id="udErr" role="alert"></div><div class="actions" id="udActions"></div>
  </form>
</dialog>
<dialog class="setup" id="ev" aria-labelledby="evTitle">
  <form class="inner" id="evForm" novalidate>
    <h2 id="evTitle"></h2><div id="evBody"></div>
    <div class="err" id="evErr" role="alert"></div><div class="actions" id="evActions"></div>
  </form>
</dialog>
<script src="common.js"></script>
<script>
topbar('config');
const kw = w => (Math.abs(w) >= 1000 ? (w / 1000).toFixed(1).replace('.', ',') + ' kW' : Math.round(w) + ' W');
const num = (v, d = 1) => Number(v).toLocaleString('de-DE', {maximumFractionDigits: d});
const pctv = v => v == null ? '–' : Math.round(v * 100) + ' %';
const when = t => new Date(t).toLocaleString('de-DE', {day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit'});

// Areas in display order. pick: driver categories offered by "hinzufügen",
// icon: default symbol for new devices.
const AREAS = [
  {key: 'infra', title: 'Infrastruktur', icon: 'house', pick: ['inverter', 'meter', 'none'], defKind: 'pv',
   why: 'Netzzähler, Wechselrichter und Hausbatterie – die Grundlage für alle Entscheidungen.'},
  {key: 'grid', title: 'Netz + Unterverteilungen', icon: 'grid',
   why: 'Absicherung des Hausanschlusses und Unterverteilungen mit eigener Sicherung. Das Lastmanagement hält die Ströme pro Phase darunter.'},
  {key: 'wallbox', title: 'Wallboxen', icon: 'car', pick: ['charger', 'none'], defIcon: 'car', defKind: 'ev-charger',
   why: 'Jede Wallbox ist ein Ladepunkt.'},
  {key: 'vehicles', title: 'Fahrzeuge', icon: 'car', pick: ['vehicle'],
   why: 'Jedes Fahrzeug ist ein eigener Eintrag mit Lademodus, Ladekarten und Auswertungen. Ladestand und Ladeziel kommen aus einer Datenquelle (Fahrzeugkonto), die sich jederzeit wechseln lässt.'},
  {key: 'heat', title: 'Heizung + Klima', icon: 'heatpump', pick: ['switch', 'meter', 'none'], defIcon: 'heatpump', defKind: 'heating-rod',
   why: 'Wärmepumpe, Warmwasser, Klimageräte.'},
  {key: 'other', title: 'Haushalt', icon: 'plug', pick: ['switch', 'meter', 'none'], defIcon: 'plug', defKind: 'appliance',
   why: 'Haushaltsgeräte wie Kühlschrank, Waschmaschine, Backofen oder E-Bike-Ladegerät – gemessen, auf Wunsch steuerbar.'},
  {key: 'prices', title: 'Prognose + Preise', icon: 'solar', pick: ['forecast', 'tariff'],
   why: 'PV-Prognose, Strompreise und Tarife.'},
  {key: 'strategy', title: 'Batteriestrategie', icon: 'battery', why: 'Wie voltibri die Hausbatterie lädt.'},
  {key: 'surplus', title: 'PV-Überschuss', icon: 'solar',
   why: 'Wer den PV-Überschuss bekommt: die Hausbatterie, dann Wallboxen und Heizstäbe nach Priorität. Und wie viel die Batterie beim Boost dazugibt.'},
  {key: 'users', title: 'Benutzer + Gruppen', icon: 'users',
   why: 'Wer sich anmelden darf. Administratoren dürfen alles; Benutzer sehen nur, was ihre Gruppen freigeben – z. B. zwei Wallboxen und ein Fahrzeug.'},
  {key: 'system', title: 'System', icon: 'grid', why: 'Allgemeine Einstellungen und Versionen der Konfiguration.'},
];

let D = {};  // loaded data

// area by asset kind (derived on the server, see config.KindOf)
const AREA_OF_KIND = {'ev-charger': 'wallbox', 'vehicle-account': 'vehicles', vehicle: 'vehicles', 'heat-pump': 'heat', 'heating-rod': 'heat', climate: 'heat',
  forecast: 'prices', tariff: 'prices', pv: 'infra', battery: 'infra', inverter: 'infra', 'grid-meter': 'infra', appliance: 'other'};
const assetOf = id => (D.assets || []).find(a => a.id === id) || {};
function areaOf(dev) {
  const r = D.cfg.roles || {};
  if (r.grid === dev.id || r.battery === dev.id || (r.pv || []).includes(dev.id)) return 'infra';
  return AREA_OF_KIND[assetOf(dev.id).kind] || 'other';
}
const RUN_WORD = {charging: ['Ladevorgang', 'Ladevorgänge'], heating: ['Heizlauf', 'Heizläufe'], run: ['Lauf', 'Läufe']};
const monthYear = d => { const [y, m] = d.split('-'); return `${m}/${y}`; };

function rolesOf(id) {
  const r = D.cfg.roles || {}, out = [];
  if (r.grid === id) out.push('Netzzähler');
  if ((r.pv || []).includes(id)) out.push('PV');
  if (r.battery === id) out.push('Hausbatterie');
  if (r.pvForecast === id) out.push('PV-Prognose');
  if (r.tariff === id) out.push('Strompreis');
  const t = D.cfg.tariffs || {};
  [['grid', 'Netzbezug'], ['feedin', 'Einspeisung'], ['charging', 'Ladestrom']].forEach(([k, l]) => { if (t[k] && t[k].source === id) out.push('Preis ' + l); });
  return out;
}

// live power of a device (W) if the running site knows it
function livePower(id) {
  const s = D.state || {}, r = D.cfg.roles || {};
  const rd = (s.producers || []).concat(s.consumers || []).find(x => x.id === id);
  if (rd) return rd.powerW;
  if (r.grid === id && s.time) return s.gridW;
  return null;
}

function address(dev) {
  const p = dev.params || {};
  return p.host || p.url || (p.lat != null ? `${num(p.lat, 2)}, ${num(p.lon, 2)}` : '');
}

function devErrors(dev) {
  const host = (dev.params || {}).host;
  return ((D.state && D.state.errors) || []).filter(e => e.includes(dev.id) || (host && e.includes(host)));
}

function extraFor(dev, area) {
  const p = dev.params || {}, out = [];
  const c = dev.correction || {};
  if (c.factor || c.offsetW) out.push(`Korrektur: ${c.factor ? '×' + num(c.factor, 3) : ''}${c.offsetW ? ` ${c.offsetW > 0 ? '+' : ''}${num(c.offsetW, 0)} W` : ''}${c.activeAboveW ? ` ab ${num(c.activeAboveW, 0)} W` : ''}`);
  if (area === 'wallbox' && dev.type !== 'none') {
    const lp = (D.cfg.charging && D.cfg.charging.loadpoints || []).find(l => l.charger === dev.id) || {};
    const GUEST = {share: 'teilen', batteryFirst: 'Batterie zuerst', forceBattery: 'Batterie erzwingen'};
    out.push(`<b>${lp.phases || 3}</b>-phasig`, `<b>${lp.minCurrent || 6}–${lp.maxCurrent || 16} A</b>`,
      `Gäste: <b>${MODE_NAME[lp.guestMode || 'off']}</b>, ${GUEST[lp.guest || 'share']}${lp.guestNoBattery ? ', ohne Hausbatterie' : ''}`);
    if (lp.separateMeter) out.push('eigener Zähler');
    if (!D.readOnly && D.local) out.push(`<button type="button" class="linkbtn" data-lpedit="${esc(dev.id)}">Ladepunkt einstellen</button>`);
  }
  if (Array.isArray(p.planes)) {
    const kwp = p.planes.reduce((a, x) => a + (+x.kwp || 0), 0);
    out.push(`<b>${p.planes.length}</b> Dachflächen · <b>${num(kwp, 2)} kWp</b>`);
    p.planes.forEach(x => out.push(`${esc(x.name || '')} ${num(x.kwp, 2)} kWp · ${x.dec}° · Az ${x.az}°${x.horizon ? ' · Horizont' : ''}`));
  }
  if (p.capacityWh) out.push(`Batterie <b>${num(p.capacityWh / 1000, 1)} kWh</b>`);
  return out;
}

function devRow(dev, area) {
  const drv = voltibri.driver(dev.type) || {name: dev.type, capabilities: []};
  const caps = drv.capabilities || [];
  const icon = dev.icon || ({wallbox: 'car', vehicles: 'car', heat: 'heatpump', prices: 'solar'}[area]) ||
    (caps.includes('battery') ? 'battery' : caps.includes('pv') ? 'solar' : caps.includes('grid') ? 'grid' : 'plug');
  const ctl = caps.some(c => CONTROL_CAPS.includes(c));
  const chips = rolesOf(dev.id).map(r => `<span class="chip">${esc(r)}</span>`);
  if (ctl) {
    const m = dev.mode || 'observed';
    chips.push(`<span class="chip${m === 'owned' ? ' ctl' : ''}">${MODE_TEXT[m]}</span>`);
    if (m === 'owned' && D.cfg.site.dryRun) chips.push('<span class="chip dry">Testmodus</span>');
  }
  let val = '';
  const vAsset = area === 'vehicles' && dev.type === 'vehicle' ? (D.charging.vehicles || []).find(v => v.key === dev.id) : null;
  if (area === 'vehicles' && dev.type === 'vehicle') {
    const src = (dev.params || {}).source;
    const srcName = src ? ((D.cfg.devices || []).find(x => x.id === src) || {}).name || src : '';
    chips.push(src ? `<span class="chip ok" title="Ladestand und Ladeziel kommen von hier">über ${esc(srcName)}</span>` : '<span class="chip">manuell</span>');
    if (vAsset && vAsset.error) chips.push(`<span class="chip err" title="${esc(vAsset.error)}">Datenquelle</span>`);
    if (batKey(dev.noBatteryModes) !== 'allow') chips.push(`<span class="chip" title="Hausbatterie beim Laden">Hausbatterie ${BAT_OPTS[batKey(dev.noBatteryModes)].label}</span>`);
    const capKWh = (dev.params || {}).capacityKWh;
    if (capKWh) chips.push(`<span class="chip">${num(capKWh, 1)} kWh</span>`);
    val = vAsset && vAsset.soc != null ? pctv(vAsset.soc) : '';
  } else if (area === 'vehicles') {
    const pr = (D.charging.providers || []).find(p => p.id === dev.id);
    if (pr) chips.push(pr.needsLogin && !pr.authorized ? '<span class="chip err">nicht angemeldet</span>' : '<span class="chip ok">verbunden</span>');
    val = pr ? `${pr.vehicles} Fahrzeug${pr.vehicles === 1 ? '' : 'e'}` : '';
  } else {
    const w = livePower(dev.id);
    if (w != null) val = kw(w);
  }
  const asset = assetOf(dev.id);
  if (asset.kind && (dev.type === 'none' || dev.kind)) chips.unshift(`<span class="chip">${esc(KIND_LABEL[asset.kind] || asset.kind)}</span>`);
  if ((area === 'heat' || area === 'other') && !asset.retired && controlOf(drv)[0] !== 'keine') chips.push(`<span class="chip" title="${esc(controlOf(drv)[1])}">${controlOf(drv)[0]}</span>`);
  if (dev.flexibility && dev.flexibility !== 'none') chips.push(`<span class="chip ctl">${esc(FLEX_TEXT[dev.flexibility] ? FLEX_TEXT[dev.flexibility][0] : dev.flexibility)}</span>`);
  if (dev.runs === false) chips.push('<span class="chip">ohne Läufe</span>');
  if (dev.batteryUse === 'never') chips.push('<span class="chip" title="Die Hausbatterie versorgt dieses Gerät nicht.">ohne Hausbatterie</span>');
  if (asset.retired) { chips.push(`<span class="chip">stillgelegt seit ${monthYear(dev.decommissioned)}</span>`); val = ''; }
  const errs = devErrors(dev);
  if (errs.length) chips.push(`<span class="chip err" title="${esc(errs.join('\n'))}">Fehler</span>`);
  const extra = extraFor(dev, area);
  if (dev.commissioned && !asset.retired) extra.push(`in Betrieb seit ${monthYear(dev.commissioned)}`);
  for (const s of (D.runs || []).filter(x => x.asset === dev.id)) {
    const w = RUN_WORD[s.kind] || RUN_WORD.run;
    const share = s.energyWh > 0 ? ` · ${Math.round(100 * s.solarWh / s.energyWh)} % PV` : '';
    extra.push(`<b>${s.count}</b> ${s.count === 1 ? w[0] : w[1]} · <b>${num(s.energyWh / 1000, 0)} kWh</b>${share}` +
      ` · ${new Date(s.first).toLocaleDateString('de-DE', {month: '2-digit', year: 'numeric'})}–${new Date(s.last).toLocaleDateString('de-DE', {month: '2-digit', year: 'numeric'})}` +
      (s.imported ? ` <span class="why">(${s.imported === s.count ? 'alle' : s.imported} importiert)</span>` : ''));
  }
  if (vAsset) {
    const i = vAsset.info || {};
    const car = [i.brand, i.model].filter(Boolean).join(' ');
    if (car || i.vin) extra.push(esc([car, i.vin].filter(Boolean).join(' · ')));
    if (vAsset.limitSoc != null || vAsset.rangeKm != null) extra.push([vAsset.limitSoc != null ? `Ladeziel <b>${pctv(vAsset.limitSoc)}</b>` : '', vAsset.rangeKm != null ? `<b>${num(vAsset.rangeKm, 0)} km</b> Reichweite` : ''].filter(Boolean).join(' · '));
    if (vAsset.error) extra.push(`<span style="color:var(--warn)">${esc(vAsset.error)}</span>`);
    const al = (dev.params || {}).aliases;
    if (al) extra.push(`<span class="why">frühere Namen: ${esc(al)}</span>`);
    const rv = (D.runVehicles || []).find(x => x.name === (dev.name || dev.id));
    if (rv) extra.push(`<b>${rv.count}</b> Ladevorgänge · <b>${num(rv.energyWh / 1000, 0)} kWh</b>`);
  } else if (area === 'vehicles') (D.charging.vehicles || []).filter(v => v.provider === dev.id).forEach(v => {
    const own = v.asset ? (D.cfg.devices || []).find(x => x.id === v.key) : null;
    extra.push(own ? `${esc(v.info.vin || v.sourceId)} → <b>${esc(own.name || own.id)}</b>`
      : `<b>${esc(v.name)}</b> ${v.soc != null ? pctv(v.soc) : ''} ${esc([v.info.brand, v.info.model].filter(Boolean).join(' '))} <span class="chip">nicht zugeordnet</span>` +
        (!D.readOnly && D.local ? ` <button type="button" class="linkbtn" data-adopt="${esc(v.key)}">als Fahrzeug anlegen</button>` : ''));
  });
  if (errs.length) extra.push(...errs.map(e => `<span style="color:var(--warn)">${esc(e)}</span>`));
  return `<div class="dev${asset.retired ? ' retired' : ''}">
    <span class="ic">${iconSVG(icon, 22)}</span>
    <div><div class="nm">${esc(dev.name || dev.id)}</div>
      <div class="meta"><span>${esc(drv.name)}</span>${address(dev) ? `<span>${esc(address(dev))}</span>` : ''}${chips.join('')}</div></div>
    <span class="val">${val}</span>
    <span class="act"><button type="button" class="btn" data-edit="${esc(dev.id)}">${D.readOnly ? 'Ansehen' : 'Bearbeiten'}</button></span>
    ${extra.length ? `<div class="extra">${extra.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
  </div>`;
}

function kv(pairs) {
  return `<dl class="kv">${pairs.filter(Boolean).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}

function priceText(t) {
  if (!t) return 'nicht eingetragen';
  const zones = (t.zones || []).map(z => `${esc(z.days || '')} ${esc(z.hours || '')}: ${num(z.price, 2)} ct`).join(', ');
  if (t.type === 'dynamic') return `dynamisch aus <b>${esc(t.source || '–')}</b>${t.charges ? ` + ${num(t.charges, 2)} ct` : ''}${t.tax ? ` + ${num(t.tax * 100, 0)} % MwSt.` : ''}`;
  return `${num(t.price, 2)} ct/kWh${zones ? ` · ${zones}` : ''}`;
}

function extraSection(area) {
  const c = D.cfg;
  if (area === 'infra' && (c.roles.battery || c.battery.capacityWh)) {
    return `<div class="sublabel">Hausbatterie ${editBtn('battery')}</div>` +
      sectionKV('battery', [D.state && D.state.hasBattery ? ['Ladestand jetzt', pctv(D.state.soc)] : null]);
  }
  if (area === 'wallbox') {
    return cardsSection();
  }
  if (area === 'prices') {
    const t = c.tariffs || {};
    return `<div class="sublabel">Tarife</div>` + kv([
      ['Netzbezug', priceText(t.grid)], ['Einspeisung', priceText(t.feedin)],
      t.charging ? ['Ladestrom (eigener Zähler)', priceText(t.charging)] : null,
      D.charging.gridCt != null ? ['Netzpreis jetzt', num(D.charging.gridCt, 1) + ' ct/kWh'] : null]);
  }
  return '';
}

// Editable settings blocks (PUT api/config/section/{name}). kind: pct
// (stored 0..1, shown in %), kw / kwh (stored W / Wh), num, bool.
const SECTIONS = {
  planner: {title: 'Batteriestrategie', fields: [
    {key: 'morningBufferSoC', label: 'Puffer am Morgen', kind: 'pct', min: 0, max: 90, def: 0.25,
     why: 'So viel soll noch in der Batterie sein, wenn morgens die PV wieder übernimmt.'},
    {key: 'safetyMarginSoC', label: 'Sicherheitszuschlag', kind: 'pct', min: 0, max: 50, def: 0.05,
     why: 'Zusätzliche Reserve auf den erwarteten Nachtverbrauch.'},
    {key: 'pvPessimism', label: 'PV-Prognose zählt mit', kind: 'pct', min: 0, max: 150, def: 0.8,
     why: 'Mit welchem Anteil der Prognose geplant wird. Weniger = vorsichtiger, die Batterie wird früher geladen.'},
    {key: 'robustness', label: 'Robustheit', kind: 'num', step: 0.1, min: 1, max: 5, def: 1.3, prefix: '× ',
     why: 'Spät laden nur, wenn der erwartete Überschuss mindestens so viel mal größer ist als der Bedarf.'},
    {key: 'minNightHours', label: 'Nacht ab', kind: 'num', step: 0.5, min: 0, max: 12, def: 3, unit: 'h ohne PV',
     why: 'Ab so vielen Stunden ohne PV-Überschuss zählt ein Zeitraum als Nacht, für die geladen werden muss.'},
    {key: 'fillOnNegativePrice', label: 'Bei negativen Preisen voll laden', kind: 'bool', def: false,
     why: 'Aus: negative Preise werden nur für die ohnehin nötige Energie genutzt – schont die Batterie.'},
  ]},
  grid: {title: 'Netzanschluss', fields: [
    {key: 'fuseA', label: 'Absicherung Hausanschluss', kind: 'num', unit: 'A', min: 0, max: 1000,
     why: 'Hauptsicherung pro Phase (steht am Hausanschlusskasten oder Zähler), z. B. 35 oder 63 A. Leer = nicht überwachen.'},
    {key: 'phases', label: 'Anschluss', kind: 'select', def: 3, options: [[3, 'dreiphasig'], [1, 'einphasig']]},
  ]},
  battery: {title: 'Hausbatterie', fields: [
    {key: 'capacityWh', label: 'Kapazität', kind: 'kwh', step: 0.1, min: 0, why: 'Nutzbare Kapazität laut Datenblatt.'},
    {key: 'maxChargeW', label: 'Max. Ladeleistung', kind: 'kw', step: 0.1, min: 0, why: 'Was Wechselrichter und Batterie zusammen schaffen.'},
    {key: 'maxDischargeW', label: 'Max. Entladeleistung', kind: 'kw', step: 0.1, min: 0},
    {key: 'minSoC', label: 'Mindest-Ladestand', kind: 'pct', min: 0, max: 90, why: 'Darunter entlädt der Wechselrichter nicht.'},
    {key: 'chargeEfficiency', label: 'Wirkungsgrad Laden', kind: 'pct', min: 0, max: 100, advanced: true, why: 'Leer = Standard.'},
    {key: 'dischargeEfficiency', label: 'Wirkungsgrad Entladen', kind: 'pct', min: 0, max: 100, advanced: true, why: 'Leer = Standard.'},
  ]},
};

function showValue(f, v) {
  if (f.kind === 'bool') return v ? 'ja' : 'nein';
  if (v == null || v === 0 && f.kind !== 'pct') return '–';
  if (f.kind === 'pct') return pctv(v);
  if (f.kind === 'kw') return kw(v);
  if (f.kind === 'kwh') return num(v / 1000, 1) + ' kWh';
  return (f.prefix || '') + num(v, 2) + (f.unit ? ' ' + f.unit : '');
}

function sectionKV(name, extra = []) {
  const s = SECTIONS[name], vals = D.cfg[name] || {};
  return kv(s.fields.filter(f => !f.advanced || vals[f.key]).map(f => [f.label, showValue(f, vals[f.key])]).concat(extra));
}

const editBtn = name => D.readOnly || !D.local ? '' : `<button type="button" class="linkbtn" data-section="${name}">Bearbeiten</button>`;

// ---- section dialog ----
function toInput(f, v) {
  if (v == null || (v === 0 && f.kind !== 'pct' && f.kind !== 'num')) return '';
  if (f.kind === 'pct') return +(v * 100).toFixed(1);
  if (f.kind === 'kw' || f.kind === 'kwh') return +(v / 1000).toFixed(2);
  return v;
}
function fromInput(f, s) {
  if (s === '') return 0;
  const n = Number(s);
  if (f.kind === 'pct') return n / 100;
  if (f.kind === 'kw' || f.kind === 'kwh') return Math.round(n * 1000);
  return n;
}
const unitOf = f => ({pct: '%', kw: 'kW', kwh: 'kWh'}[f.kind] || f.unit || '');

function openSection(name) {
  const s = SECTIONS[name], vals = D.cfg[name] || {};
  const fld = f => {
    const id = 'sec_' + f.key, why = f.why ? `<span class="why">${esc(f.why)}</span>` : '';
    if (f.kind === 'bool') return `<label class="f cb"><input type="checkbox" id="${id}"${vals[f.key] ? ' checked' : ''}> ${esc(f.label)}</label>${why}`;
    if (f.kind === 'select') return `<label class="f" for="${id}">${esc(f.label)}<select id="${id}">${f.options.map(([v, l]) =>
      `<option value="${v}"${v === (vals[f.key] || f.def) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>${why}</label>`;
    const def = f.def != null ? ` placeholder="Standard: ${toInput(f, f.def)}"` : '';
    return `<label class="f" for="${id}">${esc(f.label)}${unitOf(f) ? ` (${esc(unitOf(f))})` : ''}
      <input type="number" id="${id}" value="${toInput(f, vals[f.key])}" step="${f.step || 1}"${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${def}>${why}</label>`;
  };
  const main = s.fields.filter(f => !f.advanced), adv = s.fields.filter(f => f.advanced);
  $('secTitle').textContent = s.title + ' bearbeiten';
  $('secBody').innerHTML = `<div class="stack">${main.map(fld).join('')}
    ${adv.length ? `<details><summary>Erweiterte Einstellungen</summary><div>${adv.map(fld).join('')}</div></details>` : ''}</div>`;
  $('secErr').textContent = '';
  $('secActions').innerHTML = `${name === 'planner' ? '<button type="button" class="btn" data-defaults>Standardwerte</button><span class="spacer"></span>' : ''}
    <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">Speichern</button>`;
  $('sec').dataset.name = name;
  $('sec').showModal();
}

$('secForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('sec').dataset.name, s = SECTIONS[name], body = {};
  for (const f of s.fields) {
    const el = $('sec_' + f.key);
    if (f.kind === 'bool') { body[f.key] = el.checked; continue; }
    if (f.kind === 'select') { body[f.key] = Number(el.value); continue; }
    const v = el.value.trim();
    body[f.key] = v === '' && f.def != null ? f.def : fromInput(f, v);
  }
  $('secActions').innerHTML = '<button type="button" class="btn" disabled>Speichern …</button>';
  const r = await fetch('api/config/section/' + name, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const res = await r.json().catch(() => ({}));
  if (!r.ok) {
    $('secErr').textContent = [res.error || 'Fehler ' + r.status].concat(res.details || []).join(' · ');
    $('secActions').innerHTML = '<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">Speichern</button>';
    return;
  }
  $('secBody').innerHTML = `<div class="why">Gespeichert als Version ${res.id}. voltibri übernimmt die Änderung …</div>`;
  $('secActions').innerHTML = '';
  for (let i = 0; i < 20; i++) {
    await new Promise(ok => setTimeout(ok, 1000));
    const st = await fetch('api/status').then(x => x.json()).catch(() => null);
    if (st && st.state === 'error' && (st.message || '').includes('Version ' + res.id)) { $('secErr').textContent = st.message; break; }
    if (st && st.version >= res.id) { $('secBody').innerHTML = `<div class="why">Übernommen (Version ${res.id}). Der Plan wird neu berechnet.</div>`; break; }
  }
  $('secActions').innerHTML = '<button type="button" class="btn primary" data-close>Fertig</button>';
  load();
});
$('sec').addEventListener('click', e => {
  if (e.target === $('sec') || e.target.closest('[data-close]')) $('sec').close();
  if (e.target.closest('[data-defaults]')) {
    for (const f of SECTIONS[$('sec').dataset.name].fields) {
      const el = $('sec_' + f.key);
      if (f.kind === 'bool') el.checked = !!f.def; else el.value = toInput(f, f.def);
    }
  }
});

function strategySection() {
  return sectionKV('planner') + `<p class="why" style="margin:10px 0 0">Änderungen wirken ab der nächsten Planung (spätestens nach 15 Minuten, nach dem Speichern sofort).</p>` + autoLimitsSection();
}

// ---- runtime battery settings (api/battery, api/loads): saved on change, no configuration version ----
const rOpts = (val, vs, txt) => {
  if (!vs.includes(val)) vs = [...vs, val].sort((a, b) => a - b); // a value off the grid stays selectable
  return vs.map(v => `<option value="${v}"${v === val ? ' selected' : ''}>${txt(v)}</option>`).join('');
};
const rSteps = (min, max, st) => { const vs = []; for (let v = min; v <= max + 1e-9; v += st) vs.push(Math.round(v)); return vs; };
const rSel = (key, lab, val, vs, txt, why) => `<label>${esc(lab)}<select data-bat="${key}"${D.local ? '' : ' disabled'}>${rOpts(val, vs, txt)}</select>${why ? `<span class="why">${esc(why)}</span>` : ''}</label>`;
const rPct = v => Math.round((v || 0) * 100);

function autoLimitsSection() {
  const b = D.bat, f = (b && b.features) || {};
  if (!b || !(f.maxSoc || f.minSoc || f.maxDischarge)) return '';
  const s = b.settings || {}, capW = b.maxDischargeW > 0 ? b.maxDischargeW : 10000;
  const items = [];
  if (f.minSoc) {
    items.push(rSel('autoFloorSunny', 'Unten vor einem Sonnentag', rPct(s.autoFloorSunny), rSteps(5, 50, 5), v => v + ' %', 'So weit darf die Batterie in der Nacht vor einem Tag entladen, dessen Überschuss sie wieder füllt.'));
    items.push(rSel('autoFloorCloudy', 'Unten vor einem trüben Tag', rPct(s.autoFloorCloudy), rSteps(5, 90, 5), v => v + ' %', 'Diese Reserve bleibt vor einem trüben Tag; dazwischen wird gleitend gerechnet.'));
  }
  if (f.maxSoc) items.push(rSel('autoMaxSoc', 'Oben', rPct(s.autoMaxSoc), [0, ...rSteps(50, 100, 5)], v => v === 0 ? 'automatisch' : v + ' %', 'Automatisch: vor einem Sonnentag nur, was die Nacht braucht, sonst voll. Oder eine feste Obergrenze.'));
  if (f.maxDischarge) items.push(rSel('maxDischargeW', 'Max. Entladeleistung', s.maxDischargeW > 0 ? Math.min(s.maxDischargeW, capW) : capW, rSteps(Math.min(500, capW), capW, 250), v => v >= capW ? 'unbegrenzt' : kw(v), 'Höchstens so viel gibt die Batterie ans Haus ab.'));
  return `<div class="sublabel">Automatische Ladegrenzen</div><div class="rgrid">${items.join('')}</div>
    <p class="why" style="margin:8px 0 0">Gelten, wenn die Ladegrenzen in der Übersicht auf „Automatisch“ stehen. ${esc((b.auto && b.auto.reason) || '')}</p>`;
}

function surplusSection() {
  const b = D.bat, f = (b && b.features) || {}, loads = D.loads || [];
  if (!b && !loads.length) return '<div class="empty">Keine Hausbatterie und keine Verbraucher mit Überschuss-Steuerung.</div>';
  const s = (b && b.settings) || {};
  const KL = {'ev-charger': 'Wallbox', 'heating-rod': 'Heizstab'};
  let out = '';
  if (f.priority) out += `<div class="rgrid">${rSel('prioritySoc', 'Batterie hat Vorrang bis', rPct(s.prioritySoc != null ? s.prioritySoc : 0.5), rSteps(0, 100, 5), v => v === 0 ? 'nie' : v === 100 ? 'immer' : v + ' %',
    'Darunter bekommt die Hausbatterie den Überschuss vor den Verbrauchern (außer der Batterieplan erwartet später genug Überschuss).')}</div>`;
  if (loads.length) out += `<div class="sublabel">Priorität der Verbraucher</div><div class="rgrid">${loads.map(l =>
    `<label>${esc(l.name)} · ${KL[l.kind] || ''}<select data-prio="${esc(l.id)}"${D.local ? '' : ' disabled'}>${rOpts(l.priority, rSteps(0, 10, 1), v => v + (v === 5 ? ' (Standard)' : ''))}</select></label>`).join('')}</div>
    <p class="why" style="margin:8px 0 0">0–10, höher zuerst. Bei gleicher Priorität: Wallboxen vor Heizstäben, Warmwasser vor Heizung. In der Übersicht setzt „Heute zuerst“ einen Verbraucher bis Mitternacht vor alle anderen; ein Boost von Hand kommt immer zuerst.</p>`;
  if (f.boost) out += `<div class="sublabel">Boost</div><div class="rgrid">
    ${rSel('boostReserve', 'Reserve', rPct(s.boostReserve), rSteps(0, 50, 5), v => `${v} % · frei ${kw(Math.round(b.boostMaxW * (1 - v / 100) / 50) * 50)}`, 'Dieser Teil der Entladeleistung bleibt beim Boost frei und fängt Schwankungen ab.')}
    ${rSel('boostStopSoc', 'Batterie gibt für Boost bis', rPct(s.boostStopSoc || 0.85), rSteps(10, 95, 5), v => v + ' %', 'Darunter gibt die Batterie nichts mehr für einen Boost her – auch nicht für einen von Hand.')}
    ${rSel('boostStartSoc', 'Auto-Boost ab', rPct(s.boostStartSoc), rSteps(0, 100, 5), v => v === 0 ? 'aus' : v + ' %', 'Ab diesem Ladestand bekommen alle Überschuss-Verbraucher Batterieleistung dazu, nach Priorität (z. B. 95 % / 85 % für den Sägezahn).')}</div>
    <p class="why" style="margin:8px 0 0">Ein Verbraucher im Boost (Lademodus „Boost“ am Auto, Modus „Boost“ am Heizstab, oder alle beim Auto-Boost) bekommt zum PV-Überschuss Leistung aus der Batterie – nie aus dem Netz.</p>`;
  return out;
}

// the whole settings with one change (keeps everything else)
function batBody(over) {
  const s = D.bat.settings || {}, f = D.bat.features || {};
  return Object.assign({limitMode: s.limitMode, manualFor: s.manualFor || 'morning',
    maxSoc: f.maxSoc ? (s.maxSoc || 0) : 0, minSoc: f.minSoc ? (s.minSoc || 0) : 0, maxDischargeW: f.maxDischarge ? (s.maxDischargeW || 0) : 0,
    autoFloorSunny: s.autoFloorSunny, autoFloorCloudy: s.autoFloorCloudy, autoMaxSoc: s.autoMaxSoc || 0,
    prioritySoc: s.prioritySoc, boostReserve: s.boostReserve || 0, boostStopSoc: s.boostStopSoc, boostStartSoc: s.boostStartSoc || 0}, over);
}
async function saveRuntime(url, body) {
  const r = await fetch(url, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).catch(() => null);
  const x = r ? await r.json().catch(() => null) : null;
  if (!r || !r.ok) { alert((x && x.error) || 'Keine Verbindung.'); return load(); }
  if (url === 'api/battery') D.bat = x; else D.loads = x;
  render();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-bat]')) {
    const k = t.dataset.bat, capW = D.bat.maxDischargeW > 0 ? D.bat.maxDischargeW : 10000;
    saveRuntime('api/battery', batBody({[k]: k === 'maxDischargeW' ? (+t.value >= capW ? 0 : +t.value) : +t.value / 100}));
  }
  if (t.matches('[data-prio]')) saveRuntime(`api/loads/${encodeURIComponent(t.dataset.prio)}/priority`, {priority: +t.value});
});

function systemSection() {
  const s = D.cfg.site, v = D.version;
  const vers = (D.versions || []).slice(0, 8).map(x => `<tr><td>${x.id}${x.id === v.id ? ' · aktiv' : ''}</td><td>${when(x.createdAt)}</td><td>${esc(x.author || '')}</td><td>${esc(x.comment || '')}</td>
    <td class="r">${x.id !== v.id && !D.readOnly ? `<button type="button" class="linkbtn" data-rollback="${x.id}">zurückholen</button>` : ''}</td></tr>`).join('');
  return kv([
    ['Testmodus', (s.dryRun ? '<span class="chip dry">an – nichts wird geschrieben</span>' : 'aus – voltibri steuert') +
      (D.readOnly || !D.local ? '' : ` <button type="button" class="linkbtn" data-dryrun="${s.dryRun ? 'off' : 'on'}">${s.dryRun ? 'ausschalten' : 'einschalten'}</button>`)],
    ['Zeitzone', esc(s.timezone)], ['Adresse', esc(s.listen)],
    ['Feiertage', (s.holidays || []).length ? esc(s.holidays.join(', ')) : 'nur bundesweite'],
    ['Status', esc(D.status.state === 'running' ? 'läuft' : D.status.state === 'setup' ? 'Einrichtung' : 'Fehler')]]) +
    `<div class="sublabel">Versionen</div><div class="tablewrap"><table class="list vers"><thead><tr><th>Nr.</th><th>Zeit</th><th>von</th><th>Kommentar</th><th></th></tr></thead><tbody>${vers}</tbody></table></div>
    <p class="why" style="margin:10px 0 0"><a class="navlink" href="api/config/export">Als YAML exportieren</a> (Geheimnisse werden nicht mit exportiert)</p>` +
    importsSection();
}

// ---- imports (charging sessions from evcc) ----
function importsSection() {
  const rows = D.imports.map(i => `<tr${i.undoneAt ? ' class="undone"' : ''}><td>${i.id}</td><td>${when(i.createdAt)}</td><td>${esc(i.source)}</td>
    <td class="r">${i.count}</td><td>${esc((i.params && i.params.url) || '')}</td>
    <td>${i.undoneAt ? 'rückgängig gemacht ' + when(i.undoneAt) : (D.local ? `<button type="button" class="linkbtn" data-undo="${i.id}" data-count="${i.count}">rückgängig</button>` : 'aktiv')}</td></tr>`).join('');
  return `<div class="sublabel">Importe ${D.local ? '<button type="button" class="linkbtn" data-evcc>Läufe aus evcc übernehmen</button>' : ''}</div>
    ${rows ? `<div class="tablewrap"><table class="list"><thead><tr><th>Nr.</th><th>Zeit</th><th>Quelle</th><th class="r">Anzahl</th><th>Adresse</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="why" style="margin:6px 0 0">Noch nichts importiert. Übernommene Ladevorgänge werden gekennzeichnet und lassen sich pro Import wieder entfernen.</p>'}`;
}

const importTargets = () => (D.assets || []).filter(a => !['forecast', 'tariff', 'vehicle-account'].includes(a.kind));
const RUN_KIND_TEXT = {charging: 'Ladevorgänge', heating: 'Heizläufe', run: 'Läufe'};
let evccState = {};

function openEvcc() {
  const last = D.imports.find(i => i.source === 'evcc' && i.params && i.params.url);
  evccState = {url: last ? last.params.url : '', mapping: {}};
  $('evTitle').textContent = 'Läufe aus evcc übernehmen';
  $('evBody').innerHTML = `<div class="stack">
    <div class="why">voltibri liest alle Ladevorgänge über die evcc-API (<code>/api/sessions</code>). Schon übernommene werden übersprungen, laufende ausgelassen.
      Jeder Import lässt sich unter „Importe“ wieder rückgängig machen.</div>
    <label class="f" for="ev_url">Adresse von evcc<input type="text" id="ev_url" value="${esc(evccState.url)}" placeholder="http://evcc.local:7070" autocomplete="off"></label></div>`;
  $('evErr').textContent = '';
  $('evActions').innerHTML = '<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">Vorschau</button>';
  $('ev').dataset.step = 'url';
  $('ev').showModal();
  $('ev_url').focus();
}

async function evccCall(dryRun) {
  const r = await fetch('api/imports/evcc', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url: evccState.url, mapping: evccState.mapping, dryRun})});
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error([res.error || 'Fehler ' + r.status].concat(res.details || []).join(' · '));
  return res;
}

function renderPreview(p) {
  const day = t => new Date(t).toLocaleDateString('de-DE');
  const opts = sel => `<option value="-"${sel === '-' ? ' selected' : ''}>nicht übernehmen</option><option value="="${sel === '=' || sel === '' ? ' selected' : ''}>übernehmen mit Namen aus evcc</option>` + importTargets().map(c =>
    `<option value="${esc(c.id)}"${c.id === sel ? ' selected' : ''}>${esc(c.name)} (${esc(KIND_LABEL[c.kind] || c.kind)}${c.retired ? ', stillgelegt' : ''})</option>`).join('');
  $('evBody').innerHTML = `<div class="stack">
    ${kv([['Neu', `<b>${p.new}</b> Ladevorgänge`], ['Schon übernommen', p.duplicate], ['Laufen noch', p.unfinished], ['Ausgelassen', p.excluded],
      p.new ? ['Zeitraum', `${day(p.from)} – ${day(p.to)}`] : null, p.new ? ['Energie', num(p.energyWh / 1000, 1) + ' kWh'] : null,
      p.new ? ['Mit Preis', `${p.withPrice} von ${p.new}`] : null])}
    ${p.loadpoints.length ? `<fieldset class="roles"><legend>Zuordnung der Ladepunkte</legend>
      ${p.loadpoints.map(m => `<label class="f">${esc(m.title)} <span class="why">(${m.sessions} ${m.target === '-' ? 'Einträge' : RUN_KIND_TEXT[m.runKind] || 'Läufe'}${m.auto ? (m.target === '-' ? ', kein passendes Gerät' : ', per Name erkannt') : ''})</span>
        <select data-map="${esc(m.title)}">${opts(m.target)}</select></label>`).join('')}</fieldset>` : ''}
    ${p.new && p.withPrice < p.new ? '<div class="note">Ladevorgänge ohne Preis werden ohne Kosten übernommen (angezeigt als „–“), nicht nachträglich berechnet.</div>' : ''}
  </div>`;
  $('evActions').innerHTML = p.new
    ? `<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">${p.new} Läufe importieren</button>`
    : '<button type="button" class="btn primary" data-close>Schließen</button>';
  $('ev').dataset.step = 'preview';
}

$('evForm').addEventListener('submit', async e => {
  e.preventDefault();
  const step = $('ev').dataset.step;
  $('evErr').textContent = '';
  if (step === 'url') {
    evccState.url = $('ev_url').value.trim();
    if (!/^https?:\/\//.test(evccState.url)) { $('evErr').textContent = 'Bitte die Adresse mit http:// oder https:// angeben.'; return; }
  }
  if (step === 'preview') {
    for (const s of document.querySelectorAll('[data-map]')) evccState.mapping[s.dataset.map] = s.value;
  }
  const prev = $('evActions').innerHTML;
  $('evActions').innerHTML = `<button type="button" class="btn" disabled>${step === 'url' ? 'evcc wird abgefragt …' : 'Importiere …'}</button>`;
  try {
    const res = await evccCall(step === 'url');
    if (step === 'url') return renderPreview(res.preview);
    $('evBody').innerHTML = res.import
      ? `<div class="why">Import ${res.import.id}: <b>${res.import.count}</b> Läufe übernommen. Sie sind als „aus evcc“ gekennzeichnet und lassen sich unter „Importe“ rückgängig machen.</div>`
      : '<div class="why">Nichts Neues – alle Ladevorgänge waren schon übernommen.</div>';
    $('evActions').innerHTML = '<button type="button" class="btn primary" data-close>Fertig</button>';
    load();
  } catch (err) {
    $('evErr').textContent = err.message;
    $('evActions').innerHTML = prev;
  }
});
$('ev').addEventListener('click', e => { if (e.target === $('ev') || e.target.closest('[data-close]')) $('ev').close(); });

// ---- grid connection and sub-distributions ----
const liveCircuit = id => ((D.state && D.state.circuits) || []).find(c => c.id === id);
const devName = id => ((D.cfg.devices || []).find(d => d.id === id) || {}).name || id;

function loadHTML(st, maxA) {
  if (!st) return '<span class="why">keine Messung</span>';
  const a = st.currentsA.map(x => num(x, 1)).join(' / ');
  const u = maxA > 0 ? Math.max(...st.currentsA) / maxA : 0;
  const cls = u > 1 ? 'over' : u > 0.9 ? 'high' : '';
  return `<div class="load"><span>${a} A${st.estimated ? ' <span class="why">(teils geschätzt)</span>' : ''}</span>
    ${maxA > 0 ? `<div class="ubar ${cls}" title="${Math.round(u * 100)} % der Absicherung"><i style="width:${Math.min(100, u * 100).toFixed(0)}%"></i></div>` : ''}</div>`;
}

function gridSection() {
  const g = D.cfg.grid || {}, circuits = D.cfg.circuits || [];
  const root = liveCircuit('grid');
  const head = `<div class="dev">
    <span class="ic">${iconSVG('grid', 22)}</span>
    <div><div class="nm">Hausanschluss</div>
      <div class="meta"><span>${g.fuseA ? `${num(g.fuseA, 0)} A` : 'Absicherung nicht eingetragen'}</span><span>${g.phases === 1 ? 'einphasig' : 'dreiphasig'}</span>
      <span>gemessen über ${esc(devName(D.cfg.roles.grid || '–'))}</span>${root && root.over ? '<span class="chip err">überlastet</span>' : ''}</div></div>
    <span class="val">${root ? kw(Math.abs(D.state.gridW || 0)) : ''}</span>
    <span class="act">${D.readOnly || !D.local ? '' : '<button type="button" class="btn" data-section="grid">Bearbeiten</button>'}</span>
    <div class="extra">${loadHTML(root, g.fuseA)}</div></div>`;
  const rows = circuits.map(c => {
    const st = liveCircuit(c.id);
    const parent = c.parent ? (circuits.find(x => x.id === c.parent) || {}).name || c.parent : '';
    return `<div class="dev sub">
      <span class="ic">${iconSVG('plug', 22)}</span>
      <div><div class="nm">${esc(c.name || c.id)}</div>
        <div class="meta"><span>${c.maxCurrent ? num(c.maxCurrent, 0) + ' A' : 'ohne Sicherung'}</span><span>${c.phases === 1 ? 'einphasig' : 'dreiphasig'}</span>
        ${parent ? `<span>hinter ${esc(parent)}</span>` : ''}<span>${c.meter ? 'Zähler: ' + esc(devName(c.meter)) : 'kein eigener Zähler'}</span>
        ${st && st.over ? '<span class="chip err">überlastet</span>' : ''}</div></div>
      <span class="val">${st ? kw(st.powerW) : ''}</span>
      <span class="act"><button type="button" class="btn" data-circuit="${esc(c.id)}">${D.readOnly || !D.local ? 'Ansehen' : 'Bearbeiten'}</button></span>
      <div class="extra">${loadHTML(st, c.maxCurrent)}<span>${(c.devices || []).map(d => '<b>' + esc(devName(d)) + '</b>').join(', ') || 'keine Geräte'}</span></div></div>`;
  }).join('');
  return `<div class="devs">${head}${rows}</div>` + (circuits.length ? '' :
    '<p class="why" style="margin:10px 0 0">Noch keine Unterverteilung. Beispiel: beide Wallboxen hängen gemeinsam an 32 A.</p>') +
    '<p class="why" style="margin:10px 0 0">Ströme pro Phase L1 / L2 / L3. Geräte ohne Phasenmessung werden aus der Leistung geschätzt.</p>';
}

function openCircuit(id) {
  const all = D.cfg.circuits || [];
  const c = id ? all.find(x => x.id === id) : {id: '', name: '', maxCurrent: 32, phases: 3, devices: []};
  const isNew = !id, ro = D.readOnly || !D.local;
  const owner = {};
  all.forEach(x => (x.devices || []).forEach(d => { if (x.id !== id) owner[d] = x.name || x.id; }));
  const cands = (D.cfg.devices || []).filter(d => {
    const drv = voltibri.driver(d.type) || {};
    return (drv.capabilities || []).some(cap => ['charger', 'consumer', 'switch'].includes(cap));
  });
  const meters = (D.cfg.devices || []).filter(d => ((voltibri.driver(d.type) || {}).capabilities || []).includes('phases'));
  $('circTitle').textContent = isNew ? 'Unterverteilung anlegen' : (c.name || c.id) + ' bearbeiten';
  $('circBody').innerHTML = `<div class="stack">
    <label class="f" for="ci_name">Name *<input type="text" id="ci_name" value="${esc(c.name || '')}" placeholder="z. B. Wallboxen Garage" autocomplete="off"></label>
    <label class="f" for="ci_max">Absicherung pro Phase (A) *<input type="number" id="ci_max" min="1" max="1000" step="1" value="${c.maxCurrent || ''}">
      <span class="why">Die Sicherung vor der Unterverteilung, z. B. 32 A für zwei Wallboxen.</span></label>
    <label class="f" for="ci_ph">Anschluss<select id="ci_ph"><option value="3"${c.phases !== 1 ? ' selected' : ''}>dreiphasig</option><option value="1"${c.phases === 1 ? ' selected' : ''}>einphasig</option></select></label>
    <fieldset class="roles"><legend>Angeschlossene Geräte</legend>
      ${cands.map(d => `<label class="f cb"><input type="checkbox" data-cdev="${esc(d.id)}"${(c.devices || []).includes(d.id) ? ' checked' : ''}${owner[d.id] ? ' disabled' : ''}>
        ${esc(d.name || d.id)}${owner[d.id] ? ` <span class="why">(in ${esc(owner[d.id])})</span>` : ''}</label>`).join('') || '<span class="why">Keine Verbraucher konfiguriert.</span>'}
    </fieldset>
    <details${c.parent || c.meter ? ' open' : ''}><summary>Erweiterte Einstellungen</summary><div>
      <label class="f" for="ci_parent">Hängt an<select id="ci_parent"><option value="">Hausanschluss</option>${all.filter(x => x.id !== id).map(x =>
        `<option value="${esc(x.id)}"${x.id === c.parent ? ' selected' : ''}>${esc(x.name || x.id)}</option>`).join('')}</select></label>
      <label class="f" for="ci_meter">Eigener Zähler<select id="ci_meter"><option value="">keiner – Summe der Geräte</option>${meters.map(d =>
        `<option value="${esc(d.id)}"${d.id === c.meter ? ' selected' : ''}>${esc(d.name || d.id)}</option>`).join('')}</select>
        <span class="why">Misst die ganze Unterverteilung, auch Geräte, die voltibri nicht kennt.</span></label>
      ${isNew ? '' : `<span class="why">ID: ${esc(c.id)}</span>`}
    </div></details></div>`;
  $('circErr').textContent = ro ? (D.readOnly ? 'Die Konfiguration wird über eine YAML-Datei verwaltet – hier nur ansehen.' : 'Ändern nur vom lokalen Rechner aus.') : '';
  $('circActions').innerHTML = `${isNew || ro ? '' : '<button type="button" class="btn danger" data-cremove>Entfernen</button><span class="spacer"></span>'}
    <button type="button" class="btn" data-close>${ro ? 'Schließen' : 'Abbrechen'}</button>${ro ? '' : '<button type="submit" class="btn primary">Speichern</button>'}`;
  $('circ').dataset.id = id || '';
  $('circ').showModal();
}

const slug = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'verteilung';

async function saveCircuits(list, msg) {
  $('circActions').innerHTML = '<button type="button" class="btn" disabled>Speichern …</button>';
  const r = await fetch('api/config/section/circuits', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(list)});
  const res = await r.json().catch(() => ({}));
  if (!r.ok) {
    $('circErr').textContent = [res.error || 'Fehler ' + r.status].concat(res.details || []).join(' · ');
    $('circActions').innerHTML = '<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">Speichern</button>';
    return;
  }
  $('circBody').innerHTML = `<div class="why">${msg} (Version ${res.id}). Das Lastmanagement nutzt die neuen Werte ab der nächsten Messung.</div>`;
  $('circErr').textContent = '';
  $('circActions').innerHTML = '<button type="button" class="btn primary" data-close>Fertig</button>';
  setTimeout(load, 1500);
}

$('circForm').addEventListener('submit', e => {
  e.preventDefault();
  const id = $('circ').dataset.id, all = (D.cfg.circuits || []).map(x => ({...x}));
  const name = $('ci_name').value.trim(), max = Number($('ci_max').value);
  if (!name || !(max > 0)) { $('circErr').textContent = 'Bitte Name und Absicherung angeben.'; return; }
  const c = {id: id || slug(name), name, maxCurrent: max, phases: Number($('ci_ph').value),
    devices: [...document.querySelectorAll('[data-cdev]:checked')].map(x => x.dataset.cdev)};
  if ($('ci_parent').value) c.parent = $('ci_parent').value;
  if ($('ci_meter').value) c.meter = $('ci_meter').value;
  if (!id) { let n = 2; const base = c.id; while (all.some(x => x.id === c.id)) c.id = base + '-' + n++; all.push(c); }
  else all[all.findIndex(x => x.id === id)] = c;
  saveCircuits(all, 'Gespeichert');
});
$('circ').addEventListener('click', e => {
  if (e.target === $('circ') || e.target.closest('[data-close]')) $('circ').close();
  if (e.target.closest('[data-cremove]')) {
    const id = $('circ').dataset.id;
    if (!confirm('Unterverteilung entfernen? Die Geräte hängen danach direkt am Hausanschluss.')) return;
    const all = (D.cfg.circuits || []).filter(x => x.id !== id).map(x => x.parent === id ? {...x, parent: undefined} : x);
    saveCircuits(all, 'Entfernt');
  }
});

// ---- charging cards and loadpoint settings ----
const MODE_NAME = {off: 'Aus', pv: 'Überschuss', minpv: 'Min+PV', pv1: '1-phasig + PV', boost: 'Boost', external: 'Extern', fast: 'Schnell'};

// every card a wallbox knows, plus cards that only exist in the settings
function cardsSection() {
  const c = window._cards || {known: [], settings: []};
  const names = [...new Set([...c.known, ...c.settings.map(s => s.card)])];
  const ro = D.readOnly || !D.local;
  const vehicles = (D.charging.vehicles || []);
  const row = n => {
    const s = c.settings.find(x => x.card.toLowerCase() === n.toLowerCase()) || {};
    const vOpts = [['', 'automatisch erkennen'], ['guest', 'Gastfahrzeug'], ...vehicles.map(v => [v.key, v.name])]
      .map(([k, l]) => `<option value="${esc(k)}"${k === (s.vehicle || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');
    const mOpts = [['', 'Standard des Fahrzeugs'], ...Object.entries(MODE_NAME)]
      .map(([k, l]) => `<option value="${k}"${k === (s.mode || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');
    return `<tr data-card="${esc(n)}"><td>${iconSVG('device', 14)} ${esc(n)}${c.known.includes(n) ? '' : ' <span class="why">(nicht in der Wallbox)</span>'}</td>
      <td><select data-cardveh${ro ? ' disabled' : ''}>${vOpts}</select></td><td><select data-cardmode${ro ? ' disabled' : ''}>${mOpts}</select></td></tr>`;
  };
  return `<div class="sublabel">Ladekarten</div>` + (names.length
    ? `<div class="tablewrap"><table class="list cards"><thead><tr><th>Karte</th><th>Fahrzeug</th><th>Lademodus für den Ladevorgang</th></tr></thead><tbody>${names.map(row).join('')}</tbody></table></div>
      <p class="why" style="margin:8px 0 0">Wird eine Karte an der Wallbox vorgehalten, gelten Fahrzeug und Modus bis zum Abstecken. Ohne Karte startet ein Gastfahrzeug mit dem Gast-Standard des Ladepunkts.</p>`
    : '<p class="why" style="margin:6px 0 0">Keine Ladekarten gefunden. Karten werden in der App der Wallbox angelernt.</p>');
}

async function saveCards() {
  const list = [...document.querySelectorAll('tr[data-card]')].map(tr => ({card: tr.dataset.card,
    vehicle: tr.querySelector('[data-cardveh]').value || undefined, mode: tr.querySelector('[data-cardmode]').value || undefined}))
    .filter(x => x.vehicle || x.mode);
  const r = await fetch('api/config/section/cards', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(list)});
  if (!r.ok) { const x = await r.json().catch(() => ({})); alert([x.error].concat(x.details || []).join('\n')); }
  setTimeout(load, 1200);
}

function openLoadpoint(id) {
  const all = (D.cfg.charging && D.cfg.charging.loadpoints) || [];
  const lp = all.find(l => l.charger === id) || {charger: id};
  const dev = (D.cfg.devices || []).find(d => d.id === id) || {};
  const sel = (sid, opts, v) => `<select id="${sid}">${opts.map(([k, l]) => `<option value="${k}"${String(k) === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  $('lpTitle').textContent = (dev.name || id) + ' – Ladepunkt';
  $('lpBody').innerHTML = `<div class="stack">
    <label class="f">Beim Anstecken eines Gastfahrzeugs${sel('lp_gmode', Object.entries(MODE_NAME), lp.guestMode || 'off')}
      <span class="why">„Aus“: Gäste laden erst, wenn jemand startet – per Ladekarte oder Knopf in der Übersicht.</span></label>
    <label class="f">Gäste und Hausbatterie${sel('lp_guest', [['share', 'teilen – Gast darf PV nutzen, zahlt Netzpreis'], ['batteryFirst', 'Batterie zuerst – Gast bekommt nur, was die Batterie nicht braucht'], ['forceBattery', 'Batterie erzwingen – Batterie lädt weiter wie ohne Gast']], lp.guest || 'share')}</label>
    <label class="f cb"><input type="checkbox" id="lp_gnb"${lp.guestNoBattery ? ' checked' : ''}> Gäste nie aus der Hausbatterie laden</label>
    <div class="row2"><label class="f">Phasen${sel('lp_ph', [[3, 'dreiphasig'], [1, 'einphasig']], lp.phases || 3)}</label>
      <label class="f">Strom min–max (A)<span style="display:flex;gap:6px"><input type="number" id="lp_min" min="6" max="32" value="${lp.minCurrent || 6}"><input type="number" id="lp_max" min="6" max="32" value="${lp.maxCurrent || 16}"></span></label></div>
  </div>`;
  $('lpErr').textContent = '';
  $('lpActions').innerHTML = '<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">Speichern</button>';
  $('lpd').dataset.id = id;
  $('lpd').showModal();
}

$('lpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('lpd').dataset.id, all = ((D.cfg.charging && D.cfg.charging.loadpoints) || []).filter(l => l.charger !== id);
  const old = ((D.cfg.charging && D.cfg.charging.loadpoints) || []).find(l => l.charger === id) || {};
  all.push({...old, charger: id, guestMode: $('lp_gmode').value, guest: $('lp_guest').value, guestNoBattery: $('lp_gnb').checked || undefined,
    phases: Number($('lp_ph').value), minCurrent: Number($('lp_min').value), maxCurrent: Number($('lp_max').value)});
  const r = await fetch('api/config/section/loadpoints', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(all)});
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { $('lpErr').textContent = [res.error || 'Fehler ' + r.status].concat(res.details || []).join(' · '); return; }
  $('lpd').close();
  setTimeout(load, 1200);
});
$('lpd').addEventListener('click', e => { if (e.target === $('lpd') || e.target.closest('[data-close]')) $('lpd').close(); });
document.addEventListener('change', e => { if (e.target.matches('[data-cardveh], [data-cardmode]')) saveCards(); });

function render() {
  const groups = Object.fromEntries(AREAS.map(a => [a.key, []]));
  for (const d of D.cfg.devices || []) groups[areaOf(d)].push(d);
  const canAdd = !D.readOnly && D.local;
  $('toc').innerHTML = AREAS.map(a => `<a href="#${a.key}">${a.title}${a.pick ? `<span class="n">${groups[a.key].length}</span>` : ''}</a>`).join('');
  $('areas').innerHTML = AREAS.map(a => {
    let inner;
    if (a.key === 'strategy') inner = strategySection();
    else if (a.key === 'grid') inner = gridSection();
    else if (a.key === 'surplus') inner = surplusSection();
    else if (a.key === 'users') inner = `<div class="usersbody">${usersSection()}</div>`;
    else if (a.key === 'system') inner = systemSection();
    else {
      const devs = groups[a.key];
      if (a.key === 'vehicles') {
        const cars = devs.filter(d => d.type === 'vehicle'), accts = devs.filter(d => d.type !== 'vehicle');
        inner = `<div class="devs">${cars.length ? cars.map(d => devRow(d, a.key)).join('') : '<div class="empty">Noch keine Fahrzeuge angelegt.</div>'}</div>` +
          (accts.length ? `<div class="sublabel">Datenquellen</div><div class="devs">${accts.map(d => devRow(d, a.key)).join('')}</div>` : '');
        return areaCard(a, inner, canAdd);
      }
      inner = `<div class="devs">${devs.length ? devs.map(d => devRow(d, a.key)).join('') : '<div class="empty">Noch nichts eingerichtet.</div>'}</div>${extraSection(a.key)}`;
    }
    return areaCard(a, inner, canAdd);
  }).join('');
}

function areaCard(a, inner, canAdd) {
    const add = !canAdd ? '' : a.pick ? `<button type="button" class="btn" data-add="${a.key}">+ hinzufügen</button>`
      : a.key === 'strategy' ? '<button type="button" class="btn" data-section="planner">Bearbeiten</button>'
      : a.key === 'grid' ? '<button type="button" class="btn" data-circuit="">+ Unterverteilung</button>'
      : a.key === 'users' ? '<button type="button" class="btn" data-user="">+ Benutzer</button>' : '';
    return `<section class="card area" id="${a.key}">
      <div class="head"><span class="ic">${iconSVG(a.icon, 20)}</span><h2>${a.title}</h2><span class="spacer"></span>${add}</div>
      <p class="why">${a.why}</p>${inner}</section>`;
}

async function load() {
  const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
  await voltibri.ready;
  const [cfg, status, state, charging, versions, imports, assets, runs, cards, runVehicles, users, groups, prov] = await Promise.all([j('api/config'), j('api/status'), j('api/state'),
    j('api/charging'), j('api/config/versions'), j('api/imports'), j('api/assets'), j('api/runs/summary'), j('api/charging/cards'), j('api/runs/vehicles?kind=charging'), j('api/users'), j('api/groups'), j('api/auth/providers')]);
  const [bat, loads] = await Promise.all([j('api/battery'), j('api/loads')]);
  window._cards = cards || {known: [], settings: []};
  if (!cfg) { $('banner').hidden = false; $('banner').className = 'banner err'; $('banner').textContent = 'Konfiguration konnte nicht geladen werden.'; return; }
  D = {cfg: cfg.config, version: cfg.version, readOnly: cfg.readOnly, status: status || {}, state, charging: charging || {}, versions: versions || [], imports: imports || [], assets: assets || [], runs: runs || [], runVehicles: runVehicles || [], users: users || [], groups: groups || [], providers: (prov || {}).providers || [], redirectUri: (prov || {}).redirectUri,
       local: charging ? charging.local !== false : true, bat: bat && bat.hasBattery ? bat : null, loads: loads || []};
  D.cfg.roles = D.cfg.roles || {};
  D.cfg.site = D.cfg.site || {};
  D.cfg.battery = D.cfg.battery || {};
  $('hstatus').innerHTML = (D.readOnly ? '<span class="badge warn">über YAML verwaltet</span>' : '') +
    `<span class="badge">${D.version.id ? `Version ${D.version.id} · ${when(D.version.createdAt)}` : 'noch nicht gespeichert'}</span>`;
  const b = $('banner');
  const msg = new URLSearchParams(location.search).get('oauth');
  if (msg) history.replaceState(null, '', location.pathname + location.hash);
  if (msg) { b.hidden = false; b.className = 'banner'; b.textContent = msg === 'ok' ? 'Anmeldung erfolgreich.' : msg; }
  else if (D.status.state && D.status.state !== 'running') { b.hidden = false; b.className = 'banner' + (D.status.state === 'error' ? ' err' : ''); b.textContent = D.status.message || ''; }
  else if (!D.local && !D.readOnly) { b.hidden = false; b.className = 'banner'; b.textContent = 'Ändern ist bis zur Einführung der Anmeldung nur vom lokalen Rechner aus möglich.'; }
  else b.hidden = true;
  render();
  if (location.hash && !load.scrolled) { load.scrolled = true; const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}

$('areas').addEventListener('click', async e => {
  if (e.target.closest('[data-evcc]')) return openEvcc();
  const dr = e.target.closest('[data-dryrun]');
  if (dr) { // test mode: measure and decide, but write nothing to the devices
    const on = dr.dataset.dryrun === 'on';
    const owned = (D.cfg.devices || []).filter(d => d.mode === 'owned').map(d => d.name || d.id);
    const q = on ? 'Testmodus einschalten? voltibri misst und plant weiter, schreibt aber nichts mehr auf die Geräte und protokolliert nur, was es tun würde.'
      : `Testmodus ausschalten? voltibri steuert dann ${owned.length ? 'diese Geräte: ' + owned.join(', ') : 'alle Geräte im Modus „von voltibri gesteuert“'}.`;
    if (!confirm(q)) return;
    const r = await fetch('api/config/dryrun', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({on})});
    if (!r.ok) { const x = await r.json().catch(() => ({})); alert([x.error].concat(x.details || []).join('\n')); }
    return setTimeout(load, 1200); // the site restarts with the new version
  }
  const un = e.target.closest('[data-undo]');
  if (un) {
    if (!confirm(`Import ${un.dataset.undo} rückgängig machen? Die ${un.dataset.count} Ladevorgänge dieses Imports werden entfernt. Eigene Ladevorgänge und andere Importe bleiben unberührt.`)) return;
    const r = await fetch(`api/imports/${un.dataset.undo}/undo`, {method: 'POST'});
    const x = await r.json().catch(() => ({}));
    if (!r.ok) alert(x.error || 'Fehler ' + r.status);
    return load();
  }
  const ad = e.target.closest('[data-adopt]');
  if (ad) {
    const v = (D.charging.vehicles || []).find(x => x.key === ad.dataset.adopt);
    if (v) return voltibri.open({type: 'vehicle', defaults: {icon: 'car', name: v.name, params: {source: v.provider, sourceVehicle: v.sourceId}}, onDone: load});
  }
  const ue = e.target.closest('[data-user]');
  if (ue && !e.target.closest('dialog')) return openUser(ue.dataset.user);
  const ge = e.target.closest('[data-group]');
  if (ge && !e.target.closest('dialog')) return openGroup(ge.dataset.group);
  const pe = e.target.closest('[data-provider]');
  if (pe && !e.target.closest('dialog')) return openProvider(pe.dataset.provider);
  const lpe = e.target.closest('[data-lpedit]');
  if (lpe) return openLoadpoint(lpe.dataset.lpedit);
  const ci = e.target.closest('[data-circuit]');
  if (ci) return openCircuit(ci.dataset.circuit);
  const sec = e.target.closest('[data-section]');
  if (sec) return openSection(sec.dataset.section);
  const ed = e.target.closest('[data-edit]');
  if (ed) return voltibri.open({id: ed.dataset.edit, onDone: load});
  const add = e.target.closest('[data-add]');
  if (add) {
    const a = AREAS.find(x => x.key === add.dataset.add);
    const choose = voltibri.drivers().filter(d => a.pick.includes(d.category)).map(d => d.type);
    return voltibri.open({choose, title: a.title + ': hinzufügen', defaults: {icon: a.defIcon, kind: a.defKind}, onDone: load});
  }
  const rb = e.target.closest('[data-rollback]');
  if (rb && confirm(`Version ${rb.dataset.rollback} zurückholen? Das wird als neue Version gespeichert.`)) {
    const r = await fetch(`api/config/versions/${rb.dataset.rollback}/rollback`, {method: 'POST'});
    if (!r.ok) { const x = await r.json().catch(() => ({})); alert([x.error].concat(x.details || []).join('\n')); }
    setTimeout(load, 1500);
  }
});

// --- users and groups (not part of the configuration versions) ---
const wallboxes = () => (D.cfg.devices || []).filter(d => assetOf(d.id).kind === 'ev-charger' && !assetOf(d.id).retired);
const ownVehicles = () => (D.cfg.devices || []).filter(d => d.type === 'vehicle' && !assetOf(d.id).retired);
function groupRights(g) {
  const out = [];
  if (g.flow) out.push('Energiefluss');
  if (g.forecast) out.push('Prognose');
  if (g.heat) out.push('Wärmepumpe');
  if (g.reports) out.push('Berichte');
  if ((g.loadpoints || []).length) out.push('Wallbox: ' + g.loadpoints.map(devName).join(', '));
  if ((g.vehicles || []).length) out.push('Fahrzeug: ' + g.vehicles.map(devName).join(', '));
  return out.length ? out : ['keine Freigaben'];
}
function usersSection() {
  const groups = D.groups || [], users = D.users || [];
  const gname = id => (groups.find(g => g.id === id) || {}).name || id;
  const seen = u => u.lastSeen ? 'zuletzt ' + when(u.lastSeen) : 'noch nie angemeldet';
  const urows = users.map(u => `<div class="dev${u.disabled ? ' retired' : ''}">
    <span class="ic">${iconSVG('user', 22)}</span>
    <div><div class="nm">${esc(u.name || u.login)}</div>
      <div class="meta"><span>${esc(u.login)}</span><span class="chip${u.role === 'admin' ? ' ctl' : ''}">${u.role === 'admin' ? 'Administrator' : 'Benutzer'}</span>
        ${u.groups.map(g => `<span class="chip">${esc(gname(g))}</span>`).join('')}
        ${u.disabled ? '<span class="chip">gesperrt</span>' : u.hasPassword ? '' : '<span class="chip dry">Einladung offen</span>'}</div></div>
    <span class="val" style="font-size:12px;color:var(--muted)">${seen(u)}</span>
    <span class="act"><button type="button" class="btn" data-user="${esc(u.id)}">Bearbeiten</button></span></div>`).join('');
  const grows = groups.map(g => `<div class="dev">
    <span class="ic">${iconSVG('users', 22)}</span>
    <div><div class="nm">${esc(g.name)}</div><div class="meta">${groupRights(g).map(x => `<span>${esc(x)}</span>`).join('')}</div></div>
    <span class="val" style="font-size:12px;color:var(--muted)">${users.filter(u => u.groups.includes(g.id)).length} Mitglieder</span>
    <span class="act"><button type="button" class="btn" data-group="${esc(g.id)}">Bearbeiten</button></span></div>`).join('');
  return `<div class="devs">${urows || '<div class="empty">Noch keine Benutzer.</div>'}</div>
    <div class="sublabel">Gruppen <button type="button" class="linkbtn" data-group="">+ Gruppe</button></div>
    <div class="devs">${grows || '<div class="empty">Noch keine Gruppen. Eine Gruppe gibt z. B. Wallboxen und ein Fahrzeug frei.</div>'}</div>
    <div class="sublabel">Anmeldedienste <button type="button" class="linkbtn" data-provider="">+ Dienst</button></div>
    <div class="devs">${(D.providers || []).map(p => `<div class="dev">
      <span class="ic">${iconSVG('lock', 22)}</span>
      <div><div class="nm">${esc(p.name)}</div><div class="meta"><span>${esc(p.issuer)}</span><span>Client-ID ${esc(p.clientId)}</span></div></div>
      <span class="val"></span>
      <span class="act"><button type="button" class="btn" data-provider="${esc(p.id)}">Bearbeiten</button></span></div>`).join('') ||
      '<div class="empty">Keine. Mit einem OpenID-Connect-Dienst wie Pocket ID oder Google können sich Benutzer ohne Passwort anmelden – sie verbinden ihn selbst unter „Konto“.</div>'}</div>`;
}

function openProvider(id) {
  const p = id ? D.providers.find(x => x.id === id) : {name: '', issuer: '', clientId: ''};
  $('udTitle').textContent = id ? p.name + ' bearbeiten' : 'Anmeldedienst hinzufügen';
  $('udBody').innerHTML = `<div class="stack">
    <ol class="steps"><li>Beim Dienst eine Anwendung (OIDC-Client) für voltibri anlegen, z. B. in Pocket ID unter „OIDC Clients“.</li>
      <li>Dort als Callback- bzw. Redirect-URL eintragen:<div class="copy"><code id="p_redir">${esc(D.redirectUri || '')}</code><button type="button" class="btn" data-copyredir>Kopieren</button></div></li>
      <li>Client-ID und Client-Secret hier eintragen.</li></ol>
    <label class="f" for="p_name">Name auf dem Knopf *<input type="text" id="p_name" value="${esc(p.name)}" placeholder="z. B. Pocket ID" autocomplete="off"></label>
    <label class="f" for="p_iss">Aussteller-URL (Issuer) *<input type="text" id="p_iss" value="${esc(p.issuer)}" placeholder="https://id.example.com oder https://accounts.google.com" autocomplete="off" autocapitalize="none"></label>
    <div class="row2"><label class="f" for="p_cid">Client-ID *<input type="text" id="p_cid" value="${esc(p.clientId)}" autocomplete="off" autocapitalize="none"></label>
      <label class="f" for="p_sec">Client-Secret<input type="password" id="p_sec" autocomplete="new-password" placeholder="${p.hasSecret ? 'gespeichert – leer lassen, um es zu behalten' : ''}"></label></div>
    <span class="why">Das Secret wird verschlüsselt gespeichert. Beim Speichern prüft voltibri, ob der Dienst erreichbar ist.</span>
  </div>`;
  $('udErr').textContent = '';
  $('udActions').innerHTML = `${id ? '<button type="button" class="btn danger" data-pdel>Löschen</button><span class="spacer"></span>' : ''}
    <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">${id ? 'Speichern' : 'Hinzufügen'}</button>`;
  $('ud').dataset.kind = 'provider';
  $('ud').dataset.id = id || '';
  $('ud').showModal();
}

async function sendJSON(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error([j.error || 'Fehler ' + r.status].concat(j.details || []).join(' · '));
  return j;
}

function openUser(id) {
  const u = id ? D.users.find(x => x.id === id) : {login: '', name: '', email: '', role: 'user', groups: []};
  const self = window.ME && window.ME.user.id === id;
  $('udTitle').textContent = id ? (u.name || u.login) + ' bearbeiten' : 'Benutzer anlegen';
  $('udBody').innerHTML = `<div class="stack">
    <div class="row2"><label class="f" for="u_name">Name<input type="text" id="u_name" value="${esc(u.name)}" placeholder="z. B. Maria Muster" autocomplete="off"></label>
      <label class="f" for="u_login">Benutzername *<input type="text" id="u_login" value="${esc(u.login)}" placeholder="z. B. maria" autocomplete="off" autocapitalize="none"></label></div>
    <label class="f" for="u_mail">E-Mail<input type="text" id="u_mail" value="${esc(u.email || '')}" autocomplete="off" inputmode="email"></label>
    <label class="f" for="u_role">Rolle<select id="u_role"${self ? ' disabled' : ''}><option value="user"${u.role !== 'admin' ? ' selected' : ''}>Benutzer – sieht nur, was die Gruppen freigeben</option>
      <option value="admin"${u.role === 'admin' ? ' selected' : ''}>Administrator – alles, auch Konfiguration und Benutzer</option></select></label>
    <fieldset class="roles"><legend>Gruppen</legend>${(D.groups || []).map(g => `<label class="f cb"><input type="checkbox" data-ug="${esc(g.id)}"${u.groups.includes(g.id) ? ' checked' : ''}>
      ${esc(g.name)} <span class="why">(${esc(groupRights(g).join(' · '))})</span></label>`).join('') || '<span class="why">Noch keine Gruppen angelegt.</span>'}</fieldset>
    ${id && !self ? `<label class="f cb"><input type="checkbox" id="u_dis"${u.disabled ? ' checked' : ''}> Gesperrt – kann sich nicht anmelden</label>` : ''}
    ${id ? `<div class="sublabel" style="margin:0">Zugang</div>
      <div class="why">${u.hasPassword ? 'Passwort gesetzt.' : 'Noch kein Passwort.'} Ein Einladungslink (7 Tage gültig, einmalig) lässt ${esc(u.name || u.login)} ein ${u.hasPassword ? 'neues ' : ''}Passwort festlegen.</div>
      <div class="actions" style="justify-content:flex-start"><button type="button" class="btn" data-invite="${esc(id)}">${iconSVG('key', 14)} Einladungslink erzeugen</button>
        ${self ? '' : `<button type="button" class="btn" data-ulogout="${esc(id)}">Überall abmelden</button>`}</div>
      <div id="u_link"></div>` : '<div class="why">Nach dem Anlegen bekommst du einen Einladungslink, mit dem die Person ihr Passwort festlegt.</div>'}
  </div>`;
  $('udErr').textContent = '';
  $('udActions').innerHTML = `${id && !self ? '<button type="button" class="btn danger" data-udel>Löschen</button><span class="spacer"></span>' : ''}
    <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">${id ? 'Speichern' : 'Anlegen'}</button>`;
  $('ud').dataset.kind = 'user';
  $('ud').dataset.id = id || '';
  $('ud').showModal();
}

function openGroup(id) {
  const g = id ? D.groups.find(x => x.id === id) : {name: '', flow: false, forecast: false, heat: false, reports: true, loadpoints: [], vehicles: []};
  const box = (attr, list, sel) => list.map(d => `<label class="f cb"><input type="checkbox" ${attr}="${esc(d.id)}"${sel.includes(d.id) ? ' checked' : ''}> ${esc(d.name || d.id)}</label>`).join('');
  $('udTitle').textContent = id ? 'Gruppe ' + g.name : 'Gruppe anlegen';
  $('udBody').innerHTML = `<div class="stack">
    <label class="f" for="g_name">Name *<input type="text" id="g_name" value="${esc(g.name)}" placeholder="z. B. Familie oder Nachbarn" autocomplete="off"></label>
    <fieldset class="roles"><legend>Wallboxen</legend>${box('data-glp', wallboxes(), g.loadpoints) || '<span class="why">Keine Wallboxen.</span>'}
      <span class="why">Mitglieder sehen und steuern diese Wallboxen – solange kein fremdes Fahrzeug lädt (dann sehen sie nur „belegt“).</span></fieldset>
    <fieldset class="roles"><legend>Fahrzeuge</legend>${box('data-gveh', ownVehicles(), g.vehicles) || '<span class="why">Keine Fahrzeuge.</span>'}
      <span class="why">Lademodus und Ladeplan dieser Fahrzeuge; an den Wallboxen auswählbar.</span></fieldset>
    <fieldset class="roles"><legend>Weitere Freigaben</legend>
      <label class="f cb"><input type="checkbox" id="g_rep"${g.reports ? ' checked' : ''}> Berichte – Ladevorgänge, kWh und Kosten der Fahrzeuge oben</label>
      <label class="f cb"><input type="checkbox" id="g_flow"${g.flow ? ' checked' : ''}> Energiefluss – aktuelle Leistungen und Tageswerte (Autarkie, Erzeugung)</label>
      <label class="f cb"><input type="checkbox" id="g_fc"${g.forecast ? ' checked' : ''}> Prognose – Batterieplanung, PV-Prognose, Soll und Ist</label>
      <label class="f cb"><input type="checkbox" id="g_heat"${g.heat ? ' checked' : ''}> Wärmepumpe – Wärmeleistung, COP, Temperaturen</label>
      <span class="why">Ohne „Wärmepumpe“ zeigt der Energiefluss die Heizung nur als Summe: ohne COP und ohne Aufklappen der einzelnen Geräte.</span></fieldset>
  </div>`;
  $('udErr').textContent = '';
  $('udActions').innerHTML = `${id ? '<button type="button" class="btn danger" data-gdel>Löschen</button><span class="spacer"></span>' : ''}
    <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary">${id ? 'Speichern' : 'Anlegen'}</button>`;
  $('ud').dataset.kind = 'group';
  $('ud').dataset.id = id || '';
  $('ud').showModal();
}

function showLink(j) {
  $('u_link').innerHTML = `<div class="copy"><code id="u_linkText">${esc(j.link)}</code><button type="button" class="btn" data-copylink>Kopieren</button></div>
    <span class="why">Gültig bis ${when(j.expires)}. Schick den Link z. B. per Messenger – wer ihn hat, kann das Passwort festlegen.</span>`;
}

$('udForm').addEventListener('submit', async e => {
  e.preventDefault();
  const d = $('ud'), id = d.dataset.id;
  try {
    if (d.dataset.kind === 'user') {
      const body = {login: $('u_login').value, name: $('u_name').value, email: $('u_mail').value, role: $('u_role').value,
        groups: [...d.querySelectorAll('[data-ug]:checked')].map(x => x.dataset.ug), disabled: $('u_dis') ? $('u_dis').checked : false};
      const u = await sendJSON(id ? 'PUT' : 'POST', 'api/users' + (id ? '/' + encodeURIComponent(id) : ''), body);
      if (!id) { // new: show the invite link right away
        await loadUsers();
        openUser(u.id);
        showLink(await sendJSON('POST', `api/users/${encodeURIComponent(u.id)}/invite`));
        return;
      }
    } else if (d.dataset.kind === 'provider') {
      $('udActions').querySelector('[type=submit]').textContent = 'Prüfe …';
      await sendJSON(id ? 'PUT' : 'POST', 'api/auth/providers' + (id ? '/' + encodeURIComponent(id) : ''),
        {name: $('p_name').value, issuer: $('p_iss').value, clientId: $('p_cid').value, clientSecret: $('p_sec').value});
    } else {
      await sendJSON(id ? 'PUT' : 'POST', 'api/groups' + (id ? '/' + encodeURIComponent(id) : ''), {name: $('g_name').value, flow: $('g_flow').checked, forecast: $('g_fc').checked, heat: $('g_heat').checked, reports: $('g_rep').checked,
        loadpoints: [...d.querySelectorAll('[data-glp]:checked')].map(x => x.dataset.glp), vehicles: [...d.querySelectorAll('[data-gveh]:checked')].map(x => x.dataset.gveh)});
    }
    d.close();
    await loadUsers();
  } catch (x) { $('udErr').textContent = x.message; }
});
$('ud').addEventListener('click', async e => {
  const d = $('ud');
  if (e.target === d || e.target.closest('[data-close]')) return d.close();
  try {
    const inv = e.target.closest('[data-invite]');
    if (inv) showLink(await sendJSON('POST', `api/users/${encodeURIComponent(inv.dataset.invite)}/invite`));
    const lo = e.target.closest('[data-ulogout]');
    if (lo) { await sendJSON('POST', `api/users/${encodeURIComponent(lo.dataset.ulogout)}/logout`); lo.textContent = 'Abgemeldet'; lo.disabled = true; }
    if (e.target.closest('[data-copylink]')) navigator.clipboard.writeText($('u_linkText').textContent).then(() => { e.target.closest('[data-copylink]').textContent = 'Kopiert'; }, () => {});
    if (e.target.closest('[data-udel]') && confirm('Benutzer löschen? Anmeldungen und verbundene Logins werden entfernt.')) {
      await sendJSON('DELETE', 'api/users/' + encodeURIComponent(d.dataset.id)); d.close(); await loadUsers();
    }
    if (e.target.closest('[data-gdel]') && confirm('Gruppe löschen? Die Mitglieder verlieren diese Freigaben.')) {
      await sendJSON('DELETE', 'api/groups/' + encodeURIComponent(d.dataset.id)); d.close(); await loadUsers();
    }
    if (e.target.closest('[data-copyredir]')) navigator.clipboard.writeText($('p_redir').textContent).then(() => { e.target.closest('[data-copyredir]').textContent = 'Kopiert'; }, () => {});
    if (e.target.closest('[data-pdel]') && confirm('Anmeldedienst löschen? Alle damit verbundenen Logins werden getrennt.')) {
      await sendJSON('DELETE', 'api/auth/providers/' + encodeURIComponent(d.dataset.id)); d.close(); await loadUsers();
    }
  } catch (x) { $('udErr').textContent = x.message; if ($('udActions').querySelector('[type=submit]')) $('udActions').querySelector('[type=submit]').textContent = 'Speichern'; }
});

async function loadUsers() {
  const [users, groups, prov] = await Promise.all([fetch('api/users').then(r => r.ok ? r.json() : []), fetch('api/groups').then(r => r.ok ? r.json() : []),
    fetch('api/auth/providers').then(r => r.ok ? r.json() : {})]);
  D.users = users; D.groups = groups; D.providers = prov.providers || []; D.redirectUri = prov.redirectUri;
  const el = document.querySelector('#users .usersbody');
  if (el) el.innerHTML = usersSection();
}

load();
setInterval(() => { if (!document.querySelector('dialog[open]')) load(); }, 10000);
</script>
</body>
</html>

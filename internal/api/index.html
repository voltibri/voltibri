<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>voltibri</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="voltibri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="common.css">
<style>
  /* hero: big numbers above the energy flow */
  .hero { display:grid; grid-template-columns:minmax(0, 1fr) 210px; gap:12px 28px; align-items:center; }
  .hero .err { grid-column:1 / -1; }
  .stats { display:flex; flex-direction:column; gap:0; }
  .stats .stat { padding:14px 0; border-top:1px solid var(--line); }
  .stats .stat:first-child { border-top:0; }
  .stat { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .stat .big { font-size:34px; font-weight:300; line-height:1.1; letter-spacing:-.035em; white-space:nowrap; }
  .stat .big small { font-size:16px; font-weight:400; color:var(--muted); margin-left:3px; letter-spacing:0; }
  .stat .sub { font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  @media (max-width:760px) {
    .hero { grid-template-columns:1fr; gap:6px; }
    .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; border-top:1px solid var(--line); padding-top:12px; }
    .stats .stat { padding:0; border:0; }
    .stat .big { font-size:22px; } .stat .big small { font-size:11px; }
    .stat .eyebrow { font-size:9.5px; letter-spacing:.04em; } .stat .sub { font-size:10.5px; line-height:1.3; }
  }
  /* details below the energy flow (click on grid, battery, PV, house, heat pump) */
  .selnode.on > circle:first-of-type { stroke-width:4; filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .fdetail { grid-column:1 / -1; border-top:1px solid var(--line); padding-top:14px; animation:din .22s ease-out; }
  @keyframes din { from { opacity:0; transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .fdetail { animation:none; } }
  .dhead { display:flex; align-items:center; gap:7px; color:var(--muted); margin-bottom:10px; }
  .dhead b { color:var(--fg); font-size:14px; }
  .dtiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .dtile { background:var(--card-2); border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .dtile.wide { grid-column:span 2; }
  .dtile .eyebrow { font-size:10.5px; }
  .dtile .dv { font-size:26px; font-weight:300; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dtile .dv small { font-size:12px; font-weight:500; color:var(--muted); margin-left:3px; letter-spacing:0; }
  .dtile .ds { font-size:12px; color:var(--muted); }
  /* heat pump: COP and heat output in one bar – the heat split into power and
     environment, a notch per kWh of power: the COP is how often the power fits */
  .dhead2 { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .dhead2 > span { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dhead2 > span small { font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted); }
  .dhead2 > span b { font-size:20px; font-weight:400; }
  .dcop { position:relative; display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--track); margin:6px 0 4px; }
  .dcop i { display:block; height:100%; transition:width .6s ease; }
  .dcop u { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--card-2); }
  .dlegend { display:flex; flex-wrap:wrap; column-gap:12px; row-gap:2px; font-size:12px; color:var(--muted); }
  .dlegend span { white-space:nowrap; }
  .dlegend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  /* cost: today, yesterday, average – label and amount, a bar below */
  .dcost { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .dcrow { display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:baseline; column-gap:8px; row-gap:3px; font-size:12px; color:var(--muted); }
  .dcrow .dcbar { grid-column:1 / -1; }
  .dcrow b { font-size:13px; font-weight:600; color:var(--fg); font-variant-numeric:tabular-nums; }
  .dcbar { height:7px; border-radius:4px; background:var(--track); overflow:hidden; }
  .dcbar i { display:block; height:100%; border-radius:4px; background:var(--grid); opacity:.55; }
  .dcbar i.now { background:var(--accent); opacity:1; }
  .dbar { display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--track); margin-top:4px; }
  .dbar i { display:block; height:100%; }
  .dtemp { position:relative; height:7px; border-radius:4px; margin-top:4px; background:linear-gradient(90deg, rgba(74,144,217,.25), rgba(232,163,23,.25), rgba(217,83,79,.25)); }
  .dtemp i { position:absolute; top:0; bottom:0; border-radius:4px; background:linear-gradient(90deg, #4a90d9, #e8743b); }
  .drow { display:flex; align-items:baseline; gap:8px; font-size:13px; padding:3px 0; border-top:1px solid var(--line); }
  .drow:first-of-type { border-top:0; }
  .drow span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drow b { font-weight:600; font-variant-numeric:tabular-nums; }
  .drow b.off { color:var(--muted); font-weight:500; }
  .drow .dsteps { display:inline-flex; gap:3px; flex:none; align-self:center; }
  .drow .dsteps i { width:7px; height:12px; border-radius:2px; background:var(--track); }
  .drow .dsteps i.on { background:var(--solar); }
  .drow .duse { display:block; font-style:normal; font-size:11px; color:var(--muted); width:auto; text-align:left; }
  .drow em { font-style:normal; color:var(--muted); font-size:12px; width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  @media (max-width:760px) { .dtiles { grid-template-columns:1fr 1fr; } .dtile .dv { font-size:22px; } }
  /* battery: charge targets on the SoC bar, boost, force charging and settings below the tiles */
  .dsoc { position:relative; overflow:visible; }
  .dsoc i { border-radius:4px; }
  .dsoc .dmark { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--fg); opacity:.55; border-radius:1px; }
  .bctl { margin-top:12px; }
  .bctl .bnote { margin:0; font-size:13px; color:var(--muted); }
  .bbox { display:flex; flex-direction:column; gap:10px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .bbox.on { flex-direction:row; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .bbox.on div { display:flex; flex-direction:column; gap:2px; }
  .bbox.on span { font-size:12px; color:var(--muted); }
  .bbox .btn, .bact .btn { align-self:flex-start; display:inline-flex; align-items:center; gap:6px; }
  .bctl .pform .err { margin:0; }
  .bctl .pform { gap:16px; }
  .bgrp { display:flex; flex-direction:column; gap:8px; }
  .bgrp > header { display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; }
  .bgrp h3 { margin:0; font-size:14px; }
  .bgrp header small { color:var(--muted); font-size:12px; flex:1 1 220px; min-width:0; }
  .bgrp header .btn { display:inline-flex; align-items:center; gap:6px; }
  .bgrp header select { width:auto; }
  .bgrp header .navlink { font-size:12px; }
  .topbtn { font:inherit; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted); cursor:pointer; }
  .topbtn[aria-pressed=true] { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .bgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
  .bt { display:flex; flex-direction:column; gap:4px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; min-width:0; }
  .bt > span { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bt select { width:100%; min-width:0; }
  .bt b { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .bt.ro { background:color-mix(in srgb, var(--track) 45%, transparent); border-style:dashed; }
  .bt .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; }
  .seg button { font:inherit; font-size:12px; padding:3px 10px; border:0; border-radius:999px; background:none; color:var(--muted); cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .rmode { display:inline-flex; gap:2px; margin-left:auto; }
  .rmode button { font:inherit; font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted); cursor:pointer; }
  .rmode button[aria-pressed=true] { color:var(--fg); border-color:var(--muted); background:var(--track); }
  .rmode button.b[aria-pressed=true] { color:var(--battery); border-color:var(--battery); background:color-mix(in srgb, var(--battery) 12%, transparent); }
  .drow .rmeta { display:flex; align-items:center; gap:8px; flex:0 0 100%; width:100%; font-size:11px; color:var(--muted); white-space:normal; overflow:visible; }
  .drow.rod { flex-wrap:wrap; }
  #flow { width:100%; height:auto; display:block; margin:0 auto; overflow:visible; }
  #flow text { font-variant-numeric:tabular-nums; }
  .track { fill:none; stroke:var(--track); stroke-width:2; }
  .tog { cursor:pointer; outline:none; }
  .tog:hover > circle:first-of-type, .tog:focus-visible > circle:first-of-type { stroke-width:3.5; }
  .pop { transform-box:fill-box; transform-origin:center; animation:pop .28s ease-out; }
  @keyframes pop { from { opacity:0; transform:scale(.6); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation:none; } }
  .flowline { fill:none; stroke-linecap:round; stroke-dasharray:1 12; animation:dash linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-26; } }
  @media (prefers-reduced-motion: reduce) { .flowline { animation:none; stroke-dasharray:none; opacity:.8; } }
  .err { color:var(--warn); font-size:13px; margin-top:8px; }
  .err:empty { display:none; }

  /* card head: eyebrow + title left, details right */
  .cardhead { display:flex; align-items:flex-end; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px; }
  .cardhead h2 { margin:2px 0 0; }
  .cardhead .right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  /* users without the overview only see their wallboxes */
  body.no-flow [data-perm=flow], body.no-forecast [data-perm=forecast], body.no-heat [data-perm=heat] { display:none !important; }
  @media (min-width: 900px) { #bhead { flex-wrap:nowrap; } #bhead .right { flex-wrap:nowrap; white-space:nowrap; } }
  .legend i.dash { background:repeating-linear-gradient(90deg, var(--muted) 0 5px, transparent 5px 9px); opacity:.8; }
  .legend i.bar { width:8px; height:10px; border-radius:1px; background:color-mix(in srgb, var(--home) 50%, transparent); }
  .legend i.bar.exp { background:color-mix(in srgb, var(--home) 22%, transparent); }
  .chip { font-size:12px; padding:3px 10px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .chip b { color:var(--fg); font-weight:600; }

  /* wallboxes */
  #laden[hidden] { display:none; }
  .lps { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
  .lp { position:relative; overflow:hidden; isolation:isolate; background:var(--card-2); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  /* tiles side by side: the same parts on the same height (rows shared via subgrid) */
  @supports (grid-template-rows: subgrid) {
    .lps { row-gap:0; }
    .lp { display:grid; grid-template-rows:subgrid; grid-row:span 4; gap:0; margin-bottom:12px; align-content:start; }
    .lp > :not(:empty) ~ :not(:empty) { margin-top:12px; }
  }
  .lphead .lpname { display:flex; flex-direction:column; min-width:0; }
  .lptop { margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; align-self:flex-start; }
  .lpmore { display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12px; font-weight:600; color:var(--accent); background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px 10px 3px 8px; cursor:pointer; }
  .lpmore:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  @media (max-width:420px) { .lpmore span { display:none; } .lpmore { padding:5px 7px; } }
  .lphead .lpname small { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lphead .lpname b { font-size:18px; font-weight:650; letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lphead .lpname b.none { color:var(--muted); font-weight:500; }
  .lphead { display:flex; align-items:center; gap:8px; min-width:0; }
  .lphead h3 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .lphead .pill { flex:none; }
  .lphead .pw { margin-left:auto; flex:none; white-space:nowrap; font-size:22px; font-weight:300; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .pill { font-size:11px; font-weight:550; padding:2px 9px; border-radius:99px; background:var(--track); color:var(--muted); }
  .pill.on { background:var(--accent-soft); color:var(--accent); }
  .lpsub { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .vrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input[type=time], input[type=datetime-local], input[type=number] {
    font:inherit; font-size:13px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:5px 8px; }
  select { max-width:100%; }
  .socbar { position:relative; height:8px; border-radius:4px; background:var(--track); overflow:hidden; }
  .socbar i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--accent), var(--battery)); border-radius:4px; }
  .socbar b { position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.5; }
  .socline { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:4px; }
  /* the mode: a button on the wallbox, its menu opens below */
  .wbmode { position:absolute; left:18px; top:132px; width:96px; height:34px; display:flex; align-items:center; justify-content:center; gap:.25em;
    font:inherit; font-size:12.5px; font-weight:650; white-space:nowrap; padding:0 .4em; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .wbmode svg { flex:none; opacity:.75; }
  .wbmode.m-sun { background:color-mix(in srgb, var(--solar) 16%, var(--card)); border-color:color-mix(in srgb, var(--solar) 50%, var(--line)); color:color-mix(in srgb, var(--solar) 65%, var(--fg)); }
  .wbmode.m-fast { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 50%, var(--line)); color:var(--accent); }
  .wbmode.m-boost { background:color-mix(in srgb, var(--battery) 16%, var(--card)); border-color:color-mix(in srgb, var(--battery) 50%, var(--line)); color:color-mix(in srgb, var(--battery) 70%, var(--fg)); }
  .wbmode.m-off, .wbmode.m-none { color:var(--muted); }
  .wbmode:hover:not(:disabled) { border-color:var(--muted); }
  .wbmode:disabled { cursor:default; }
  .modemenu { position:absolute; z-index:20; right:0; top:172px; width:300px; max-width:calc(100vw - 48px); display:flex; flex-direction:column; gap:2px; padding:6px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.18); }
  .modemenu button { display:grid; grid-template-columns:20px 1fr; column-gap:10px; align-items:start; text-align:left; font:inherit; font-size:13px;
    border:0; background:transparent; color:var(--fg); padding:8px 10px; border-radius:10px; cursor:pointer; }
  .modemenu button svg { grid-row:span 2; margin-top:1px; color:var(--muted); }
  .modemenu button b { font-weight:600; }
  .modemenu button span { font-size:12px; color:var(--muted); }
  .modemenu button:hover:not(:disabled) { background:var(--track); }
  .modemenu button[aria-checked=true] { background:var(--accent-soft); }
  .modemenu button[aria-checked=true] b, .modemenu button[aria-checked=true] svg { color:var(--accent); }
  .modemenu button:disabled { opacity:.5; cursor:default; }
  .lp:has(.modemenu) { overflow:visible; z-index:5; }
  .lp details.more > div { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  /* charge plan dialog */
  dialog.plans-dlg { border:0; padding:0; border-radius:24px; background:var(--card); color:var(--fg); width:min(560px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); box-shadow:0 24px 60px rgba(0,0,0,.28); }
  dialog.plans-dlg::backdrop { background:rgba(10,15,12,.5); backdrop-filter:blur(3px); }
  .pd { display:flex; flex-direction:column; max-height:calc(100dvh - 24px); }
  .pd-head { padding:20px 22px 16px; background:linear-gradient(135deg, var(--accent-soft), transparent 70%); border-bottom:1px solid var(--line); }
  .pd-head .top { display:flex; align-items:flex-start; gap:12px; }
  .pd-head .ic { width:42px; height:42px; border-radius:13px; background:var(--accent); color:#fff; display:grid; place-items:center; flex:none; }
  .pd-head h2 { margin:0; font-size:19px; letter-spacing:-.015em; }
  .pd-head .sub { font-size:13px; color:var(--muted); margin-top:2px; }
  .pd-head .x { margin-left:auto; border:0; background:transparent; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; padding:4px 6px; border-radius:8px; }
  .pd-head .x:hover { background:var(--track); color:var(--fg); }
  .pd-batt { margin-top:14px; }
  .pd-batt .bar { position:relative; height:12px; border-radius:6px; background:var(--track); overflow:hidden; }
  .pd-batt .bar i { position:absolute; inset:0 auto 0 0; border-radius:6px; background:linear-gradient(90deg, var(--accent), var(--battery)); }
  .pd-batt .bar em { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent-2) 55%, transparent) 0 4px, transparent 4px 8px); }
  .pd-batt .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums; }
  .pd-body { padding:18px 22px; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .pd-body .hint { font-size:12px; color:var(--muted); line-height:1.45; }
  .pcard { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:4px 14px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:var(--card-2); }
  .pcard.off { opacity:.55; }
  .pcard .t { font-size:26px; font-weight:300; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1; }
  .pcard .t small { display:block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
  .pcard .mid { min-width:0; }
  .pcard .soc { font-size:15px; font-weight:650; }
  .pcard .dchips { display:flex; gap:3px; margin-top:5px; flex-wrap:wrap; }
  .pcard .dchips span { font-size:10px; font-weight:650; width:22px; height:20px; border-radius:6px; display:grid; place-items:center; background:var(--track); color:var(--muted); }
  .pcard .dchips span.on { background:var(--accent-soft); color:var(--accent); }
  .pcard .next { font-size:12px; color:var(--muted); margin-top:5px; }
  .pcard .acts { display:flex; align-items:center; gap:4px; }
  .iconbtn { border:0; background:transparent; color:var(--muted); padding:6px; border-radius:9px; cursor:pointer; display:grid; place-items:center; }
  .iconbtn:hover { background:var(--track); color:var(--fg); }
  .switch { position:relative; width:38px; height:22px; flex:none; }
  .switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .switch i { position:absolute; inset:0; border-radius:11px; background:var(--line); transition:background .2s; pointer-events:none; }
  .switch i::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
  .switch input:checked + i { background:var(--accent); }
  .switch input:checked + i::after { transform:translateX(16px); }

  .pempty { text-align:center; padding:18px 10px; color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:16px; }

  .heatgrid .big { font-size:30px; font-weight:300; letter-spacing:-.035em; line-height:1.1; }

  /* battery plan */

</style>

<body>
<main>
  <header class="top"></header>

  <section class="card hero" aria-label="Jetzt" data-perm="flow">
    <svg id="flow" role="img" aria-label="Energiefluss zwischen Erzeugern, Netz, Batterie und Verbrauchern"></svg>
    <!-- the day so far (the flow shows the current values): right of the flow on desktop, below on phones -->
    <div class="stats">
      <div class="stat"><span class="eyebrow"><i class="dot" style="background:var(--accent)"></i>Autarkie heute</span><span class="big num" id="tAut">–</span><span class="sub" id="tAutSub"></span></div>
      <div class="stat"><span class="eyebrow"><i class="dot" style="background:var(--solar)"></i>Erzeugt heute</span><span class="big num" id="tPV">–</span><span class="sub" id="tPVSub"></span></div>
      <div class="stat" data-perm="forecast"><span class="eyebrow"><i class="dot" style="background:var(--solar);opacity:.45"></i>Prognose Rest</span><span class="big num" id="tRest">–</span><span class="sub">bis Mitternacht</span></div>
    </div>
    <div class="fdetail" id="flowDetail" hidden aria-live="polite"></div>

  </section>

  <section class="bare" id="laden" hidden>
    <div class="cardhead"><div><div class="eyebrow">Laden</div><h2>Wallboxen</h2></div>
      <div class="right"><span class="sub" id="ltariff"></span><button type="button" class="hbtn" id="vehBtn" data-vehicles hidden></button><a class="navlink" href="berichte" id="allRuns">Alle Ladevorgänge →</a></div></div>
    <div class="flash" id="lflash" hidden></div>
    <div class="note" id="vehNote" hidden></div>

  <section class="card" id="heat" hidden data-perm="heat">
    <div class="cardhead"><div><div class="eyebrow">Heizung</div><h2>Wärmepumpe</h2></div><div class="right"><span class="chip" id="hState"></span></div></div>
    <div id="heatBody"></div>
  </section>

  <section class="card" data-perm="forecast">
    <div class="cardhead" id="bhead"><div><div class="eyebrow">Batterie</div><h2 id="bTitle">Ladeplanung</h2></div>
      <div class="right"><span class="chip" id="discharge" hidden></span><span class="chip" id="limit">–</span><span class="chip" id="target">–</span>
        <div class="seg" role="group" aria-label="Zeitraum" id="range">
      <button type="button" data-range="yesterday" aria-pressed="false">Gestern</button><button type="button" data-range="today" aria-pressed="true">Heute</button><button type="button" data-range="tomorrow" aria-pressed="false">Morgen</button><button type="button" data-range="48h" aria-pressed="false">48 h</button>
        </div></div></div>
    <svg class="chart" id="chart" viewBox="0 0 960 300" role="img" aria-label="Soll und Ist: PV, Hausverbrauch und Ladestand"></svg>

      <span><i style="background:var(--solar)"></i>PV</span>
      <span><i class="bar"></i>Verbrauch gemessen</span>

      <span><i style="background:var(--battery)"></i>Ladestand</span>
      <span><i style="background:var(--limit);height:10px"></i>Laden erlaubt</span>
      <span><i class="dash"></i>Plan vom Tagesbeginn</span>

    </div>

</main>
<dialog class="plans-dlg" id="plansDlg" aria-labelledby="pdTitle"><div class="pd" id="pdInner"></div></dialog>
<dialog class="plans-dlg" id="vehDlg" aria-labelledby="vdTitle"><div class="pd" id="vehInner"></div></dialog>
<dialog class="plans-dlg" id="lpDlg" aria-labelledby="lpdTitle"><div class="pd" id="lpInner"></div></dialog>
<script src="common.js"></script>
<script>
const kw = w => (Math.abs(w) >= 1000 ? (w/1000).toFixed(1).replace('.', ',') + ' kW' : Math.round(w) + ' W');
const pct = v => Math.round(v*100) + ' %';
const modes = {delay:'spät laden', immediate:'sofort laden', night:'Nacht', 'no-data':'zu wenig Daten'};

// 24x24 line icons

const COLORS = {producer:'var(--solar)', grid:'var(--grid)', battery:'var(--battery)', consumer:'var(--consumer)', home:'var(--home)'};

function icon(name, x, y, color, size = 24) {
  const s = size / 24;
  return `<g transform="translate(${x - size/2} ${y - size/2}) scale(${s})" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.plug}</g>`;
}

// Overview groups: devices with the same "group" form one bubble; a click on
// a group opens its devices in an overlay.
const GROUPS = {pv: {name: 'PV', icon: 'solar'}, wallboxen: {name: 'Wallboxen', icon: 'car'},
                heizung: {name: 'Heizung', icon: 'heatpump'}, waermepumpe: {name: 'Wärmepumpe', icon: 'heatpump'}, warmwasser: {name: 'Warmwasser', icon: 'water'},
                haushalt: {name: 'Haushalt', icon: 'plug'}};

function membersOf(items, key) { return items.filter(x => (x.group || x.id) === key); }

function grouped(items, kind) {
  const order = [];
  for (const it of items) { const k = it.group || it.id; if (!order.includes(k)) order.push(k); }
  return order.map(k => {
    const m = membersOf(items, k);
    if (m.length === 1 && !GROUPS[k]) return m[0];               // stands alone
    const def = GROUPS[k] || {name: m[0].name, icon: m[0].icon};
    return {id: 'g:' + k, name: def.name, icon: def.icon, count: m.length, toggle: k, kind,
            powerW: m.reduce((s, x) => s + x.powerW, 0),
            mode: m.every(x => x.mode === 'delegated') ? 'delegated' : '',
            circuit: m.every(x => x.circuit && x.circuit === m[0].circuit) ? m[0].circuit : ''};
  });
}

// Layout: the house in the middle, all other nodes on a circle around it –
// the sources (PV, grid, battery) on the upper half, the consumers on the
// lower half. Straight lines connect every node with the house. A click on
// a group expands its devices into the circle; only one group is open.
const NODE_R = 30, HOME_R = 36, GAP = 12, MIN_LINE = 40, SCALE = 1.35;
const MODES = {owned: 'von voltibri gesteuert', delegated: 'extern gesteuert', observed: 'nur beobachtet'};
let open = null;      // {key, kind} of the expanded group
let popOpen = false;  // animate the members on the next draw

function expanded(items, kind) {
  return grouped(items, kind).flatMap(it =>
    it.count > 1 && open && open.key === it.toggle && open.kind === kind
      ? membersOf(items, it.toggle).map(m => ({...m, toggle: it.toggle, kind, member: true}))
      : [it]);
}

// the heat pump node (details known) and the heating devices next to it
// heating: the heat pump and the heating rods heat the same buffer (group
// "heizung"); a click opens the heating details instead of expanding it
const isHeat = (c, st) => c.toggle === 'heizung' || (c.icon === 'heatpump' && (st.heat || []).length && !(c.count > 1));
const heatMembers = st => (st.consumers || []).filter(x => x.group === 'heizung');
// heating rods by kind (the icon is free to choose)
const isRod = x => x.kind ? x.kind === 'heating-rod' : x.icon === 'water';
const rodOn = st => heatMembers(st).some(x => isRod(x) && x.powerW > 15);

function layout(st) {
  const P = expanded(st.producers, 'producers');
  // consumers in their own order, centred on the bottom
  const C = expanded(st.consumers, 'consumers').concat([{id:'_rest', name:'Übriges Haus', icon:'house', powerW: st.restW, rest:true}]);
  const S = [...P.map(p => p.id), '_grid', ...(st.hasBattery ? ['_battery'] : [])];
  const N = S.length + C.length;
  const step = 2 * Math.PI / Math.max(N, 4);
  const R = Math.max(HOME_R + NODE_R + MIN_LINE, (2 * NODE_R + GAP) / (2 * Math.sin(step / 2)));
  const pad = NODE_R + 14, W = 2 * (R + pad), H = W;
  const nodes = {_home: {x: W / 2, y: H / 2}}, links = [];
  // sources centred on the top, consumers centred on the bottom
  const arc = (ids, centre, dir) => ids.forEach((id, i) => {
    const a = centre + dir * (i - (ids.length - 1) / 2) * step;
    nodes[id] = {x: W / 2 + R * Math.cos(a), y: H / 2 + R * Math.sin(a), a};
  });
  arc(S, -Math.PI / 2, 1);
  arc(C.map(c => c.id), Math.PI / 2, -1);
  P.forEach(p => links.push({a: p.id, b: '_home', w: p.powerW, color: COLORS.producer}));
  C.forEach(c => links.push({a: '_home', b: c.id, w: c.powerW, color: COLORS.consumer}));
  links.push(st.gridW >= 0 ? {a:'_grid', b:'_home', w: st.gridW, color: COLORS.grid}
                           : {a:'_home', b:'_grid', w: -st.gridW, color: 'var(--export)'});
  if (st.hasBattery)
    links.push(st.batteryW >= 0 ? {a:'_battery', b:'_home', w: st.batteryW, color: COLORS.battery}
                                : {a:'_home', b:'_battery', w: -st.batteryW, color: COLORS.battery});
  return {W, H, R, nodes, links, P, C};
}

// straight line between the rims of two circles
function line(a, ra, b, rb) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  return `M${(a.x + ux * ra).toFixed(1)},${(a.y + uy * ra).toFixed(1)} L${(b.x - ux * rb).toFixed(1)},${(b.y - uy * rb).toFixed(1)}`;
}

// A node shows icon and value inside the circle; the name is only a tooltip.
// count > 1 adds a small bubble with the number of devices.
function node(n, {r, ic, color, value, title, ring, ringColor, extra, count}) {
  let g = `<title>${esc(title)}</title><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="var(--node)" stroke="${color}" stroke-width="2"/>`;
  if (ring !== undefined) { // SoC ring
    const c = 2*Math.PI*(r+4);
    g += `<circle cx="${n.x}" cy="${n.y}" r="${r+4}" fill="none" stroke="var(--track)" stroke-width="3.5"/>` +
         `<circle cx="${n.x}" cy="${n.y}" r="${r+4}" fill="none" stroke="${ringColor || color}" stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="${(c*ring).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${n.x} ${n.y})"/>`;
  }
  // with a second line (COP, state of charge) the content moves up so that
  // it stays inside the circle
  const iy = n.y - (extra ? 13 : 7);
  g += icon(ic, n.x, iy, color, extra ? 16 : 20);
  g += `<text x="${n.x}" y="${extra ? n.y + 5 : iy + 24}" text-anchor="middle" font-size="${r > NODE_R ? 14 : 12.5}" font-weight="600" fill="var(--fg)">${value}</text>`;
  if (extra) g += `<text x="${n.x}" y="${n.y + 17}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${extra}</text>`;
  if (count > 1) { // always top right on the rim
    const bx = n.x + r * 0.71, by = n.y - r * 0.71;
    g += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="10" fill="${color}" stroke="var(--card)" stroke-width="2.5"/>` +
         `<text x="${bx.toFixed(1)}" y="${(by + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">${count}</text>`;
  }
  return g;
}

// load of the sub-distribution (or house connection) a node stands for
function circuitLoad(id, st) {
  const c = (st.circuits || []).find(x => x.id === id);
  if (!c || !(c.maxA > 0)) return null;
  const a = Math.max(...c.currentsA);
  return {c, a, u: a / c.maxA, ring: Math.min(1, a / c.maxA), color: a > c.maxA ? 'var(--warn)' : a > 0.9 * c.maxA ? 'var(--solar)' : 'var(--battery)',
    extra: `${Math.round(a)}/${Math.round(c.maxA)} A`,
    text: `${c.name}: ${c.currentsA.map(x => x.toFixed(1).replace('.', ',')).join(' / ')} A von ${Math.round(c.maxA)} A${c.estimated ? ' (teils geschätzt)' : ''}`};
}

function tip(it, st) {
  if (it.rest) return `${it.name} · ohne eigene Messung · ${kw(it.powerW)}`;
  if (it.count > 1) return `${it.name} · ${it.count} Geräte · ${kw(it.powerW)} · klicken zum Aufklappen`;
  const mode = MODES[it.mode] ? MODES[it.mode] + (it.mode === 'owned' && st.dryRun ? ' (Testmodus)' : '') : '';
  return [it.name, mode, kw(it.powerW), it.member ? 'klicken zum Zuklappen' : ''].filter(Boolean).join(' · ');
}

function drawFlow(st) {
  const svg = $('flow');
  const {W, H, R, nodes, links, P, C} = layout(st);
  svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
  svg.style.maxWidth = (W * SCALE).toFixed(0) + 'px'; // same node size for any number of nodes
  const maxW = Math.max(1500, ...links.map(l => l.w));
  const home = nodes._home;
  const rOf = id => id === '_home' ? HOME_R + 4 : (id === '_battery' ? NODE_R + 8 : NODE_R + 4);
  let g = '';
  // the members of an open group are joined by an arc on the circle
  const mem = [...P, ...C].filter(x => x.member).map(x => nodes[x.id].a);
  if (mem.length > 1) {
    const a0 = Math.min(...mem), a1 = Math.max(...mem);
    const pt = a => `${(home.x + R * Math.cos(a)).toFixed(1)},${(home.y + R * Math.sin(a)).toFixed(1)}`;
    const color = open.kind === 'producers' ? COLORS.producer : COLORS.consumer;
    g += `<path class="${popOpen ? 'pop' : ''}" d="M${pt(a0)} A${R.toFixed(1)},${R.toFixed(1)} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${pt(a1)}"
            fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" opacity=".25"/>`;
  }
  for (const l of links) {
    const d = line(nodes[l.a], rOf(l.a), nodes[l.b], rOf(l.b));
    g += `<path class="track" d="${d}"/>`;
    if (l.w > 15) {
      const sw = 2.5 + 5 * Math.min(1, l.w / maxW);
      const dur = Math.max(0.6, 3.2 - 2.6 * Math.min(1, l.w / maxW));
      g += `<path class="flowline" d="${d}" stroke="${l.color}" stroke-width="${sw.toFixed(1)}" style="animation-duration:${dur.toFixed(2)}s"/>`;
    }
  }
  const wrap = (it, inner) => it.count > 1 || it.member
    ? `<g class="tog${it.member && popOpen ? ' pop' : ''}" data-toggle="${esc(it.toggle)}" data-kind="${it.kind}" role="button" tabindex="0"
         aria-expanded="${!!it.member}" aria-label="${esc(it.name)} ${it.member ? 'zuklappen' : 'aufklappen'}">${inner}</g>`
    : `<g>${inner}</g>`;
  P.forEach(p => g += wrap(p, node(nodes[p.id], {r: NODE_R, ic: p.icon || 'solar', color: COLORS.producer,
    value: kw(p.powerW), title: tip(p, st), count: p.count})));
  C.forEach(c => {
    const cl = !c.member && c.circuit ? circuitLoad(c.circuit, st) : null;
    // heat pump: show the COP under the power (from a heat source, e.g. ESPHome)
    // heating: the COP while only the heat pump runs, "+ Heizstab" when a backup rod runs too
    const hp = c.icon === 'heatpump' && (st.heat || []).find(h => h.cop != null);
    const heatExtra = c.toggle === 'heizung' && rodOn(st) ? '+ Stab' : hp ? 'COP ' + hp.cop.toFixed(1).replace('.', ',') : undefined;
    const extra = cl ? cl.extra : heatExtra;
    const inner = node(nodes[c.id], {r: NODE_R, ic: c.icon || 'plug', color: c.rest ? 'var(--muted)' : COLORS.consumer,
      value: kw(c.powerW), title: tip(c, st) + (cl ? ' · ' + cl.text : '') + (hp ? ' · Klick für Details' : ''), count: c.count,
      ring: cl ? cl.ring : undefined, ringColor: cl ? cl.color : undefined, extra});
    // nodes with details (heat pump) open tiles below the flow
    g += isHeat(c, st) ? selWrap('hp', inner, 'Heizung') : wrap(c, inner);
  });
  const gridState = Math.abs(st.gridW) < 15 ? 'ausgeglichen' : (st.gridW > 0 ? 'Bezug' : 'Einspeisung');
  const gl = circuitLoad('grid', st);
  g += selWrap('grid', node(nodes._grid, {r: NODE_R, ic: 'grid', color: st.gridW >= 0 ? COLORS.grid : 'var(--export)',
    value: kw(Math.abs(st.gridW)), title: `Netz · ${gridState} · ${kw(Math.abs(st.gridW))}` + (gl ? ` · ${gl.text}` : ''),
    ring: gl ? gl.ring : undefined, ringColor: gl ? gl.color : undefined, extra: gl ? gl.extra : undefined}), 'Netz');
  if (st.hasBattery) {
    const batState = Math.abs(st.batteryW) < 15 ? 'Ruhe' : (st.batteryW < 0 ? 'lädt' : 'entlädt');
    g += selWrap('battery', node(nodes._battery, {r: NODE_R, ic: 'battery', color: COLORS.battery, value: kw(Math.abs(st.batteryW)),
      ring: st.soc, extra: pct(st.soc), title: `Batterie ${pct(st.soc)} · ${batState} · ${kw(Math.abs(st.batteryW))}`}), 'Hausbatterie');
  }
  g += selWrap('home', node(home, {r: HOME_R, ic: 'house', color: COLORS.home, value: kw(st.loadW), title: `Hausverbrauch · ${kw(st.loadW)}`}), 'Haus');
  svg.innerHTML = g;
  popOpen = false;
}

// click on a group expands it (and closes any other), click on one of its
// devices or on the background closes it again
function toggleGroup(e) {
  if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[data-toggle]');
  if (!t && !open) return;
  e.preventDefault();
  const same = t && open && open.key === t.dataset.toggle && open.kind === t.dataset.kind;
  open = t && !same ? {key: t.dataset.toggle, kind: t.dataset.kind} : null;
  // the PV group shows its details below; other groups close them
  sel = open && open.key === 'pv' ? 'pv' : (sel === 'pv' ? null : sel);
  if (window._last) renderDetails(window._last);
  popOpen = !!open;
  if (window._last) drawFlow(window._last);
  if (t && e.type === 'keydown') { // keep keyboard focus on the toggled group
    const f = $('flow').querySelector(`[data-toggle="${CSS.escape(t.dataset.toggle)}"]`);
    if (f) f.focus();
  }
}
$('flow').addEventListener('click', toggleGroup);
$('flow').addEventListener('keydown', toggleGroup);

async function send(method, url, body) {

  if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || e.message || ('Fehler ' + r.status)); return false; }

function planText(p) {

// the car and the wallbox charging it: the car (left, under the name) fills
// up with its state of charge, the cable gets thicker with every phase. The
// wallbox (right, from the top of the tile) shows the charging power (ring
// against what is possible now), a dot per phase and the mode button.
const CAR = 'M0 60v-20q2-8 12-10l20-3 14-16q4-4 12-4h22q8 0 12 8l8 14q4 4 4 12v19z'; // 100 × 53, front right
const CAR_T = 'translate(100 0) scale(-1 1)';
const CABLE_Y = 46; // cable height in the car (72 px high) = 26 px above the bottom of the wallbox
// phases of a wallbox: n installed, rel released by voltibri, act measured
// (the car draws on them), draw the ones the car takes as far as known (a
// 2-phase car at a 3-phase wallbox: 3 released, 2 drawn). Without measuring
// per phase act is 0: nothing is claimed beyond the released phases.
function wbPhases(lp) {
  const n = lp.phases || 3;
  const rel = Math.min(n, (lp.target && lp.target.enabled && lp.target.phases) || n);
  const act = lp.connected ? Math.min(rel, lp.activePhases || 0) : 0;
  const draw = act || Math.min(rel, lp.carPhases || rel);
  return {n, rel, act, draw};
}
function wallboxViz(lp, veh, left, control) {
  const ph = wbPhases(lp);
  const maxA = lp.limitA != null ? Math.min(lp.limitA, lp.maxCurrent) : lp.maxCurrent;
  const maxW = Math.max(1, maxA * ph.draw * 230); // possible now: over the phases the car takes
  const st = lp.off && !lp.charging ? 'off' : !lp.connected ? 'free' : lp.foreign ? 'busy' : lp.charging ? 'charging' : 'connected';
  const col = {charging: 'var(--accent)', connected: 'var(--accent-2)', busy: 'var(--accent-2)', free: 'var(--muted)', off: 'var(--muted)'}[st];
  const label = {charging: 'lädt', connected: 'angesteckt', busy: 'belegt', free: 'frei', off: 'ausgeschaltet'}[st];
  const R = 38, C = 2 * Math.PI * R, arc = C * 0.75;
  const frac = lp.connected ? Math.max(0, Math.min(1, lp.powerW / maxW)) : 0;
  const num = (v, d) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
  const icon = name => `<g transform="translate(52 52)" fill="none" stroke="var(--muted)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</g>`;
  const centre = lp.connected
    ? `<text x="64" y="70" text-anchor="middle" class="wv-p">${num(lp.powerW / 1000, 1)}<tspan class="wv-u" dx="1">kW</tspan></text>`
    : icon(st === 'off' ? 'power' : 'plug');
  // a dot per phase of the wallbox: a ring while released, filled while the
  // car draws on it (measured); unmeasured, the released ones stay rings
  const {n, rel, act} = ph, on = lp.connected && st !== 'off';
  const phN = k => k + (k === 1 ? ' Phase' : ' Phasen');
  const phTitle = !on ? phN(n)
    : act === rel ? `lädt auf ${act === 1 ? '1 Phase' : 'allen ' + phN(act)}`
    : act ? `${phN(rel)} freigegeben, das Auto lädt auf ${act}`
    : `${phN(rel)} freigegeben${lp.carPhases && lp.carPhases < rel ? `, das Auto lädt auf ${lp.carPhases}` : ''}`;
  const dots = `<g><title>${esc(phTitle)}</title>${Array.from({length: n}, (_, i) => {
    const x = 64 + (i - (n - 1) / 2) * 12;
    if (on && i < act) return `<circle cx="${x}" cy="90" r="3.5" class="wv-dot" style="fill:${col}"/>`;
    if (on && i < rel) return `<circle cx="${x}" cy="90" r="3" class="wv-dot rel" stroke="${col}"/>`;
    return `<circle cx="${x}" cy="90" r="3.5" class="wv-dot"/>`;
  }).join('')}</g>`;
  // the current: per phase it draws on, "2 × 11 A" when it takes fewer than released
  const amps = act && lp.phaseCurrentA ? ' · ' + (act < rel ? act + ' × ' : '') + num(lp.phaseCurrentA, 0) + ' A' : '';
  const sub = lp.connected ? `von ${num(maxW / 1000, maxW % 1000 ? 1 : 0)} kW${amps}` : '';
  const cw = [4, 3, 4.5, 6][act || (st === 'charging' ? ph.draw : 0)], flow = st === 'charging' ? ' class="wv-flow"' : '';
  const plug = lp.connected
    ? `<line x1="-2" x2="10" y1="174" y2="174" stroke="${col}" stroke-width="${cw}"${flow}/>`
    : `<path d="M10 174c-12 0-10 12-10 20" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" opacity=".5"/>
       <rect x="-6" y="192" width="12" height="9" rx="3" fill="var(--muted)" opacity=".5"/>`;
  const box = `<svg class="wbviz st-${st}" viewBox="0 0 124 200" role="img" aria-label="Wallbox ${esc(label)}${lp.connected ? ', ' + kw(lp.powerW) + ' von ' + kw(maxW) + (act ? ', ' + act + '-phasig' + (act < rel ? ' (' + rel + ' freigegeben)' : '') : '') : ''}">
    <rect x="8" y="1" width="115" height="198" rx="26" class="wv-body"/>
    ${st === 'off' ? '' : `<circle cx="64" cy="64" r="${R}" class="wv-trk" stroke-dasharray="${arc.toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 64 64)"/>
    <circle cx="64" cy="64" r="${R}" class="wv-val" stroke="${col}" stroke-dasharray="${(arc * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 64 64)"/>${dots}`}
    ${centre}${sub ? `<text x="64" y="118" text-anchor="middle" class="wv-m">${sub}</text>` : ''}${plug}</svg>`;
  let car;
  if (lp.connected) {
    const cid = 'wvc-' + String(lp.id).replace(/[^\w-]/g, '_');
    const soc = veh && veh.soc != null && !lp.foreign ? veh.soc : null;
    const mark = (x, c, t) => `<line x1="${(100 * x).toFixed(1)}" x2="${(100 * x).toFixed(1)}" y1="0" y2="62" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"><title>${t}</title></line>`;
    car = `<defs><clipPath id="${cid}"><path d="${CAR}" transform="${CAR_T}"/></clipPath></defs>
      <line x1="96" x2="100%" y1="${CABLE_Y}" y2="${CABLE_Y}" stroke="${col}" stroke-width="${cw}"${flow}/>
      <path d="${CAR}" transform="${CAR_T}" class="wv-car"/>
      ${soc != null ? `<g clip-path="url(#${cid})"><rect x="0" y="0" width="${(100 * soc).toFixed(1)}" height="64" fill="${col}" opacity=".28"/>
        ${veh.limitSoc != null ? mark(veh.limitSoc, 'var(--fg)', 'Ladelimit im Auto ' + pct(veh.limitSoc)) : ''}
        ${lp.finish && lp.finish.basis === 'plan' ? mark(lp.finish.targetSoc, 'var(--accent-2)', 'Ziel laut Ladeplan ' + pct(lp.finish.targetSoc)) : ''}</g>` : ''}
      <circle cx="24" cy="62" r="9" class="wv-wheel"/><circle cx="78" cy="62" r="9" class="wv-wheel"/>
      ${soc != null ? `<text x="50" y="48" text-anchor="middle" class="wv-soc">${pct(soc)}</text>` : lp.foreign ? '<text x="50" y="47" text-anchor="middle" class="wv-t">belegt</text>' : ''}
      ${soc != null && veh.rangeKm != null ? `<text x="108" y="${CABLE_Y - 8}" class="wv-t">${Math.round(veh.rangeKm)} km</text>` : ''}`;
  } else {
    car = `<path d="${CAR}" transform="${CAR_T}" class="wv-ghost"/><circle cx="24" cy="62" r="9" class="wv-ghost wv-wheel"/><circle cx="78" cy="62" r="9" class="wv-ghost wv-wheel"/>
      ${st === 'free' ? '<text x="50" y="47" text-anchor="middle" class="wv-t">Auto anstecken</text>' : ''}`;
  }
  return `<div class="wbscene st-${st}"><div class="wbleft">${left}<svg class="wbcar" height="72" aria-hidden="true">${car}</svg></div>
    <div class="wbbox">${box}${control}</div></div>`;
}

// the mode: a button on the wallbox, its menu lists every mode
function modeControl(lp, canEdit) {
  // without a car only "Aus" (the wallbox switched off) is a state to show
  const mode = lp.connected ? lp.mode : (lp.off ? 'off' : '');
  const cls = !mode ? 'none' : ['pv', 'minpv', 'pv1'].includes(mode) ? 'sun' : mode;
  const open = modeOpen === lp.id;
  const btn = `<button type="button" class="wbmode m-${cls}" data-modemenu aria-haspopup="menu" aria-expanded="${open}" title="${esc(mode ? 'Lademodus: ' + MODE_LABEL[mode] + ' – ' + MODE_HELP[mode] : 'Lademodus – gilt ab dem Anstecken')}"${canEdit ? '' : ' disabled'}>
    ${mode ? MODE_SHORT[mode] : 'Bereit'}${canEdit ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</button>`;
  if (!open) return btn;
  // "Aus" works anytime; the others need a car – or switch the wallbox on again
  const items = CHARGE_MODES.map(m => {
    const na = m === 'pv1' && !lp.canSwitch && lp.phases !== 1;
    const dis = m !== 'off' && (na || (!lp.connected && !lp.off));
    const help = na ? 'Nicht verfügbar: die Wallbox kann nicht auf eine Phase umschalten (oder wird nicht gesteuert).' : MODE_HELP[m];
    return `<button type="button" role="menuitemradio" aria-checked="${m === mode}" data-mode="${m}"${dis ? ' disabled' : ''}>${iconSVG(MODE_ICON[m], 18)}<b>${MODE_LABEL[m]}</b><span>${esc(help)}</span></button>`;
  }).join('');
  return btn + `<div class="modemenu" role="menu" aria-label="Lademodus">${items}</div>`;
}

// end of charging (at the current power) or the start of the charge plan
function etaView(lp, veh) {
  if (!lp.connected || lp.foreign) return '';
  const f = lp.finish, sch = lp.plan, clock = iconSVG('clock', 18);
  const target = f ? (f.basis === 'plan' ? `bis ${pct(f.targetSoc)} laut Plan` : f.basis === 'limit' ? `bis ${pct(f.targetSoc)} (Limit im Auto)` : 'bis 100 %') : '';
  if (f && f.reached) return `<div class="eta">${iconSVG('target', 18)}<div><b>Ziel erreicht</b><span>${pct(f.targetSoc)} geladen</span></div></div>`;
  if (lp.charging && f && f.at) {
    const mins = Math.max(0, Math.round((new Date(f.at) - Date.now()) / 60000));
    const left = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`;
    return `<div class="eta">${clock}<div><b>fertig ca. ${etaTime(f.at)}</b><span>noch ${left} · ${kwh(f.needWh)} ${target}</span></div></div>`;
  }
  if (sch && sch.start && !lp.charging && new Date(sch.start) > Date.now()) {
    return `<div class="eta">${iconSVG('calendar', 18)}<div><b>Start ${etaTime(sch.start)}</b><span>laut Plan: ${pct(sch.soc)} bis ${etaTime(sch.target)}${sch.needWh ? ' · ' + kwh(sch.needWh) : ''}</span></div></div>`;
  }
  if (lp.charging && !f) return `<div class="eta muted">${clock}<div><b>Ladeende unbekannt</b><span>${veh ? 'Ladestand oder Akkugröße fehlt' : 'Gastfahrzeug – Ladestand unbekannt'}</span></div></div>`;
  if (f && !lp.charging) return `<div class="eta muted">${clock}<div><b>wartet</b><span>noch ${kwh(f.needWh)} ${target}</span></div></div>`;
  return '';
}
// today: "14:35"; later: "Mi 07:00"
function etaTime(t) {
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString('de-DE', {weekday: 'short'}) + ' ' + hm;
}

async function refreshCharging(force) {

    charging.feedinCt != null ? 'Einspeisung ' + charging.feedinCt.toFixed(1).replace('.', ',') + ' ct' : ''].filter(Boolean).join(' · ');

// --- charge plans (dialog) ---
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Mo..So
const dayList = days => { const d = [...days].sort((a, b) => WD_ORDER.indexOf(a) - WD_ORDER.indexOf(b));
  const k = d.join(); return k === '1,2,3,4,5' ? 'werktags' : k === '1,2,3,4,5,6,0' ? 'täglich' : k === '6,0' ? 'am Wochenende' : d.map(x => DAYS[x]).join(', '); };
const hm2 = t => new Date(t).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
// next time a plan is due (like charging.Plan.Next)
function planNext(p, now = new Date()) {
  if (p.off) return null;
  if (!p.days || !p.days.length) { const t = new Date(p.at); return t > now ? t : null; }
  const [h, m] = (p.time || '07:00').split(':').map(Number);
  for (let i = 0; i <= 7; i++) {
    const t = new Date(now); t.setDate(t.getDate() + i); t.setHours(h, m, 0, 0);
    if (t > now && p.days.includes(t.getDay())) return t;
  }
  return null;
}
// the car stops at its own charge limit, whatever the plan says
const limitNote = (v, x) => v.limitSoc != null && x > v.limitSoc + 0.001 ? ` · Achtung: das Auto stoppt bei seinem Limit von ${pct(v.limitSoc)} (in der Fahrzeug-App ändern)` : '';
function nextPlanShort(v) {
  const n = (v.settings.plans || []).map(p => [p, planNext(p)]).filter(x => x[1]).sort((a, b) => a[1] - b[1])[0];
  return n ? `${pct(n[0].soc)} bis ${etaTime(n[1])}` : 'Ladeplan';
}
// summary on the wallbox tile
function planSummary(veh, sch, canEdit) {
  const n = (veh.settings.plans || []).map(p => [p, planNext(p)]).filter(x => x[1]).sort((a, b) => a[1] - b[1])[0];
  const txt = n ? `<b>${pct(n[0].soc)} bis ${etaTime(n[1])}</b><span>${sch ? esc(sch.reason) : (n[0].days && n[0].days.length ? dayList(n[0].days) + ' ' + n[0].time : 'einmalig')}</span>`
    : '<b>Kein Ladeplan</b><span>Ziel-Ladestand zur Abfahrt festlegen</span>';
  return `<div class="planline">${iconSVG('calendar', 18)}<div class="txt">${txt}</div>${canEdit ? `<button type="button" class="btn" data-plans="${esc(veh.key)}">${n ? 'Bearbeiten' : 'Planen'}</button>` : ''}</div>`;
}

        <button type="button" class="iconbtn" data-pedit="${esc(p.id)}" aria-label="Plan bearbeiten" title="Bearbeiten">${iconSVG('gear', 17)}</button>
        <button type="button" class="iconbtn" data-pdel="${esc(p.id)}" aria-label="Plan löschen" title="Löschen"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`}
    </div>`;
  }).join('') : '<div class="pempty">Noch kein Ladeplan. Mit einem Plan ist das Auto zur Abfahrt geladen – voltibri nutzt bis dahin PV-Überschuss und die günstigsten Stunden.</div>';
  let form = '';
  if (edit) {

    const need = cap && soc != null ? Math.max(0, (edit.soc - soc) * cap / 0.85) : null;
    const atLocal = (() => { const d = edit.at ? new Date(edit.at) : (() => { const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(7, 0, 0, 0); return t; })();
      const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; })();
    form = `<form class="pform" id="pform" novalidate>

// form values into PD.edit (keeps them across re-renders)
function readPlanForm() {
  const e = PD.edit, f = $('pform');
  if (!e || !f) return;
  e.soc = Number($('pfSoc').value) / 100;
  if ($('pfTime')) { e.time = $('pfTime').value; e.days = [...f.querySelectorAll('[data-wd]:checked')].map(x => Number(x.dataset.wd)); e.mode = 'rep'; }
  if ($('pfAt')) { e.at = $('pfAt').value ? new Date($('pfAt').value).toISOString() : ''; e.mode = 'once'; }
}
async function savePlans(plans) {
  const s = vehicleSettings(PD.key);
  s.plans = plans;
  const r = await fetch('api/vehicles/' + PD.key, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(s)});
  if (!r.ok) { const j = await r.json().catch(() => ({})); PD.err = j.error || 'Fehler ' + r.status; renderPlans(); return false; }
  PD.err = '';
  await refreshCharging(true);
  return true;
}
$('plansDlg').addEventListener('click', async e => {
  const d = $('plansDlg');
  if (e.target === d || e.target.closest('[data-pclose]')) return d.close();
  const v = vehicleOf(PD.key), plans = JSON.parse(JSON.stringify((v && v.settings.plans) || []));
  if (e.target.closest('[data-pnew]')) { PD.edit = {id: '', soc: 0.8, time: '07:00', days: [1, 2, 3, 4, 5], mode: 'rep'}; return renderPlans(); }
  if (e.target.closest('[data-pcancel]')) { PD.edit = null; PD.err = ''; return renderPlans(); }
  const ed = e.target.closest('[data-pedit]');
  if (ed) { const p = plans.find(x => x.id === ed.dataset.pedit); PD.edit = {...p, mode: p.days && p.days.length ? 'rep' : 'once'}; return renderPlans(); }
  const del = e.target.closest('[data-pdel]');
  if (del && confirm('Diesen Ladeplan löschen?')) { await savePlans(plans.filter(p => p.id !== del.dataset.pdel)); return renderPlans(); }
  const rep = e.target.closest('[data-prep]');
  if (rep) {
    readPlanForm();
    if (rep.dataset.prep === '1') { PD.edit.mode = 'rep'; if (!PD.edit.days || !PD.edit.days.length) PD.edit.days = [1, 2, 3, 4, 5]; }
    else { PD.edit.mode = 'once'; PD.edit.days = []; }
    return renderPlans();
  }
  const pre = e.target.closest('[data-preset]');
  if (pre) { const on = pre.dataset.preset.split(',').map(Number); $('pform').querySelectorAll('[data-wd]').forEach(x => { x.checked = on.includes(Number(x.dataset.wd)); }); return; }
  if (e.target.closest('[data-psave]')) {
    readPlanForm();
    const ed2 = PD.edit, p = {id: ed2.id || undefined, soc: ed2.soc};
    if (ed2.mode === 'rep') {
      if (!ed2.days.length) { PD.err = 'Bitte mindestens einen Wochentag wählen.'; return renderPlans(); }
      if (!ed2.time) { PD.err = 'Bitte eine Uhrzeit wählen.'; return renderPlans(); }
      p.days = ed2.days; p.time = ed2.time;
    } else {
      if (!ed2.at || new Date(ed2.at) <= new Date()) { PD.err = 'Der Zeitpunkt muss in der Zukunft liegen.'; return renderPlans(); }
      p.at = ed2.at;
    }
    const old = ed2.id ? plans.find(x => x.id === ed2.id) : null;
    if (old) p.off = old.off;
    const next = ed2.id ? plans.map(x => x.id === ed2.id ? p : x) : plans.concat([p]);
    if (await savePlans(next)) { PD.edit = null; renderPlans(); }
  }
});

}

    const cop = h.cop, th = h.thermalW != null ? Math.max(0, h.thermalW) : null, el = h.electricW != null ? Math.max(0, h.electricW) : c.powerW;
    const col = cop == null ? 'var(--muted)' : cop < 2.5 ? 'var(--warn)' : cop < 3.5 ? 'var(--solar)' : 'var(--accent)';

const SEL_TITLE = {hp: ['heatpump', 'Heizung'], grid: ['grid', 'Netz'], battery: ['battery', 'Hausbatterie'], pv: ['solar', 'PV'], home: ['house', 'Haus']};

// --- battery settings, boost and force charging (administrators; only what the battery supports) ---
let batInfo = null, batEl = null;

async function batSend(method, url, body) {

  const res = r ? await r.json().catch(() => ({})) : {};

function buildBatCtl() {

  batEl = batEl || document.createElement('div');
  batEl.className = 'bctl';
  const s = i.settings || {}, b = i.boost, fc = i.forceCharge, a = i.auto || {};

    const vs = [];
    for (let v = min; v <= max + 1e-9; v += st) vs.push(Math.round(v));
    if (!vs.includes(val)) vs.push(val), vs.sort((x, y) => x - y);

  };

  const grp = (title, head, tiles) => `<section class="bgrp"><header><h3>${title}</h3>${head || ''}</header>${tiles ? `<div class="bgrid">${tiles}</div>` : ''}</section>`;
  const more = '<a class="navlink" href="konfiguration#strategy">Einstellungen</a>';

  // charge targets: what is decided for today (the automatic is configured in the settings)
  let limits = '';
  if (f.maxSoc || f.minSoc) {
    const auto = s.limitMode !== 'manual';
    const seg = f.maxSoc ? `<span class="seg" role="group" aria-label="Ladegrenzen"><button type="button" data-limits="auto" aria-pressed="${auto}">Automatisch</button><button type="button" data-limits="manual" aria-pressed="${!auto}">Manuell</button></span>` : '';
    const now = `${pct(i.minSocNow || 0)} – ${i.maxSocNow > 0 ? pct(i.maxSocNow) : '100 %'}`;
    const note = auto ? `jetzt ${now} · ${esc(a.reason || '')}` : s.manualFor === 'always' ? 'von Hand, bis du es änderst' : `von Hand bis ${s.manualUntil ? etaTime(s.manualUntil) : 'morgen früh'}, dann wieder automatisch`;
    const t = auto ? '' : [
      f.maxSoc ? sel('maxSoc', 'Oben', P(s.maxSoc || 1), 50, 100, 5, v => v + ' %', 'Darüber lädt die Batterie nicht weiter.') : '',
      f.minSoc ? sel('minSoc', 'Unten', P(s.minSoc), 0, 50, 5, v => v === 0 ? 'aus' : v + ' %', 'Darunter entlädt voltibri die Batterie nicht.') : '',
      f.maxSoc ? `<label class="bt" title="Danach regelt wieder die Automatik"><span>Gilt</span><select data-key="manualFor"><option value="morning"${s.manualFor !== 'always' ? ' selected' : ''}>bis morgen</option><option value="always"${s.manualFor === 'always' ? ' selected' : ''}>dauerhaft</option></select></label>` : ''].join('');

  // force charging: one line
  const force = !f.forceCharge ? '' : fc
    ? grp('Zwangsladung', `<small>läuft bis ${pct(fc.targetSoc)} – auch aus dem Netz · seit ${hm(fc.since)}</small><button class="btn danger" id="bForceEnd">Beenden</button>`, '')
    : grp('Zwangsladung', `<small>sofort mit voller Leistung, notfalls aus dem Netz</small><select id="bForce" aria-label="Zwangsladung bis">${opts(Math.max(P(i.maxSocNow || 1), 50), 20, 100, 5, v => 'bis ' + v + ' %')}</select><button class="btn" id="bForceGo">${iconSVG('bolt', 14)} Starten</button>`, '');

  const q = id => batEl.querySelector('#' + id);

    maxSoc: f.maxSoc ? (s.maxSoc || 0) : 0, minSoc: f.minSoc ? (s.minSoc || 0) : 0, maxDischargeW: f.maxDischarge ? (s.maxDischargeW || 0) : 0,
    autoFloorSunny: s.autoFloorSunny, autoFloorCloudy: s.autoFloorCloudy, autoMaxSoc: s.autoMaxSoc || 0,
    prioritySoc: s.prioritySoc, boostReserve: s.boostReserve || 0, boostStopSoc: s.boostStopSoc, boostStartSoc: s.boostStartSoc || 0}, over);
  const conv = (k, v) => k === 'manualFor' ? v : k === 'maxSoc' ? (+v >= 100 ? 0 : +v / 100) : +v / 100;
  batEl.querySelectorAll('select[data-key]').forEach(x => x.onchange = () => batSend('PUT', 'api/battery', body({[x.dataset.key]: conv(x.dataset.key, x.value)})));
  batEl.querySelectorAll('[data-limits]').forEach(x => x.onclick = () => {
    if (x.getAttribute('aria-pressed') === 'true') return;

}

  const opts = [`<option value="">Automatisch erkennen${lp.connected && !lp.manual ? ' (' + esc(lp.vehicleName) + ')' : ''}</option>`,
    `<option value="guest"${lp.manual && guest ? ' selected' : ''}>Gastfahrzeug</option>`,
    ...(charging.vehicles || []).map(v => `<option value="${esc(v.key)}"${lp.manual && lp.vehicle === v.key ? ' selected' : ''}>${esc(v.name)}</option>`)];
  $('lpInner').innerHTML = `<div class="pd-head"><div class="top"><span class="ic">${iconSVG('car', 22)}</span>
      <div><h2 id="lpdTitle">Fahrzeug &amp; Ladeplan</h2><div class="sub">${esc(lp.name)} · ${lp.connected ? esc(lp.vehicleName) : pre ? 'vorgewählt: ' + esc(lp.vehicleName) : 'kein Fahrzeug angesteckt'}</div></div>
      <button type="button" class="x" data-lpclose aria-label="Schließen">×</button></div></div>
    <div class="pd-body">
      ${(lp.connected || canEdit) && !lp.foreign ? `<div class="pform"><div><div class="lab">${lp.connected ? 'Welches Fahrzeug lädt?' : 'Welches Fahrzeug wird eingesteckt?'}</div>
        <select data-lpveh aria-label="Fahrzeug" ${canEdit ? '' : 'disabled'} style="width:100%;font-size:15px;padding:8px 10px;border-radius:10px">${opts.join('')}</select>
        <div class="need">${lp.detecting ? 'voltibri fragt noch die Fahrzeugkonten ab (bis zu 10 min).'
          : pre ? `Bitte bis ${esc(etaTime(lp.manualUntil))} einstecken, sonst wird die Wallbox wieder gesperrt. Danach gilt die Wahl bis zum Abstecken.`
          : lp.connected ? 'Gilt bis zum Abstecken. „Automatisch“ erkennt das Auto über sein Fahrzeugkonto.'
          : 'Wähle das Fahrzeug schon vor dem Einstecken – ohne Ladekarte und automatische Erkennung. Wird innerhalb von 10 min nichts eingesteckt, wird die Wallbox wieder gesperrt.'}</div>
        ${guest && !lp.detecting ? `<div class="need">${esc(GUEST_POLICY[lp.guestPolicy] || '')}</div>` : ''}</div></div>` : ''}
      ${veh ? `<div class="pform"><div class="lab">Ladeplan · ${esc(veh.name)}</div>${planSummary(veh, lp.plan, charging.local)}</div>` : '<div class="hint">Ladepläne gibt es für bekannte Fahrzeuge, nicht für Gäste.</div>'}
    </div>
    <div class="pd-foot"><button type="button" class="btn" data-lpclose>Fertig</button></div>`;
}

topbar('overview');
// big number with a small unit: "4,2 kW" -> 4,2<small>kW</small>
const big = s => { const m = String(s).match(/^(.*?)\s*(kWh|kW|W|%)$/); return m ? `${esc(m[1])}<small>${m[2]}</small>` : esc(s); };
const PLAN_TITLE = {delay: 'Spät laden', immediate: 'Sofort laden', night: 'Für die Nacht laden', 'no-data': 'Zu wenig Daten'};

// day totals (autarky, PV, forecast for the rest of the day), once a minute
let todayAt = 0;
async function refreshToday() {
  if (Date.now() - todayAt < 60000) return;
  todayAt = Date.now();
  const t = await fetch('api/today').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!t) return;
  today = t;
  const kwhBig = wh => big((wh / 1000).toLocaleString('de-DE', {maximumFractionDigits: wh >= 10000 ? 0 : 1}) + ' kWh');
  const since = t.covered ? '' : ' seit ' + hm(t.since);
  $('tAut').innerHTML = t.autarky != null ? big(pct(t.autarky)) : '–';
  $('tAutSub').textContent = t.loadWh > 0 ? kwh(t.gridImportWh) + ' aus dem Netz' + since : 'noch keine Daten';
  $('tPV').innerHTML = kwhBig(t.pvWh);
  $('tPVSub').textContent = t.selfUse != null ? pct(t.selfUse) + ' selbst genutzt' + since : since.trim();
  $('tRest').innerHTML = kwhBig(t.forecastRestWh);
}

// heat pump card (heat output and COP from a heat source, e.g. ESPHome)
function renderHeat(st) {
  const hs = st.heat || [];
  $('heat').hidden = !hs.length;
  if (!hs.length) return;
  const h = hs[0];
  const t = v => v == null ? '–' : v.toFixed(1).replace('.', ',') + ' °C';
  const spread = h.flowC != null && h.returnC != null ? 'Spreizung ' + (h.flowC - h.returnC).toFixed(1).replace('.', ',') + ' K' : '';
  $('hState').textContent = h.error ? 'keine Daten' : (h.state || '–');
  $('heatBody').innerHTML = `<div class="heatgrid">
    <div><div class="eyebrow">Wärmeleistung</div><div class="big num">${h.thermalW != null ? big(kw(Math.max(0, h.thermalW))) : '–'}</div>
      <div class="sub">${h.electricW != null ? 'Verdichter ' + kw(h.electricW) : ''}</div></div>
    <div><div class="eyebrow">COP</div><div class="big num">${h.cop != null ? h.cop.toFixed(1).replace('.', ',') : '–'}</div><div class="sub">gemittelt über 5 min</div></div>
    <div><div class="eyebrow">Vorlauf / Rücklauf</div><div class="big num" style="font-size:22px">${t(h.flowC)} / ${t(h.returnC)}</div><div class="sub">${spread}</div></div>
    <div><div class="eyebrow">Außen · Warmwasser</div><div class="big num" style="font-size:22px">${t(h.outdoorC)} · ${t(h.hotWaterC)}</div></div>
  </div>${h.error ? `<p class="note" style="margin-top:10px">${esc(h.error)}</p>` : ''}`;
}

async function refresh() {
  const me = await voltibri.me;
  // what this user may see (administrators: everything)
  const can = {flow: !me || me.flow, forecast: !me || me.forecast, heat: !me || me.heat};
  document.body.classList.toggle('no-flow', !can.flow);
  document.body.classList.toggle('no-forecast', !can.forecast);
  document.body.classList.toggle('no-heat', !can.heat);
  document.body.classList.toggle('restricted', !!me && !me.admin);
  if (me && !me.admin) $('allRuns').hidden = !me.reports;
  if (me && !me.overview) { refreshCharging(); return; } // only the wallboxes
  try {
    const [st, plan, hist] = await Promise.all([fetch('api/state').then(r => r.json()),
      can.forecast ? fetch('api/plan').then(r => r.json()) : null, can.forecast ? loadHistory() : []]);
    if (can.flow) { drawFlow(st); refreshToday(); renderDetails(st); }
    // the heat pump details live in the energy flow (click); the card is for users without it
    if (can.heat && !can.flow) renderHeat(st); else $('heat').hidden = true;
    if (plan) {
      $('bTitle').textContent = PLAN_TITLE[plan.mode] || modes[plan.mode] || 'Ladeplanung';
      $('limit').innerHTML = 'Ladegrenze <b>' + esc(!st.controlled ? 'nur Empfehlung' : (st.chargeLimitW < 0 ? 'keine' : kw(st.chargeLimitW))) + '</b>';
      $('target').innerHTML = 'Ziel am Abend <b>' + (plan.targetSoC ? pct(plan.targetSoC) : '–') + '</b>';
      $('discharge').hidden = !(st.dischargeLimitW >= 0);
      $('discharge').innerHTML = 'Entladung max. <b>' + kw(st.dischargeLimitW || 0) + '</b>';
      $('discharge').title = (st.excluded || []).length ? 'Ohne Hausbatterie: ' + st.excluded.join(', ') + (st.controlled ? '' : ' (nur Empfehlung – Batterie nicht gesteuert)') : '';
      $('reasons').innerHTML = (plan.reasons || []).map(r => `<li>${esc(r)}</li>`).join('');
      drawChart(plan.slots || [], hist || []);
    }
    $('hstatus').innerHTML = (st.dryRun && (!me || me.admin) ? '<a class="badge warn" href="konfiguration#system" title="voltibri schreibt nichts auf Geräte, sondern protokolliert nur – umschalten unter Konfiguration → System">Testmodus</a>' : '') +
      `<span class="live" title="letzte Messung">${new Date(st.time).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit', second: '2-digit'})}</span>`;
    $('errors').textContent = (st.errors || []).join(' · ');
    window._last = st;
    refreshCharging();
  } catch (e) {
    $('errors').textContent = 'Keine Verbindung zu voltibri: ' + e;
    const l = document.querySelector('.live');
    if (l) l.classList.add('off');
  }
}

// Chart ranges: [from, to] in ms. Past slots show measured values (solid)
// and the plan of that day (dashed, muted); the future shows the plan.
const SLOT_MS = 15 * 60 * 1000;
let range = 'today';
try { range = localStorage.getItem('chartRange') || 'today'; } catch (e) {}
function rangeWindow(r, now = Date.now()) {
  const day = off => { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d.getTime(); };
  switch (r) {
    case 'yesterday': return [day(-1), day(0)];
    case 'tomorrow': return [day(1), day(2)];
    case '48h': return [now - 3 * 3600e3, now + 48 * 3600e3];
    default: return [day(0), day(1)];
  }
}
function setRange(r) {
  range = r;
  try { localStorage.setItem('chartRange', r); } catch (e) {}
  document.querySelectorAll('#range [data-range]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.range === r)));
}
setRange(range);
$('range').addEventListener('click', e => {
  const b = e.target.closest('[data-range]');
  if (b) { setRange(b.dataset.range); refresh(); }
});
async function loadHistory() {
  const [from, to] = rangeWindow(range);
  const now = Date.now();
  if (from >= now) return [];
  const q = `from=${encodeURIComponent(new Date(from).toISOString().replace(/\.\d+Z$/, 'Z'))}&to=${encodeURIComponent(new Date(Math.min(to, now)).toISOString().replace(/\.\d+Z$/, 'Z'))}`;
  return fetch('api/history?' + q).then(r => r.ok ? r.json() : []).catch(() => []);
}

function drawChart(planSlots, hist) {
  const svg = $('chart'), W = 960, H = 300, L = 44, R = 44, T = 24, B = 26;
  const ts = s => new Date(s.start).getTime();
  const now = Date.now();
  const [t0, t1] = rangeWindow(range, now);
  const slots = planSlots.filter(s => ts(s) + SLOT_MS > Math.max(t0, now) && ts(s) < t1);
  hist = hist.filter(s => ts(s) >= t0 && ts(s) < Math.min(t1, now));
  if (!slots.length && !hist.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="14" fill="var(--muted)">${range === 'tomorrow' ? 'Für morgen gibt es noch keine Prognose.' : 'Für diesen Zeitraum liegen keine Daten vor.'}</text>`;
    return;
  }
  const x = t => L + (W-L-R) * (t - t0) / (t1 - t0);
  const v = (s, k) => s[k] == null ? NaN : s[k];
  const maxW = Math.max(1000, ...slots.map(s => Math.max(s.pvW, s.loadW)),
    ...hist.map(s => Math.max(v(s, 'pvW') || 0, v(s, 'loadW') || 0, v(s, 'planPvW') || 0, v(s, 'planLoadW') || 0)));
  const y = w => T + (H-T-B) * (1 - w/maxW), ys = q => T + (H-T-B) * (1 - q);
  const fmt = q => (q/1000).toFixed(1).replace('.', ',');
  let g = '';
  // past (measured) background
  const xp = Math.min(Math.max(x(now), L), W - R);
  if (xp > L) g += `<rect x="${L}" y="${T}" width="${(xp - L).toFixed(1)}" height="${H-T-B}" fill="var(--track)" opacity=".45"/>`;
  // charging allowed (future only): adjacent slots merged into one band
  const bands = [];
  slots.forEach(s => { if (s.chargeLimitW !== 0 && s.pvW > s.loadW) {
    const a = Math.max(ts(s), now), b = Math.min(ts(s) + SLOT_MS, t1), last = bands[bands.length - 1];
    if (b <= a) return;
    if (last && last[1] >= a) last[1] = b; else bands.push([a, b]);
  } });
  bands.forEach(([a, b]) => g += `<rect x="${x(a).toFixed(1)}" y="${T}" width="${(x(b) - x(a)).toFixed(1)}" height="${H-T-B}" fill="var(--limit)"/>`);
  for (let k = 0; k <= 4; k++) { const w = maxW*k/4;
    g += `<line x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}" stroke="var(--line)"/>` +
         `<text x="${L-6}" y="${ys(k/4)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${k*25} %</text>` +
         `<text x="${W-R+6}" y="${y(w)+4}" font-size="11" fill="var(--muted)">${fmt(w)}</text>`; }  // left: SoC, right: kW
  // hour ticks (every 3 h for one day, 6 h otherwise), day boundaries
  const step = t1 - t0 <= 26 * 3600e3 ? 3 : 6;
  const d = new Date(t0); d.setMinutes(0, 0, 0); if (d.getTime() < t0) d.setHours(d.getHours() + 1);
  for (; d.getTime() <= t1; d.setHours(d.getHours() + 1)) {
    const h = d.getHours(), xt = x(d.getTime()).toFixed(1);
    if (h === 0 && d.getTime() > t0 && d.getTime() < t1) {
      g += `<line x1="${xt}" x2="${xt}" y1="${T - 14}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".7"/>` +
           `<text x="${(+xt + 5).toFixed(1)}" y="${T - 4}" font-size="11" font-weight="600" fill="var(--muted)">${d.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'})}</text>`;
    }
    if (h % step === 0) g += `<text x="${xt}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${h}:00</text>`;
  }
  // a line through the slot centres; gaps (unknown values) break the line
  const path = (rows, f, sc) => {
    let p = '', on = false;
    for (const s of rows) {
      const q = f(s);
      if (q == null || Number.isNaN(q)) { on = false; continue; }
      p += (on ? 'L' : 'M') + x(ts(s) + SLOT_MS / 2).toFixed(1) + ',' + sc(q).toFixed(1);
      on = true;
    }
    return p;
  };
  const line = (d, color, w, extra = '') => d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${extra}/>` : '';
  const planned = ' stroke-dasharray="5 4" opacity=".55"';
  // house consumption as one bar per slot (the 15-minute values jump too
  // much for a line): measured solid, expected lighter, the day's plan as a
  // short mark on the measured bar
  const sw = x(t0 + SLOT_MS) - x(t0), gap = sw > 4 ? 1 : sw > 2 ? 0.5 : 0, bw = Math.max(0.5, sw - gap);
  const bars = (rows, f, op) => rows.map(s => {
    const q = f(s);
    if (q == null || Number.isNaN(q) || q <= 0) return '';
    const bx = x(ts(s)) + gap / 2, by = y(q);
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y(0) - by).toFixed(1)}" fill="var(--home)" opacity="${op}"/>`;
  }).join('');
  const marks = (rows, f) => rows.map(s => {
    const q = f(s);
    if (q == null || Number.isNaN(q)) return '';
    const yq = y(q).toFixed(1);
    return `<line x1="${(x(ts(s)) + gap / 2).toFixed(1)}" x2="${(x(ts(s)) + gap / 2 + bw).toFixed(1)}" y1="${yq}" y2="${yq}"/>`;
  }).join('');
  g += bars(hist, s => v(s, 'loadW'), .5);
  if (slots.some(s => s.loadW > 0)) g += bars(slots, s => s.loadW, .22);
  g += `<g stroke="var(--home)" stroke-width="1.6" opacity=".9">${marks(hist, s => v(s, 'planLoadW'))}</g>`;
  // past: the day's plan (dashed, muted) ...
  g += line(path(hist, s => v(s, 'planPvW'), y), 'var(--solar)', 1.6, planned);
  g += line(path(hist, s => v(s, 'planSoC'), ys), 'var(--battery)', 1.8, planned);
  // ... and what was measured, continued by the plan for the future
  const join = slots.length ? [{start: slots[0].start, pvW: slots[0].pvW, loadW: slots[0].loadW, soc: slots[0].expectedSoC}] : [];
  const past = hist.concat(hist.length ? join : []);
  g += line(path(past, s => v(s, 'pvW'), y), 'var(--solar)', 2);
  g += line(path(past, s => v(s, 'soc'), ys), 'var(--battery)', 2.5);
  if (slots.length) {
    g += line(path(slots, s => s.pvW, y), 'var(--solar)', 2);
    if (slots.some(s => s.expectedSoC > 0)) g += line(path(slots, s => s.expectedSoC, ys), 'var(--battery)', 2.5);
  }
  // now marker
  if (now > t0 && now < t1) {
    const xn = x(now).toFixed(1);
    g += `<line x1="${xn}" x2="${xn}" y1="${T - 14}" y2="${H-B}" stroke="var(--fg)" stroke-width="1.5"/>` +
         `<text x="${(+xn - 5).toFixed(1)}" y="${T - 4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--fg)">jetzt</text>`;
  }
  svg.innerHTML = g;
}

voltibri.ready.then(() => charging && refreshCharging(true));

  const n = e.target.closest('[data-setup-new]');
  if (n) voltibri.open({type: n.dataset.setupNew, onDone: () => refreshCharging(true)});

document.addEventListener('click', e => {
  if (modeOpen && !e.target.closest('.wbscene')) { modeOpen = null; refreshCharging(true); }
});

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => window._last && drawFlow(window._last), 150); });
refresh(); setInterval(refresh, 5000);

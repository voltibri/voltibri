<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>voltibri</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="voltibri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="common.css">
<style>
  /* hero: big numbers above the energy flow */
  .hero { display:grid; grid-template-columns:minmax(0, 1fr) 210px; gap:12px 28px; align-items:center; }
  .hero .err { grid-column:1 / -1; }
  .stats { display:flex; flex-direction:column; gap:0; }
  .stats .stat { padding:14px 0; border-top:1px solid var(--line); }
  .stats .stat:first-child { border-top:0; }
  .stat { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .stat .big { font-size:34px; font-weight:300; line-height:1.1; letter-spacing:-.035em; white-space:nowrap; }
  .stat .big small { font-size:16px; font-weight:400; color:var(--muted); margin-left:3px; letter-spacing:0; }
  .stat .sub { font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  @media (max-width:760px) {
    .hero { grid-template-columns:1fr; gap:6px; }
    .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; border-top:1px solid var(--line); padding-top:12px; }
    .stats .stat { padding:0; border:0; }
    .stat .big { font-size:22px; } .stat .big small { font-size:11px; }
    .stat .eyebrow { font-size:9.5px; letter-spacing:.04em; } .stat .sub { font-size:10.5px; line-height:1.3; }
  }
  #flow { width:100%; height:auto; display:block; margin:0 auto; overflow:visible; }
  #flow text { font-variant-numeric:tabular-nums; }
  .track { fill:none; stroke:var(--track); stroke-width:2; }
  .tog { cursor:pointer; outline:none; }
  .tog:hover > circle:first-of-type, .tog:focus-visible > circle:first-of-type { stroke-width:3.5; }
  .pop { transform-box:fill-box; transform-origin:center; animation:pop .28s ease-out; }
  @keyframes pop { from { opacity:0; transform:scale(.6); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation:none; } }
  .flowline { fill:none; stroke-linecap:round; stroke-dasharray:1 12; animation:dash linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-26; } }
  @media (prefers-reduced-motion: reduce) { .flowline { animation:none; stroke-dasharray:none; opacity:.8; } }
  .err { color:var(--warn); font-size:13px; margin-top:8px; }
  .err:empty { display:none; }

  /* card head: eyebrow + title left, details right */
  .cardhead { display:flex; align-items:flex-end; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px; }
  .cardhead h2 { margin:2px 0 0; }
  .cardhead .right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  /* users without the overview only see their wallboxes */
  body.restricted [data-overview] { display:none !important; }
  @media (min-width: 900px) { #bhead { flex-wrap:nowrap; } #bhead .right { flex-wrap:nowrap; white-space:nowrap; } }
  .legend i.dash { background:repeating-linear-gradient(90deg, var(--muted) 0 5px, transparent 5px 9px); opacity:.8; }
  .chip { font-size:12px; padding:3px 10px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .chip b { color:var(--fg); font-weight:600; }

  /* wallboxes */
  #laden[hidden] { display:none; }
  .lps { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
  .lp { background:var(--card-2); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .lphead { display:flex; align-items:center; gap:8px; min-width:0; }
  .lphead h3 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .lphead .pill { flex:none; }
  .lphead .pw { margin-left:auto; flex:none; white-space:nowrap; font-size:22px; font-weight:300; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .pill { font-size:11px; font-weight:550; padding:2px 9px; border-radius:99px; background:var(--track); color:var(--muted); }
  .pill.on { background:var(--accent-soft); color:var(--accent); }
  .lpsub { font-size:13px; color:var(--muted); margin-top:-6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .vrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input[type=time], input[type=datetime-local], input[type=number] {
    font:inherit; font-size:13px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:5px 8px; }
  select { max-width:100%; }
  .socbar { position:relative; height:8px; border-radius:4px; background:var(--track); overflow:hidden; }
  .socbar i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--accent), var(--battery)); border-radius:4px; }
  .socbar b { position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.5; }
  .socline { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:4px; }
  .modes { position:relative; display:grid; grid-template-columns:1fr 1.6fr 1fr; gap:3px; padding:3px; border-radius:12px; background:var(--track); }
  .modes .split { display:flex; border-radius:9px; }
  .modes .split > button:first-child { flex:1; border-radius:9px 0 0 9px; }
  .modes .split > button.caret { flex:none; width:30px; padding:0; border-radius:0 9px 9px 0; }
  .modes .split.sel { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .modes .split.sel > button { color:var(--accent); }
  .modes .split.sel > button.caret { border-left:1px solid var(--line); }
  .modes button small { font-size:11px; font-weight:500; opacity:.8; margin-left:3px; }
  .smartmenu { position:absolute; z-index:20; left:3px; right:3px; top:calc(100% + 6px); display:flex; flex-direction:column; gap:2px; padding:6px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.18); }
  .smartmenu button { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:8px 10px !important; border-radius:10px !important; color:var(--fg) !important; }
  .smartmenu button:hover:not(:disabled) { background:var(--track) !important; }
  .smartmenu button[aria-checked=true] { background:var(--accent-soft) !important; }
  .smartmenu button[aria-checked=true] b { color:var(--accent); }
  .smartmenu button span { font-size:12px; color:var(--muted); font-weight:400; }
  .smartmenu button:disabled { opacity:.5; }
  .modes button { font:inherit; font-size:13px; font-weight:550; border:0; background:transparent; color:var(--muted); padding:6px 4px; border-radius:9px; cursor:pointer; }
  .modes button.sel { background:var(--card); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .modes button:disabled { cursor:default; }
  .modes button:disabled:not(.sel) { opacity:.6; }
  .lp details.more > div { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .planbox { display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .planbox .ttl { font-weight:600; font-size:13px; }
  .plans { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:4px; }
  .plans li { display:flex; align-items:center; gap:8px; }
  .plans li span { flex:1; }
  .days { display:flex; gap:3px; }
  .days label { font-size:11px; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .sess { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .sess b { color:var(--fg); font-variant-numeric:tabular-nums; }
  #lveh:not(:empty) { margin-top:14px; }
  #lveh details.more > div { margin-top:10px; display:flex; flex-direction:column; gap:8px; }

  /* heat pump */
  #heat[hidden] { display:none; }
  .heatgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:14px 20px; }
  .heatgrid .big { font-size:30px; font-weight:300; letter-spacing:-.035em; line-height:1.1; }
  .heatgrid .big small { font-size:14px; color:var(--muted); margin-left:3px; }
  .heatgrid .sub { font-size:12px; color:var(--muted); }
  /* battery plan */
  svg.chart { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:8px 0 12px; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:5px; border-radius:2px; }
  #reasons { margin:10px 0 0; padding-left:18px; font-size:14px; }
  #reasons li + li { margin-top:4px; }
</style>
</head>
<body>
<main>
  <header class="top"></header>

  <section class="card hero" aria-label="Jetzt" data-overview>
    <svg id="flow" role="img" aria-label="Energiefluss zwischen Erzeugern, Netz, Batterie und Verbrauchern"></svg>
    <!-- the day so far (the flow shows the current values): right of the flow on desktop, below on phones -->
    <div class="stats">
      <div class="stat"><span class="eyebrow"><i class="dot" style="background:var(--accent)"></i>Autarkie heute</span><span class="big num" id="tAut">–</span><span class="sub" id="tAutSub"></span></div>
      <div class="stat"><span class="eyebrow"><i class="dot" style="background:var(--solar)"></i>Erzeugt heute</span><span class="big num" id="tPV">–</span><span class="sub" id="tPVSub"></span></div>
      <div class="stat"><span class="eyebrow"><i class="dot" style="background:var(--solar);opacity:.45"></i>Prognose Rest</span><span class="big num" id="tRest">–</span><span class="sub">bis Mitternacht</span></div>
    </div>
    <div class="err" id="errors"></div>
  </section>

  <section class="card" id="laden" hidden>
    <div class="cardhead"><div><div class="eyebrow">Laden</div><h2>Wallboxen</h2></div>
      <div class="right"><span class="sub" id="ltariff"></span><a class="navlink" href="berichte" id="allRuns">Alle Ladevorgänge →</a></div></div>
    <div class="flash" id="lflash" hidden></div>
    <div class="lps" id="lps"></div>
    <div id="lveh"></div>
  </section>

  <section class="card" id="heat" hidden data-overview>
    <div class="cardhead"><div><div class="eyebrow">Heizung</div><h2>Wärmepumpe</h2></div><div class="right"><span class="chip" id="hState"></span></div></div>
    <div id="heatBody"></div>
  </section>

  <section class="card" data-overview>
    <div class="cardhead" id="bhead"><div><div class="eyebrow">Batterie</div><h2 id="bTitle">Ladeplanung</h2></div>
      <div class="right"><span class="chip" id="discharge" hidden></span><span class="chip" id="limit">–</span><span class="chip" id="target">–</span>
        <div class="seg" role="group" aria-label="Zeitraum" id="range">
      <button type="button" data-range="yesterday" aria-pressed="false">Gestern</button><button type="button" data-range="today" aria-pressed="true">Heute</button><button type="button" data-range="tomorrow" aria-pressed="false">Morgen</button><button type="button" data-range="48h" aria-pressed="false">48 h</button>
        </div></div></div>
    <svg class="chart" id="chart" viewBox="0 0 960 300" role="img" aria-label="Soll und Ist: PV, Hausverbrauch und Ladestand"></svg>
    <div class="legend">
      <span><i style="background:var(--solar)"></i>PV</span>
      <span><i style="background:var(--home)"></i>Hausverbrauch</span>
      <span><i style="background:var(--battery)"></i>Ladestand</span>
      <span><i style="background:var(--limit);height:10px"></i>Laden erlaubt</span>
      <span><i class="dash"></i>Plan vom Tagesbeginn</span>
      <span><i style="background:var(--track);height:10px"></i>Vergangenheit (gemessen)</span>
    </div>
    <details class="more" data-k="why"><summary>Warum so?</summary><ul id="reasons"></ul></details>
  </section>
</main>
<script src="common.js"></script>
<script>
const kw = w => (Math.abs(w) >= 1000 ? (w/1000).toFixed(1).replace('.', ',') + ' kW' : Math.round(w) + ' W');
const pct = v => Math.round(v*100) + ' %';
const modes = {delay:'spät laden', immediate:'sofort laden', night:'Nacht', 'no-data':'zu wenig Daten'};

// 24x24 line icons

const COLORS = {producer:'var(--solar)', grid:'var(--grid)', battery:'var(--battery)', consumer:'var(--consumer)', home:'var(--home)'};

function icon(name, x, y, color, size = 24) {
  const s = size / 24;
  return `<g transform="translate(${x - size/2} ${y - size/2}) scale(${s})" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.plug}</g>`;
}

// Overview groups: devices with the same "group" form one bubble; a click on
// a group opens its devices in an overlay.
const GROUPS = {pv: {name: 'PV', icon: 'solar'}, wallboxen: {name: 'Wallboxen', icon: 'car'},
                waermepumpe: {name: 'Wärmepumpe', icon: 'heatpump'}, warmwasser: {name: 'Warmwasser', icon: 'water'},
                haushalt: {name: 'Haushalt', icon: 'plug'}};

function membersOf(items, key) { return items.filter(x => (x.group || x.id) === key); }

function grouped(items, kind) {
  const order = [];
  for (const it of items) { const k = it.group || it.id; if (!order.includes(k)) order.push(k); }
  return order.map(k => {
    const m = membersOf(items, k);
    if (m.length === 1 && !GROUPS[k]) return m[0];               // stands alone
    const def = GROUPS[k] || {name: m[0].name, icon: m[0].icon};
    return {id: 'g:' + k, name: def.name, icon: def.icon, count: m.length, toggle: k, kind,
            powerW: m.reduce((s, x) => s + x.powerW, 0),
            mode: m.every(x => x.mode === 'delegated') ? 'delegated' : '',
            circuit: m.every(x => x.circuit && x.circuit === m[0].circuit) ? m[0].circuit : ''};
  });
}

// Layout: the house in the middle, all other nodes on a circle around it –
// the sources (PV, grid, battery) on the upper half, the consumers on the
// lower half. Straight lines connect every node with the house. A click on
// a group expands its devices into the circle; only one group is open.
const NODE_R = 30, HOME_R = 36, GAP = 12, MIN_LINE = 40, SCALE = 1.35;
const MODES = {owned: 'von voltibri gesteuert', delegated: 'extern gesteuert', observed: 'nur beobachtet'};
let open = null;      // {key, kind} of the expanded group
let popOpen = false;  // animate the members on the next draw

function expanded(items, kind) {
  return grouped(items, kind).flatMap(it =>
    it.count > 1 && open && open.key === it.toggle && open.kind === kind
      ? membersOf(items, it.toggle).map(m => ({...m, toggle: it.toggle, kind, member: true}))
      : [it]);
}

function layout(st) {
  const P = expanded(st.producers, 'producers');
  const C = expanded(st.consumers, 'consumers').concat([{id:'_rest', name:'Übriges Haus', icon:'house', powerW: st.restW, rest:true}]);
  const S = [...P.map(p => p.id), '_grid', ...(st.hasBattery ? ['_battery'] : [])];
  const N = S.length + C.length;
  const step = 2 * Math.PI / Math.max(N, 4);
  const R = Math.max(HOME_R + NODE_R + MIN_LINE, (2 * NODE_R + GAP) / (2 * Math.sin(step / 2)));
  const pad = NODE_R + 14, W = 2 * (R + pad), H = W;
  const nodes = {_home: {x: W / 2, y: H / 2}}, links = [];
  // sources centred on the top, consumers centred on the bottom
  const arc = (ids, centre, dir) => ids.forEach((id, i) => {
    const a = centre + dir * (i - (ids.length - 1) / 2) * step;
    nodes[id] = {x: W / 2 + R * Math.cos(a), y: H / 2 + R * Math.sin(a), a};
  });
  arc(S, -Math.PI / 2, 1);
  arc(C.map(c => c.id), Math.PI / 2, -1);

  P.forEach(p => links.push({a: p.id, b: '_home', w: p.powerW, color: COLORS.producer}));
  C.forEach(c => links.push({a: '_home', b: c.id, w: c.powerW, color: COLORS.consumer}));
  links.push(st.gridW >= 0 ? {a:'_grid', b:'_home', w: st.gridW, color: COLORS.grid}
                           : {a:'_home', b:'_grid', w: -st.gridW, color: 'var(--export)'});
  if (st.hasBattery)
    links.push(st.batteryW >= 0 ? {a:'_battery', b:'_home', w: st.batteryW, color: COLORS.battery}
                                : {a:'_home', b:'_battery', w: -st.batteryW, color: COLORS.battery});
  return {W, H, R, nodes, links, P, C};
}

// straight line between the rims of two circles
function line(a, ra, b, rb) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  return `M${(a.x + ux * ra).toFixed(1)},${(a.y + uy * ra).toFixed(1)} L${(b.x - ux * rb).toFixed(1)},${(b.y - uy * rb).toFixed(1)}`;
}

// A node shows icon and value inside the circle; the name is only a tooltip.
// count > 1 adds a small bubble with the number of devices.
function node(n, {r, ic, color, value, title, ring, ringColor, extra, count}) {
  let g = `<title>${esc(title)}</title><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="var(--node)" stroke="${color}" stroke-width="2"/>`;
  if (ring !== undefined) { // SoC ring
    const c = 2*Math.PI*(r+4);
    g += `<circle cx="${n.x}" cy="${n.y}" r="${r+4}" fill="none" stroke="var(--track)" stroke-width="3.5"/>` +
         `<circle cx="${n.x}" cy="${n.y}" r="${r+4}" fill="none" stroke="${ringColor || color}" stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="${(c*ring).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${n.x} ${n.y})"/>`;
  }
  const iy = n.y - (extra ? 11 : 7);
  g += icon(ic, n.x, iy, color, extra ? 18 : 20);
  g += `<text x="${n.x}" y="${iy + (extra ? 22 : 24)}" text-anchor="middle" font-size="${r > NODE_R ? 14 : 12.5}" font-weight="600" fill="var(--fg)">${value}</text>`;
  if (extra) g += `<text x="${n.x}" y="${iy + 34}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${extra}</text>`;
  if (count > 1) { // always top right on the rim
    const bx = n.x + r * 0.71, by = n.y - r * 0.71;
    g += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="10" fill="${color}" stroke="var(--card)" stroke-width="2.5"/>` +
         `<text x="${bx.toFixed(1)}" y="${(by + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">${count}</text>`;
  }
  return g;
}

// load of the sub-distribution (or house connection) a node stands for
function circuitLoad(id, st) {
  const c = (st.circuits || []).find(x => x.id === id);
  if (!c || !(c.maxA > 0)) return null;
  const a = Math.max(...c.currentsA);
  return {c, a, u: a / c.maxA, ring: Math.min(1, a / c.maxA), color: a > c.maxA ? 'var(--warn)' : a > 0.9 * c.maxA ? 'var(--solar)' : 'var(--battery)',
    extra: `${Math.round(a)}/${Math.round(c.maxA)} A`,
    text: `${c.name}: ${c.currentsA.map(x => x.toFixed(1).replace('.', ',')).join(' / ')} A von ${Math.round(c.maxA)} A${c.estimated ? ' (teils geschätzt)' : ''}`};
}

function tip(it, st) {
  if (it.rest) return `${it.name} · ohne eigene Messung · ${kw(it.powerW)}`;
  if (it.count > 1) return `${it.name} · ${it.count} Geräte · ${kw(it.powerW)} · klicken zum Aufklappen`;
  const mode = MODES[it.mode] ? MODES[it.mode] + (it.mode === 'owned' && st.dryRun ? ' (Testmodus)' : '') : '';
  return [it.name, mode, kw(it.powerW), it.member ? 'klicken zum Zuklappen' : ''].filter(Boolean).join(' · ');
}

function drawFlow(st) {
  const svg = $('flow');
  const {W, H, R, nodes, links, P, C} = layout(st);
  svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
  svg.style.maxWidth = (W * SCALE).toFixed(0) + 'px'; // same node size for any number of nodes
  const maxW = Math.max(1500, ...links.map(l => l.w));
  const home = nodes._home;
  const rOf = id => id === '_home' ? HOME_R + 4 : (id === '_battery' ? NODE_R + 8 : NODE_R + 4);
  let g = '';
  // the members of an open group are joined by an arc on the circle
  const mem = [...P, ...C].filter(x => x.member).map(x => nodes[x.id].a);
  if (mem.length > 1) {
    const a0 = Math.min(...mem), a1 = Math.max(...mem);
    const pt = a => `${(home.x + R * Math.cos(a)).toFixed(1)},${(home.y + R * Math.sin(a)).toFixed(1)}`;
    const color = open.kind === 'producers' ? COLORS.producer : COLORS.consumer;
    g += `<path class="${popOpen ? 'pop' : ''}" d="M${pt(a0)} A${R.toFixed(1)},${R.toFixed(1)} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${pt(a1)}"
            fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" opacity=".25"/>`;
  }
  for (const l of links) {
    const d = line(nodes[l.a], rOf(l.a), nodes[l.b], rOf(l.b));
    g += `<path class="track" d="${d}"/>`;
    if (l.w > 15) {
      const sw = 2.5 + 5 * Math.min(1, l.w / maxW);
      const dur = Math.max(0.6, 3.2 - 2.6 * Math.min(1, l.w / maxW));
      g += `<path class="flowline" d="${d}" stroke="${l.color}" stroke-width="${sw.toFixed(1)}" style="animation-duration:${dur.toFixed(2)}s"/>`;
    }
  }
  const wrap = (it, inner) => it.count > 1 || it.member
    ? `<g class="tog${it.member && popOpen ? ' pop' : ''}" data-toggle="${esc(it.toggle)}" data-kind="${it.kind}" role="button" tabindex="0"
         aria-expanded="${!!it.member}" aria-label="${esc(it.name)} ${it.member ? 'zuklappen' : 'aufklappen'}">${inner}</g>`
    : `<g>${inner}</g>`;
  P.forEach(p => g += wrap(p, node(nodes[p.id], {r: NODE_R, ic: p.icon || 'solar', color: COLORS.producer,
    value: kw(p.powerW), title: tip(p, st), count: p.count})));
  C.forEach(c => {
    const cl = !c.member && c.circuit ? circuitLoad(c.circuit, st) : null;
    // heat pump: show the COP under the power (from a heat source, e.g. ESPHome)
    const hp = c.icon === 'heatpump' && (st.heat || []).find(h => h.cop != null);
    const extra = cl ? cl.extra : hp ? 'COP ' + hp.cop.toFixed(1).replace('.', ',') : undefined;
    g += wrap(c, node(nodes[c.id], {r: NODE_R, ic: c.icon || 'plug', color: c.rest ? 'var(--muted)' : COLORS.consumer,
      value: kw(c.powerW), title: tip(c, st) + (cl ? ' · ' + cl.text : '') + (hp && hp.thermalW != null ? ` · Wärme ${kw(hp.thermalW)}` : ''), count: c.count,
      ring: cl ? cl.ring : undefined, ringColor: cl ? cl.color : undefined, extra}));
  });
  const gridState = Math.abs(st.gridW) < 15 ? 'ausgeglichen' : (st.gridW > 0 ? 'Bezug' : 'Einspeisung');
  const gl = circuitLoad('grid', st);
  g += `<g>${node(nodes._grid, {r: NODE_R, ic: 'grid', color: st.gridW >= 0 ? COLORS.grid : 'var(--export)',
    value: kw(Math.abs(st.gridW)), title: `Netz · ${gridState} · ${kw(Math.abs(st.gridW))}` + (gl ? ` · ${gl.text}` : ''),
    ring: gl ? gl.ring : undefined, ringColor: gl ? gl.color : undefined, extra: gl ? gl.extra : undefined})}</g>`;
  if (st.hasBattery) {
    const batState = Math.abs(st.batteryW) < 15 ? 'Ruhe' : (st.batteryW < 0 ? 'lädt' : 'entlädt');
    g += `<g>${node(nodes._battery, {r: NODE_R, ic: 'battery', color: COLORS.battery, value: kw(Math.abs(st.batteryW)),
      ring: st.soc, extra: pct(st.soc), title: `Batterie ${pct(st.soc)} · ${batState} · ${kw(Math.abs(st.batteryW))}`})}</g>`;
  }
  g += `<g>${node(home, {r: HOME_R, ic: 'house', color: COLORS.home, value: kw(st.loadW), title: `Hausverbrauch · ${kw(st.loadW)}`})}</g>`;
  svg.innerHTML = g;
  popOpen = false;
}

// click on a group expands it (and closes any other), click on one of its
// devices or on the background closes it again
function toggleGroup(e) {
  if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[data-toggle]');
  if (!t && !open) return;
  e.preventDefault();
  const same = t && open && open.key === t.dataset.toggle && open.kind === t.dataset.kind;
  open = t && !same ? {key: t.dataset.toggle, kind: t.dataset.kind} : null;
  popOpen = !!open;
  if (window._last) drawFlow(window._last);
  if (t && e.type === 'keydown') { // keep keyboard focus on the toggled group
    const f = $('flow').querySelector(`[data-toggle="${CSS.escape(t.dataset.toggle)}"]`);
    if (f) f.focus();
  }
}
$('flow').addEventListener('click', toggleGroup);
$('flow').addEventListener('keydown', toggleGroup);

// --- charging panel ---

const MODE_HELP = {off: 'Wallbox gesperrt – es wird nicht geladen.',
  pv: 'Nur mit PV-Überschuss laden.', minpv: 'Immer mit Mindestleistung, mehr bei Überschuss.',

  external: 'Ein anderes System steuert (z. B. Neogrid). voltibri sperrt, gibt frei und regelt nichts, protokolliert nur.',
  fast: 'Mit maximaler Leistung laden.'};

const lastSmart = id => { try { const m = localStorage.getItem('voltibri.smart.' + id); return SMART.includes(m) ? m : 'pv'; } catch (e) { return 'pv'; } };
let smartOpen = null; // loadpoint whose strategy menu is open

  forceBattery: 'Batterie lädt weiter wie ohne Gast (eigener Zähler)'};
// which charge modes keep the home battery out of EV charging
const DAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
let charging = null;
const money = (ct, cur) => (ct / 100).toLocaleString('de-DE', {style: 'currency', currency: cur || 'EUR'});
const kwh = wh => (wh / 1000).toLocaleString('de-DE', {maximumFractionDigits: 1}) + ' kWh';
const hm = t => new Date(t).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
const dayhm = t => new Date(t).toLocaleString('de-DE', {weekday: 'short', hour: '2-digit', minute: '2-digit'});

async function send(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || e.message || ('Fehler ' + r.status)); return false; }
  await refreshCharging(true);
  return true;
}
const vehicleOf = key => (charging.vehicles || []).find(v => v.key === key);

function planText(p) {
  const soc = Math.round(p.soc * 100) + ' %';
  if (p.days && p.days.length) return `${soc} um ${p.time} · ${p.days.map(d => DAYS[d]).join(', ')}`;
  return `${soc} bis ${new Date(p.at).toLocaleString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}`;
}

function renderLoadpoint(lp) {
  const veh = vehicleOf(lp.vehicle);
  const guest = lp.vehicle === 'guest';
  // another user's car: only "belegt" and the power, no control
  const canEdit = charging.local && !lp.foreign;
  const status = !lp.connected ? 'frei' : lp.foreign ? 'belegt' : lp.charging ? 'lädt' : 'angesteckt';
  const opts = [`<option value="">Automatisch${lp.connected && !lp.manual ? ' (' + esc(lp.vehicleName) + ')' : ''}</option>`,
    `<option value="guest"${lp.manual && guest ? ' selected' : ''}>Gastfahrzeug</option>`,
    ...(charging.vehicles || []).map(v => `<option value="${esc(v.key)}"${lp.manual && lp.vehicle === v.key ? ' selected' : ''}>${esc(v.name)}</option>`)];
  let soc = '';
  if (veh && veh.soc != null) {
    soc = `<div><div class="socbar"><i style="width:${(veh.soc * 100).toFixed(0)}%"></i>${veh.limitSoc != null ? `<b style="left:${(veh.limitSoc * 100).toFixed(0)}%" title="Ladelimit im Auto"></b>` : ''}</div>
      <div class="socline"><span>${pct(veh.soc)}${veh.rangeKm != null ? ' · ' + Math.round(veh.rangeKm) + ' km' : ''}</span>
      <span>${veh.limitSoc != null ? 'Limit ' + pct(veh.limitSoc) : ''}</span></div></div>`;
  }
  // without a car only "Aus" (the wallbox switched off) is a state to show
  const mode = lp.connected ? lp.mode : (lp.off ? 'off' : '');
  // Aus | Smart ▾ | Schnell – the Smart part remembers the last strategy
  // "Aus" works anytime; the others need a car – or switch the wallbox on again
  const dis = !canEdit || (!lp.connected && !lp.off) ? ' disabled' : '';
  const smart = SMART.includes(mode) ? mode : lastSmart(lp.id);
  const menu = smartOpen === lp.id ? `<div class="smartmenu" role="menu">${SMART.map(m => {
      const na = m === 'pv1' && !lp.canSwitch && lp.phases !== 1;
      return `<button role="menuitemradio" aria-checked="${m === mode}" data-mode="${m}"${na ? ' disabled' : ''}>
        <b>${MODE_LABEL[m]}</b><span>${esc(na ? 'Nicht verfügbar: die Wallbox kann nicht auf eine Phase umschalten (oder wird nicht gesteuert).' : MODE_HELP[m])}</span></button>`;
    }).join('')}</div>` : '';
  const modeBtns = `<button data-mode="off" class="${mode === 'off' ? 'sel' : ''}" title="${esc(MODE_HELP.off)}"${canEdit ? '' : ' disabled'}>Aus</button>
    <span class="split${SMART.includes(mode) ? ' sel' : ''}"><button data-mode="${smart}" title="${esc(MODE_HELP[smart])}"${dis}>Smart <small>${MODE_LABEL[smart]}</small></button><button class="caret" data-smartmenu aria-haspopup="menu" aria-expanded="${smartOpen === lp.id}" aria-label="Strategie wählen"${dis}>▾</button></span>
    <button data-mode="fast" class="${mode === 'fast' ? 'sel' : ''}" title="${esc(MODE_HELP.fast)}"${dis}>Schnell</button>${menu}`;
  let plan = '';
  if (veh) {
    const s = veh.settings, sch = lp.plan;
    plan = `<div class="planbox"><div class="ttl">Ladeplan</div>
      ${sch ? `<div class="why">${esc(sch.reason)}${sch.slots && sch.slots.length ? ` · Start ${dayhm(sch.start)}, ${kwh(sch.needWh)}${sch.costCt ? ', ca. ' + money(sch.costCt, charging.currency) : ''}` : ''}</div>` : ''}
      ${(s.plans || []).length ? `<ul class="plans">${s.plans.map(p => `<li><span>${esc(planText(p))}</span>${canEdit ? `<button class="linkbtn" data-delplan="${esc(p.id)}">entfernen</button>` : ''}</li>`).join('')}</ul>` : '<div class="why">Kein Plan. Ein Plan lädt das Auto bis zur Abfahrt auf den Ziel-Ladestand (in PV und Min+PV).</div>'}
      ${!s.capacityWh ? '<div class="note">Für Pläne die Akkukapazität beim Fahrzeug eintragen.</div>' : ''}
      ${canEdit ? `<form class="vrow planform" data-veh="${esc(veh.key)}">
        <input type="number" name="soc" min="10" max="100" step="5" value="80" style="width:64px" aria-label="Ziel-Ladestand in Prozent"> %
        <input type="time" name="time" value="07:00" required aria-label="Uhrzeit">
        <span class="days">${DAYS.map((d, i) => `<label>${d}<input type="checkbox" name="d${i}"></label>`).join('')}</span>
        <button class="btn" type="submit">Plan hinzufügen</button></form>
        <div class="why" style="font-size:11px">Ohne Wochentage gilt der Plan einmalig zum nächsten Zeitpunkt.</div>` : ''}
    </div>`;
  }
  const s = lp.session;
  const sess = s ? `<div class="sess"><span>Dieser Ladevorgang <b>${kwh(s.energyWh)}</b></span>
      <span>PV/Akku <b>${s.energyWh > 0 ? Math.round(100 * (s.pvWh + s.batteryWh) / s.energyWh) : 0} %</b></span>
      <span>${guest ? 'Verrechnung' : 'Kosten'} <b>${money(s.costCt, charging.currency)}</b></span></div>` : '';
  const who = (lp.connected ? esc(lp.vehicleName) : 'kein Fahrzeug') +
    (lp.card ? ` <span class="pill" title="Ladekarte dieses Ladevorgangs">${iconSVG('device', 11)} ${esc(lp.card)}</span>` : '') +
    (lp.connected && lp.sessionMode ? ' <span class="pill" title="Gilt nur für diesen Ladevorgang, bis zum Abstecken">nur jetzt</span>' : '');
  return `<div class="lp" data-lp="${esc(lp.id)}">
    <div class="lphead"><h3>${esc(lp.name)}</h3><span class="pw">${lp.connected ? kw(lp.powerW) : ''}</span></div>
    <div class="lpsub"><span class="pill${lp.charging ? ' on' : ''}">${status}</span>
      ${lp.batteryExcluded ? '<span class="pill" title="Die Hausbatterie wird für diesen Ladevorgang zurückgehalten – Laden aus PV und Netz.">ohne Hausbatterie</span>' : ''}
      ${!lp.owned ? '<span class="pill" title="voltibri schreibt nicht auf diese Wallbox (Modus „observed“) und zeigt nur, was es tun würde.">beobachtet</span>' : ''}<span>${who}</span></div>
    ${soc}
    <div class="modes" role="group" aria-label="Lademodus">${modeBtns}</div>
    ${lp.connected ? `<div class="why">${esc(lp.reason)}</div>` : ''}
    ${sess}
    ${lp.connected || veh ? `<details class="more" data-k="lp:${esc(lp.id)}"><summary>Fahrzeug &amp; Ladeplan</summary><div>
      ${lp.connected && !lp.foreign ? `<div class="vrow"><select data-vehsel aria-label="Fahrzeug" ${canEdit ? '' : 'disabled'}>${opts.join('')}</select>
        ${guest && !lp.detecting ? `<span class="why">${esc(GUEST_POLICY[lp.guestPolicy] || '')}</span>` : ''}</div>` : ''}
      ${plan}</div></details>` : ''}
  </div>`;
}

function renderVehicles() {
  const prov = charging.providers || [];
  const vs = charging.vehicles || [];
  // vehicle drivers that are not configured yet can be connected from here
  const configured = new Set(prov.map(p => p.type));
  const connect = charging.admin ? voltibri.drivers().filter(d => d.category === 'vehicle' && !configured.has(d.type)) : [];
  if (!prov.length && !vs.length) {
    if (!connect.length) return '';
    return `<div class="note">Ladestand und Abfahrtszeiten kommen aus einem Fahrzeugkonto.
      ${connect.map(d => `<button type="button" class="btn primary" data-setup-new="${esc(d.type)}">${esc(d.name.replace(/ \(.*\)$/, ''))} verbinden</button>`).join(' ')}</div>`;
  }
  const login = prov.map(p => {
    const edit = charging.admin ? ` <button type="button" class="linkbtn" data-setup-edit="${esc(p.id)}">Zugangsdaten ändern</button>` : '';
    if (!p.needsLogin || p.authorized) return `<div class="note">${esc(p.name)}: verbunden, ${p.vehicles} Fahrzeug${p.vehicles === 1 ? '' : 'e'}.${edit}</div>`;
    return `<div class="note">${esc(p.name)}: noch nicht angemeldet. ${charging.local ? `<a class="btn primary" href="api/oauth/${encodeURIComponent(p.id)}/login">Bei ${esc(p.name)} anmelden</a>` : 'Anmeldung nur vom lokalen Rechner.'}${edit}</div>`;
  }).join('');
  const rows = vs.map(v => `<tr data-veh="${esc(v.key)}">
      <td>${esc(v.name)}<div class="why" style="font-size:11px">${esc([[v.info.brand, v.info.model].filter(Boolean).join(' '), v.settings.capacityWh ? kwh(v.settings.capacityWh) : '',
        batKey(v.settings.noBatteryModes) !== 'allow' ? 'Hausbatterie ' + BAT_OPTS[batKey(v.settings.noBatteryModes)].label : ''].filter(Boolean).join(' · '))}</div></td>
      <td class="r">${v.soc != null ? pct(v.soc) : '–'}</td>
      <td>${v.charging ? 'lädt' : v.connected ? 'angesteckt' : 'unterwegs/frei'}</td>
      <td><select data-vmode ${charging.local ? '' : 'disabled'}>${Object.keys(MODE_LABEL).map(m => `<option value="${m}"${m === v.settings.mode ? ' selected' : ''}>${MODE_LABEL[m]}</option>`).join('')}</select></td>
    </tr>`).join('');
  const needLogin = prov.some(p => p.needsLogin && !p.authorized);
  return `<details class="more" data-k="veh"${needLogin ? ' open' : ''}><summary>Fahrzeuge (${vs.length})</summary><div>${login}
    ${vs.length ? `<div class="tablewrap"><table class="list"><thead><tr><th>Fahrzeug</th><th class="r">Ladestand</th><th>Status</th><th>Standardmodus</th></tr></thead><tbody>${rows}</tbody></table></div>` :
      (prov.some(p => p.authorized) ? '<div class="why">Keine Fahrzeuge gefunden. Ist das Auto in der Tibber-App verbunden?</div>' : '')}</div></details>`;
}

// re-rendering every 5 s must not close what the user opened
const openDetails = new Set();
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.k) d.open ? openDetails.add(d.dataset.k) : openDetails.delete(d.dataset.k);
}, true);
function restoreDetails(root) {
  root.querySelectorAll('details[data-k]').forEach(d => { if (openDetails.has(d.dataset.k)) d.open = true; });
}

async function refreshCharging(force) {
  const box = $('laden');
  if (!force && box.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName)) return; // user is editing
  try {
    charging = await fetch('api/charging').then(r => r.json());
  } catch (e) { return; }
  box.hidden = !charging.loadpoints.length && !charging.providers.length;
  if (box.hidden && document.body.classList.contains('restricted')) { // a user without wallboxes
    box.hidden = false;
    $('lps').innerHTML = '<div class="note">Für dich ist noch keine Wallbox freigegeben. Ein Administrator kann dich einer Gruppe zuordnen.</div>';
    return;
  }
  if (box.hidden) return;
  $('ltariff').textContent = [charging.gridCt != null ? 'Netz ' + charging.gridCt.toFixed(1).replace('.', ',') + ' ct' : '',
    charging.feedinCt != null ? 'Einspeisung ' + charging.feedinCt.toFixed(1).replace('.', ',') + ' ct' : ''].filter(Boolean).join(' · ');
  $('lps').innerHTML = charging.loadpoints.map(renderLoadpoint).join('');
  $('lveh').innerHTML = renderVehicles();
  restoreDetails(box);
}
function vehicleSettings(key) { return JSON.parse(JSON.stringify(vehicleOf(key).settings)); }

$('laden').addEventListener('click', async e => {
  const caret = e.target.closest('[data-smartmenu]');
  if (caret && !caret.disabled) {
    const id = caret.closest('[data-lp]').dataset.lp;
    smartOpen = smartOpen === id ? null : id;
    $('lps').innerHTML = charging.loadpoints.map(renderLoadpoint).join('');
    restoreDetails($('laden'));
    return;
  }
  const mb = e.target.closest('[data-mode]');
  if (mb && !mb.disabled) {
    if (SMART.includes(mb.dataset.mode)) { try { localStorage.setItem('voltibri.smart.' + mb.closest('[data-lp]').dataset.lp, mb.dataset.mode); } catch (err) {} }
    smartOpen = null;
    const lp = charging.loadpoints.find(l => l.id === mb.closest('[data-lp]').dataset.lp);
    const url = `api/loadpoints/${encodeURIComponent(lp.id)}/off`;
    // Aus is a setting of the wallbox (wins over every vehicle); the others switch it on again
    if (mb.dataset.mode === 'off') { await send('PUT', url, {off: true}); return; }
    if (lp.off) { const ok = await send('PUT', url, {off: false}); if (!ok || !lp.connected) return; }
    // the buttons choose the mode of this charging session (until unplugged);
    // a vehicle's default mode is set under "Fahrzeuge"
    await send('PUT', `api/loadpoints/${encodeURIComponent(lp.id)}/mode`, {mode: mb.dataset.mode});
    return;
  }
  const del = e.target.closest('[data-delplan]');
  if (del) {
    const key = del.closest('[data-lp]') && charging.loadpoints.find(l => l.id === del.closest('[data-lp]').dataset.lp).vehicle;
    const s = vehicleSettings(key);
    s.plans = (s.plans || []).filter(p => p.id !== del.dataset.delplan);
    await send('PUT', 'api/vehicles/' + key, s);
  }
});
$('laden').addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('[data-vehsel]')) {
    await send('PUT', `api/loadpoints/${encodeURIComponent(t.closest('[data-lp]').dataset.lp)}/vehicle`, {vehicle: t.value});
    return;
  }
  const row = t.closest('tr[data-veh]');
  if (row) {
    const s = vehicleSettings(row.dataset.veh);
    if (t.matches('[data-vmode]')) s.mode = t.value;
    await send('PUT', 'api/vehicles/' + row.dataset.veh, s);
  }
});
$('laden').addEventListener('submit', async e => {
  if (!e.target.matches('.planform')) return;
  e.preventDefault();
  const f = e.target, key = f.dataset.veh, s = vehicleSettings(key);
  const days = DAYS.map((_, i) => f.elements['d' + i].checked ? i : -1).filter(i => i >= 0);
  const soc = Math.min(100, Math.max(1, parseInt(f.elements.soc.value, 10))) / 100, time = f.elements.time.value;
  const plan = {soc};
  if (days.length) { plan.days = days; plan.time = time; }
  else { // next occurrence of that time
    const [h, m] = time.split(':').map(Number), at = new Date(); at.setHours(h, m, 0, 0);
    if (at <= new Date()) at.setDate(at.getDate() + 1);
    plan.at = at.toISOString();
  }
  s.plans = (s.plans || []).concat([plan]);
  await send('PUT', 'api/vehicles/' + key, s);
});
(() => { // result of an OAuth login

topbar('overview');
// big number with a small unit: "4,2 kW" -> 4,2<small>kW</small>
const big = s => { const m = String(s).match(/^(.*?)\s*(kWh|kW|W|%)$/); return m ? `${esc(m[1])}<small>${m[2]}</small>` : esc(s); };
const PLAN_TITLE = {delay: 'Spät laden', immediate: 'Sofort laden', night: 'Für die Nacht laden', 'no-data': 'Zu wenig Daten'};

// day totals (autarky, PV, forecast for the rest of the day), once a minute
let todayAt = 0;
async function refreshToday() {
  if (Date.now() - todayAt < 60000) return;
  todayAt = Date.now();
  const t = await fetch('api/today').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!t) return;
  const kwhBig = wh => big((wh / 1000).toLocaleString('de-DE', {maximumFractionDigits: wh >= 10000 ? 0 : 1}) + ' kWh');
  const since = t.covered ? '' : ' seit ' + hm(t.since);
  $('tAut').innerHTML = t.autarky != null ? big(pct(t.autarky)) : '–';
  $('tAutSub').textContent = t.loadWh > 0 ? kwh(t.gridImportWh) + ' aus dem Netz' + since : 'noch keine Daten';
  $('tPV').innerHTML = kwhBig(t.pvWh);
  $('tPVSub').textContent = t.selfUse != null ? pct(t.selfUse) + ' selbst genutzt' + since : since.trim();
  $('tRest').innerHTML = kwhBig(t.forecastRestWh);
}

// heat pump card (heat output and COP from a heat source, e.g. ESPHome)
function renderHeat(st) {
  const hs = st.heat || [];
  $('heat').hidden = !hs.length;
  if (!hs.length) return;
  const h = hs[0];
  const t = v => v == null ? '–' : v.toFixed(1).replace('.', ',') + ' °C';
  const spread = h.flowC != null && h.returnC != null ? 'Spreizung ' + (h.flowC - h.returnC).toFixed(1).replace('.', ',') + ' K' : '';
  $('hState').textContent = h.error ? 'keine Daten' : (h.state || '–');
  $('heatBody').innerHTML = `<div class="heatgrid">
    <div><div class="eyebrow">Wärmeleistung</div><div class="big num">${h.thermalW != null ? big(kw(Math.max(0, h.thermalW))) : '–'}</div>
      <div class="sub">${h.electricW != null ? 'Verdichter ' + kw(h.electricW) : ''}</div></div>
    <div><div class="eyebrow">COP</div><div class="big num">${h.cop != null ? h.cop.toFixed(1).replace('.', ',') : '–'}</div><div class="sub">gemittelt über 5 min</div></div>
    <div><div class="eyebrow">Vorlauf / Rücklauf</div><div class="big num" style="font-size:22px">${t(h.flowC)} / ${t(h.returnC)}</div><div class="sub">${spread}</div></div>
    <div><div class="eyebrow">Außen · Warmwasser</div><div class="big num" style="font-size:22px">${t(h.outdoorC)} · ${t(h.hotWaterC)}</div></div>
  </div>${h.error ? `<p class="note" style="margin-top:10px">${esc(h.error)}</p>` : ''}`;
}

async function refresh() {
  const me = await voltibri.me;
  if (me && !me.overview) { // only the wallboxes
    document.body.classList.add('restricted');
    $('allRuns').hidden = !me.reports;
    refreshCharging();
    return;
  }
  try {
    const [st, plan, hist] = await Promise.all([fetch('api/state').then(r => r.json()), fetch('api/plan').then(r => r.json()),
      loadHistory()]);
    drawFlow(st);
    renderHeat(st);
    refreshToday();
    $('bTitle').textContent = PLAN_TITLE[plan.mode] || modes[plan.mode] || 'Ladeplanung';
    $('limit').innerHTML = 'Ladegrenze <b>' + esc(!st.controlled ? 'nur Empfehlung' : (st.chargeLimitW < 0 ? 'keine' : kw(st.chargeLimitW))) + '</b>';
    $('discharge').hidden = !(st.dischargeLimitW >= 0);
    $('discharge').innerHTML = 'Entladung max. <b>' + kw(st.dischargeLimitW || 0) + '</b>';
    $('discharge').title = (st.excluded || []).length ? 'Ohne Hausbatterie: ' + st.excluded.join(', ') + (st.controlled ? '' : ' (nur Empfehlung – Batterie nicht gesteuert)') : '';
    $('target').innerHTML = 'Ziel am Abend <b>' + (plan.targetSoC ? pct(plan.targetSoC) : '–') + '</b>';
    $('discharge').hidden = !(st.dischargeLimitW >= 0);
    $('discharge').innerHTML = 'Entladung max. <b>' + kw(st.dischargeLimitW || 0) + '</b>';
    $('discharge').title = (st.excluded || []).length ? 'Ohne Hausbatterie: ' + st.excluded.join(', ') + (st.controlled ? '' : ' (nur Empfehlung – Batterie nicht gesteuert)') : '';
    $('hstatus').innerHTML = (st.dryRun ? '<span class="badge warn" title="voltibri schreibt nichts auf Geräte, sondern protokolliert nur">Testmodus</span>' : '') +
      `<span class="live" title="letzte Messung">${new Date(st.time).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit', second: '2-digit'})}</span>`;
    $('errors').textContent = (st.errors || []).join(' · ');
    $('reasons').innerHTML = (plan.reasons || []).map(r => `<li>${esc(r)}</li>`).join('');
    drawChart(plan.slots || [], hist || []);
    window._last = st;
    refreshCharging();
  } catch (e) {
    $('errors').textContent = 'Keine Verbindung zu voltibri: ' + e;
    const l = document.querySelector('.live');
    if (l) l.classList.add('off');
  }
}

// Chart ranges: [from, to] in ms. Past slots show measured values (solid)
// and the plan of that day (dashed, muted); the future shows the plan.
const SLOT_MS = 15 * 60 * 1000;
let range = 'today';
try { range = localStorage.getItem('chartRange') || 'today'; } catch (e) {}
function rangeWindow(r, now = Date.now()) {
  const day = off => { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d.getTime(); };
  switch (r) {
    case 'yesterday': return [day(-1), day(0)];
    case 'tomorrow': return [day(1), day(2)];
    case '48h': return [now - 3 * 3600e3, now + 48 * 3600e3];
    default: return [day(0), day(1)];
  }
}
function setRange(r) {
  range = r;
  try { localStorage.setItem('chartRange', r); } catch (e) {}
  document.querySelectorAll('#range [data-range]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.range === r)));
}
setRange(range);
$('range').addEventListener('click', e => {
  const b = e.target.closest('[data-range]');
  if (b) { setRange(b.dataset.range); refresh(); }
});
async function loadHistory() {
  const [from, to] = rangeWindow(range);
  const now = Date.now();
  if (from >= now) return [];
  const q = `from=${encodeURIComponent(new Date(from).toISOString().replace(/\.\d+Z$/, 'Z'))}&to=${encodeURIComponent(new Date(Math.min(to, now)).toISOString().replace(/\.\d+Z$/, 'Z'))}`;
  return fetch('api/history?' + q).then(r => r.ok ? r.json() : []).catch(() => []);
}

function drawChart(planSlots, hist) {
  const svg = $('chart'), W = 960, H = 300, L = 44, R = 44, T = 24, B = 26;
  const ts = s => new Date(s.start).getTime();
  const now = Date.now();
  const [t0, t1] = rangeWindow(range, now);
  const slots = planSlots.filter(s => ts(s) + SLOT_MS > Math.max(t0, now) && ts(s) < t1);
  hist = hist.filter(s => ts(s) >= t0 && ts(s) < Math.min(t1, now));
  if (!slots.length && !hist.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="14" fill="var(--muted)">${range === 'tomorrow' ? 'Für morgen gibt es noch keine Prognose.' : 'Für diesen Zeitraum liegen keine Daten vor.'}</text>`;
    return;
  }
  const x = t => L + (W-L-R) * (t - t0) / (t1 - t0);
  const v = (s, k) => s[k] == null ? NaN : s[k];
  const maxW = Math.max(1000, ...slots.map(s => Math.max(s.pvW, s.loadW)),
    ...hist.map(s => Math.max(v(s, 'pvW') || 0, v(s, 'loadW') || 0, v(s, 'planPvW') || 0, v(s, 'planLoadW') || 0)));
  const y = w => T + (H-T-B) * (1 - w/maxW), ys = q => T + (H-T-B) * (1 - q);
  const fmt = q => (q/1000).toFixed(1).replace('.', ',');
  let g = '';
  // past (measured) background
  const xp = Math.min(Math.max(x(now), L), W - R);
  if (xp > L) g += `<rect x="${L}" y="${T}" width="${(xp - L).toFixed(1)}" height="${H-T-B}" fill="var(--track)" opacity=".45"/>`;
  // charging allowed (future only): adjacent slots merged into one band
  const bands = [];
  slots.forEach(s => { if (s.chargeLimitW !== 0 && s.pvW > s.loadW) {
    const a = Math.max(ts(s), now), b = Math.min(ts(s) + SLOT_MS, t1), last = bands[bands.length - 1];
    if (b <= a) return;
    if (last && last[1] >= a) last[1] = b; else bands.push([a, b]);
  } });
  bands.forEach(([a, b]) => g += `<rect x="${x(a).toFixed(1)}" y="${T}" width="${(x(b) - x(a)).toFixed(1)}" height="${H-T-B}" fill="var(--limit)"/>`);
  for (let k = 0; k <= 4; k++) { const w = maxW*k/4;
    g += `<line x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}" stroke="var(--line)"/>` +
         `<text x="${L-6}" y="${ys(k/4)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${k*25} %</text>` +
         `<text x="${W-R+6}" y="${y(w)+4}" font-size="11" fill="var(--muted)">${fmt(w)}</text>`; }  // left: SoC, right: kW
  // hour ticks (every 3 h for one day, 6 h otherwise), day boundaries
  const step = t1 - t0 <= 26 * 3600e3 ? 3 : 6;
  const d = new Date(t0); d.setMinutes(0, 0, 0); if (d.getTime() < t0) d.setHours(d.getHours() + 1);
  for (; d.getTime() <= t1; d.setHours(d.getHours() + 1)) {
    const h = d.getHours(), xt = x(d.getTime()).toFixed(1);
    if (h === 0 && d.getTime() > t0 && d.getTime() < t1) {
      g += `<line x1="${xt}" x2="${xt}" y1="${T - 14}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".7"/>` +
           `<text x="${(+xt + 5).toFixed(1)}" y="${T - 4}" font-size="11" font-weight="600" fill="var(--muted)">${d.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'})}</text>`;
    }
    if (h % step === 0) g += `<text x="${xt}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${h}:00</text>`;
  }
  // a line through the slot centres; gaps (unknown values) break the line
  const path = (rows, f, sc) => {
    let p = '', on = false;
    for (const s of rows) {
      const q = f(s);
      if (q == null || Number.isNaN(q)) { on = false; continue; }
      p += (on ? 'L' : 'M') + x(ts(s) + SLOT_MS / 2).toFixed(1) + ',' + sc(q).toFixed(1);
      on = true;
    }
    return p;
  };
  const line = (d, color, w, extra = '') => d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${extra}/>` : '';
  const planned = ' stroke-dasharray="5 4" opacity=".55"';
  // past: the day's plan (dashed, muted) ...
  g += line(path(hist, s => v(s, 'planPvW'), y), 'var(--solar)', 1.6, planned);
  g += line(path(hist, s => v(s, 'planLoadW'), y), 'var(--home)', 1.6, planned);
  g += line(path(hist, s => v(s, 'planSoC'), ys), 'var(--battery)', 1.8, planned);
  // ... and what was measured, continued by the plan for the future
  const join = slots.length ? [{start: slots[0].start, pvW: slots[0].pvW, loadW: slots[0].loadW, soc: slots[0].expectedSoC}] : [];
  const past = hist.concat(hist.length ? join : []);
  g += line(path(past, s => v(s, 'pvW'), y), 'var(--solar)', 2);
  g += line(path(past, s => v(s, 'loadW'), y), 'var(--home)', 2);
  g += line(path(past, s => v(s, 'soc'), ys), 'var(--battery)', 2.5);
  if (slots.length) {
    g += line(path(slots, s => s.pvW, y), 'var(--solar)', 2);
    if (slots.some(s => s.loadW > 0)) g += line(path(slots, s => s.loadW, y), 'var(--home)', 2);
    if (slots.some(s => s.expectedSoC > 0)) g += line(path(slots, s => s.expectedSoC, ys), 'var(--battery)', 2.5);
  }
  // now marker
  if (now > t0 && now < t1) {
    const xn = x(now).toFixed(1);
    g += `<line x1="${xn}" x2="${xn}" y1="${T - 14}" y2="${H-B}" stroke="var(--fg)" stroke-width="1.5"/>` +
         `<text x="${(+xn - 5).toFixed(1)}" y="${T - 4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--fg)">jetzt</text>`;
  }
  svg.innerHTML = g;
}


// setup dialog (common.js) entry points in the charging panel
voltibri.ready.then(() => charging && refreshCharging(true));
$('laden').addEventListener('click', e => {
  const n = e.target.closest('[data-setup-new]');
  if (n) voltibri.open({type: n.dataset.setupNew, onDone: () => refreshCharging(true)});
  const ed = e.target.closest('[data-setup-edit]');
  if (ed) voltibri.open({id: ed.dataset.setupEdit, onDone: () => refreshCharging(true)});
});

// a click outside closes the strategy menu
document.addEventListener('click', e => {
  if (smartOpen && !e.target.closest('.modes')) { smartOpen = null; refreshCharging(true); }
});

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => window._last && drawFlow(window._last), 150); });
refresh(); setInterval(refresh, 5000);
</script>

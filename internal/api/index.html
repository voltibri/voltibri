<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voltibri</title>
<style>
  :root { --bg:#f7f8f6; --card:#fff; --fg:#1d2420; --muted:#66706a; --line:#e3e6e2;
          --pv:#e0a100; --load:#4a6fa5; --soc:#2e9e6a; --limit:rgba(46,158,106,.14); --warn:#b54a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141816; --card:#1d2220; --fg:#e7ebe8; --muted:#97a19b; --line:#2c3330;
          --pv:#f0b92c; --load:#7c9fd4; --soc:#4cc68d; --limit:rgba(76,198,141,.16); --warn:#e07a5a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:18px 0; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .tile .k { color:var(--muted); font-size:12px; }
  .tile .v { font-size:22px; font-variant-numeric:tabular-nums; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  ul { margin:0; padding-left:18px; }
  svg { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:5px; }
  .err { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>voltibri</h1><span class="sub">smart self-consumption optimizer</span>
    <span class="badge" id="mode">…</span><span class="badge" id="dry" hidden>Testmodus (dry-run)</span>
  </header>
  <div class="tiles">
    <div class="tile"><div class="k">PV</div><div class="v" id="pv">–</div></div>
    <div class="tile"><div class="k">Hausverbrauch</div><div class="v" id="load">–</div></div>
    <div class="tile"><div class="k">Netz</div><div class="v" id="grid">–</div></div>
    <div class="tile"><div class="k">Batterie</div><div class="v" id="soc">–</div></div>
    <div class="tile"><div class="k">Ladegrenze</div><div class="v" id="limit">–</div></div>
    <div class="tile"><div class="k">Ziel am Abend</div><div class="v" id="target">–</div></div>
  </div>
  <div class="err" id="errors"></div>
  <section><h2>Warum?</h2><ul id="reasons"></ul></section>
  <section>
    <h2>Plan (48 h)</h2>
    <svg id="chart" viewBox="0 0 960 300" role="img" aria-label="Plan"></svg>
    <div class="legend">
      <span><i style="background:var(--pv)"></i>PV-Prognose</span>
      <span><i style="background:var(--load)"></i>Lastprognose</span>
      <span><i style="background:var(--soc)"></i>erwarteter Ladestand</span>
      <span><i style="background:var(--limit);height:10px"></i>Laden erlaubt</span>
    </div>
  </section>
</main>
<script>
const kw = w => (Math.abs(w) >= 1000 ? (w/1000).toFixed(1) + ' kW' : Math.round(w) + ' W');
const pct = v => Math.round(v*100) + ' %';
const $ = id => document.getElementById(id);
const modes = {delay:'spät laden', immediate:'sofort laden', night:'Nacht', 'no-data':'zu wenig Daten'};

async function refresh() {
  try {
    const [st, plan] = await Promise.all([fetch('api/state').then(r=>r.json()), fetch('api/plan').then(r=>r.json())]);
    $('pv').textContent = kw(st.pvW);
    $('load').textContent = kw(st.loadW);
    $('grid').textContent = (st.gridW >= 0 ? '↓ ' : '↑ ') + kw(Math.abs(st.gridW));
    $('soc').textContent = pct(st.soc) + ' · ' + (st.batteryW < 0 ? '+' : '−') + kw(Math.abs(st.batteryW));
    $('limit').textContent = st.controlled ? (st.chargeLimitW < 0 ? 'keine' : kw(st.chargeLimitW)) : 'nur Empfehlung';
    $('target').textContent = plan.targetSoC ? pct(plan.targetSoC) : '–';
    $('dry').hidden = !st.dryRun;
    $('mode').textContent = modes[plan.mode] || plan.mode;
    $('errors').textContent = (st.errors || []).join(' · ');
    $('reasons').innerHTML = '';
    for (const r of plan.reasons || []) { const li = document.createElement('li'); li.textContent = r; $('reasons').appendChild(li); }
    draw(plan.slots || []);
  } catch (e) { $('errors').textContent = 'Keine Verbindung: ' + e; }
}

function draw(slots) {
  const svg = $('chart'), W = 960, H = 300, L = 44, R = 40, T = 10, B = 26;
  if (!slots.length) { svg.innerHTML = ''; return; }
  const n = slots.length, x = i => L + (W-L-R) * i / n;
  const maxW = Math.max(1000, ...slots.map(s => Math.max(s.pvW, s.loadW)));
  const y = w => T + (H-T-B) * (1 - w/maxW), ys = v => T + (H-T-B) * (1 - v);
  let g = '';
  slots.forEach((s, i) => { if (s.chargeLimitW !== 0 && s.pvW > s.loadW)
    g += `<rect x="${x(i)}" y="${T}" width="${x(i+1)-x(i)+.5}" height="${H-T-B}" fill="var(--limit)"/>`; });
  for (let k = 0; k <= 4; k++) { const v = maxW*k/4;
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>` +
         `<text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v/1000).toFixed(1)}</text>` +
         `<text x="${W-R+6}" y="${ys(k/4)+4}" font-size="11" fill="var(--muted)">${k*25}%</text>`; }
  slots.forEach((s, i) => { const d = new Date(s.start);
    if (d.getMinutes() === 0 && d.getHours() % 6 === 0)
      g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.getHours()}:00</text>`; });
  const path = (f, sc) => slots.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + sc(f(s)).toFixed(1)).join('');
  g += `<path d="${path(s=>s.pvW, y)}" fill="none" stroke="var(--pv)" stroke-width="2"/>`;
  g += `<path d="${path(s=>s.loadW, y)}" fill="none" stroke="var(--load)" stroke-width="2"/>`;
  if (slots.some(s => s.expectedSoC > 0))
    g += `<path d="${path(s=>s.expectedSoC, ys)}" fill="none" stroke="var(--soc)" stroke-width="2.5"/>`;
  svg.innerHTML = g;
}
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
